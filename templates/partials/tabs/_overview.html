{# Overview tab content #}
<div class="tab-content" id="tab-overview">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-home"></i> Overview — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="Status" value="{{ data.get('status', 'N/A') }}" icon="fa-heartbeat"
                      status="{{ 'ok' if data.get('status') == 'Online' else 'critical' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Databases" value="{{ data.get('database_count', '\u2014') }}" icon="fa-database" status="info">
        </wdb-kpi-card>
        <wdb-kpi-card title="CPU" value="{{ data.get('cpu_percent', '\u2014') }}" unit="%" icon="fa-microchip"
                      status="{{ 'critical' if (data.get('cpu_percent', 0)|int) > 80 else 'ok' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Memory" value="{{ data.get('memory_percent', '\u2014') }}" unit="%" icon="fa-memory"
                      status="{{ 'critical' if (data.get('memory_percent', 0)|int) > 90 else 'ok' }}">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i>
        <p>Select a server to view overview</p>
    </div>
    {% endif %}
</div>
