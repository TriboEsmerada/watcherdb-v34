{# Log tab content #}
<div class="tab-content" id="tab-log">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-file-alt"></i> Log — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="Error Count" value="{{ data.get('error_count', '\u2014') }}" icon="fa-times-circle"
                      status="{{ 'critical' if (data.get('error_count', 0)|int) > 0 else 'ok' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Warning Count" value="{{ data.get('warning_count', '\u2014') }}" icon="fa-exclamation-triangle"
                      status="{{ 'warning' if (data.get('warning_count', 0)|int) > 0 else 'ok' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Last Entry" value="{{ data.get('last_entry', 'N/A') }}" icon="fa-clock" status="info">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-file-alt" style="font-size: 24px;"></i>
        <p>Select a server to view SQL Server error log</p>
    </div>
    {% endif %}
</div>
