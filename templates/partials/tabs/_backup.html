{# Backup tab content #}
<div class="tab-content" id="tab-backup">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-download"></i> Backup — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="Last Backup" value="{{ data.get('last_backup', 'N/A') }}" icon="fa-clock" status="info">
        </wdb-kpi-card>
        <wdb-kpi-card title="Backup Status" value="{{ data.get('status', 'N/A') }}" icon="fa-check-circle"
                      status="{{ 'ok' if data.get('status') == 'OK' else 'critical' }}">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-download" style="font-size: 24px;"></i>
        <p>Select a server to view backup status</p>
    </div>
    {% endif %}
</div>
