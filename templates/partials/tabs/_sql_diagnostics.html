{# SQL Diagnostics tab content #}
<div class="tab-content" id="tab-sql-diagnostics">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-stethoscope"></i> SQL Diagnostics — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="Wait Stats" value="{{ data.get('top_wait_type', 'N/A') }}" icon="fa-hourglass-half" status="info">
        </wdb-kpi-card>
        <wdb-kpi-card title="Long Queries" value="{{ data.get('long_running_queries', '\u2014') }}" icon="fa-clock"
                      status="{{ 'warning' if (data.get('long_running_queries', 0)|int) > 0 else 'ok' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Deadlocks" value="{{ data.get('deadlock_count', '\u2014') }}" icon="fa-lock"
                      status="{{ 'critical' if (data.get('deadlock_count', 0)|int) > 0 else 'ok' }}">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-stethoscope" style="font-size: 24px;"></i>
        <p>Select a server to view SQL diagnostics</p>
    </div>
    {% endif %}
</div>
