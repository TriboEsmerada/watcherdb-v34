{# Services tab content #}
<div class="tab-content" id="tab-services">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-cogs"></i> Services — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="Total Services" value="{{ data.get('total_services', '\u2014') }}" icon="fa-cogs" status="info">
        </wdb-kpi-card>
        <wdb-kpi-card title="Running" value="{{ data.get('running_services', '\u2014') }}" icon="fa-check-circle" status="ok">
        </wdb-kpi-card>
        <wdb-kpi-card title="Stopped" value="{{ data.get('stopped_services', '\u2014') }}" icon="fa-stop-circle"
                      status="{{ 'critical' if (data.get('stopped_services', 0)|int) > 0 else 'ok' }}">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-cogs" style="font-size: 24px;"></i>
        <p>Select a server to view SQL Server services</p>
    </div>
    {% endif %}
</div>
