{# Memory tab content #}
<div class="tab-content" id="tab-memory">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-memory"></i> Memory — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="Memory Usage" value="{{ data.get('memory_percent', '\u2014') }}" unit="%" icon="fa-memory"
                      status="{{ 'critical' if (data.get('memory_percent', 0)|int) > 90 else 'ok' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Total RAM" value="{{ data.get('total_ram_gb', '\u2014') }}" unit="GB" icon="fa-server" status="info">
        </wdb-kpi-card>
        <wdb-kpi-card title="SQL Memory" value="{{ data.get('sql_memory_mb', '\u2014') }}" unit="MB" icon="fa-database" status="info">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-memory" style="font-size: 24px;"></i>
        <p>Select a server to view memory metrics</p>
    </div>
    {% endif %}
</div>
