{# Security tab content #}
<div class="tab-content" id="tab-security">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-shield-alt"></i> Security — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="Sysadmin Users" value="{{ data.get('sysadmin_count', '\u2014') }}" icon="fa-user-shield"
                      status="{{ 'warning' if (data.get('sysadmin_count', 0)|int) > 5 else 'ok' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Orphan Users" value="{{ data.get('orphan_count', '\u2014') }}" icon="fa-user-times"
                      status="{{ 'warning' if (data.get('orphan_count', 0)|int) > 0 else 'ok' }}">
        </wdb-kpi-card>
        <wdb-kpi-card title="Login Failures" value="{{ data.get('login_failures', '\u2014') }}" icon="fa-lock"
                      status="{{ 'critical' if (data.get('login_failures', 0)|int) > 10 else 'ok' }}">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-shield-alt" style="font-size: 24px;"></i>
        <p>Select a server to view security analysis</p>
    </div>
    {% endif %}
</div>
