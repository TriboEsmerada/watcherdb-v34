{# Encrypted tab content #}
<div class="tab-content" id="tab-encrypted">
    <h3 style="color: #f1f5f9; margin-bottom: 16px;">
        <i class="fas fa-lock"></i> Encrypted — {{ server_id.replace('_', '\\') }}
    </h3>

    {% if data.error %}
    <div class="alert alert-warning">
        <i class="fas fa-exclamation-triangle"></i> {{ data.error }}
    </div>
    {% elif data %}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <wdb-kpi-card title="TDE Databases" value="{{ data.get('tde_count', '\u2014') }}" icon="fa-lock" status="info">
        </wdb-kpi-card>
        <wdb-kpi-card title="Encrypted Connections" value="{{ data.get('encrypted_connections', '\u2014') }}" icon="fa-shield-alt" status="ok">
        </wdb-kpi-card>
        <wdb-kpi-card title="Certificate Expiry" value="{{ data.get('cert_expiry_days', '\u2014') }}" unit="days" icon="fa-certificate"
                      status="{{ 'critical' if (data.get('cert_expiry_days', 999)|int) < 30 else 'ok' }}">
        </wdb-kpi-card>
    </div>
    {% else %}
    <div style="text-align: center; padding: 40px; color: #64748b;">
        <i class="fas fa-lock" style="font-size: 24px;"></i>
        <p>Select a server to view encryption status</p>
    </div>
    {% endif %}
</div>
