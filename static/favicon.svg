<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="irisGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#001a33;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#000000"/>
  <ellipse cx="50" cy="50" rx="42" ry="28" fill="none" stroke="#00FFFF" stroke-width="2.5" filter="url(#glow)" opacity="0.95"/>
  <circle cx="50" cy="50" r="18" fill="url(#irisGradient)"/>
  <path d="M 48 42 Q 48 38 50 38 Q 52 38 52 42 L 52 48 Q 52 52 50 52 Q 48 52 48 48 Z" fill="#00FFFF" stroke="none"/>
  <circle cx="80" cy="20" r="5" fill="#10B981"/>
