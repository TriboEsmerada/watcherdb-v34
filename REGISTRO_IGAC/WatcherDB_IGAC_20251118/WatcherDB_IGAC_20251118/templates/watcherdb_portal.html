        function renderMemoryAlerts(alerts) {
            if (!alerts || alerts.length === 0) {
                return '<div class="alert alert-success"><i class="fas fa-check-circle"></i> Configuração de memória adequada</div>';
            }
            
            let alertsHtml = '';
            alerts.forEach(alert => {
                const icon = alert.level === 'danger' ? 'fa-exclamation-triangle' : 
                           alert.level === 'warning' ? 'fa-exclamation-circle' : 
                           alert.level === 'info' ? 'fa-info-circle' : 'fa-check-circle';
                
                alertsHtml += `
                    <div class="alert alert-${alert.level}">
                        <i class="fas ${icon}"></i> ${alert.message}
                    </div>
                `;
            });
            
            return alertsHtml;
        }

                debugLog(`📡 API: ${url}`, 'info');

                const res = await createFetchWithAbort(url);
                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.error || 'Falha ao obter dados de segurança');
                }

                const summary = data.summary || {};
                const checks = data.checks || [];

                // Agrupar por categoria
                const checksByCategory = {};
                checks.forEach(check => {
                    const cat = check.category || 'Outros';
                    if (!checksByCategory[cat]) {
                        checksByCategory[cat] = [];
                    }
                    checksByCategory[cat].push(check);
                });

                // Helper para status badge
                const getStatusBadge = (status, severity) => {
                    if (status === 'pass') {
                        return '<span class="badge" style="background:#10b981; color:#fff;">✓ Pass</span>';
                    } else if (status === 'fail') {
                        const color = severity === 'critical' ? '#ef4444' : severity === 'high' ? '#f59e0b' : '#fbbf24';
                        return `<span class="badge" style="background:${color}; color:#fff;">✗ Fail</span>`;
                    } else if (status === 'warning') {
                        return '<span class="badge" style="background:#f59e0b; color:#fff;">⚠ Warning</span>';
                    } else {
                        return '<span class="badge" style="background:#6b7280; color:#fff;">? Unknown</span>';
                    }
                };

                // Helper para severity badge
                const getSeverityBadge = (severity) => {
                    const colors = {
                        'critical': '#ef4444',
                        'high': '#f59e0b',
                        'medium': '#fbbf24',
                        'low': '#60a5fa',
                        'info': '#94a3b8'
                    };
                    const labels = {
                        'critical': 'Crítico',
                        'high': 'Alto',
                        'medium': 'Médio',
                        'low': 'Baixo',
                        'info': 'Info'
                    };
                    const color = colors[severity] || '#94a3b8';
                    const label = labels[severity] || severity;
                    return `<span class="badge" style="background:${color}; color:#fff; font-size:11px;">${label}</span>`;
                };

                // Cards de resumo
                const securityScore = summary.security_score || 0;
                const scoreColor = securityScore >= 80 ? '#10b981' : securityScore >= 60 ? '#f59e0b' : '#ef4444';

                // Renderizar categorias
                let categoriesHtml = '';
                Object.keys(checksByCategory).sort().forEach(category => {
                    const categoryChecks = checksByCategory[category];
                    categoriesHtml += `
                        <div class="card" style="margin-bottom: 16px;">
                            <h4 style="margin: 0 0 16px 0; color: #60a5fa; display: flex; align-items: center; gap: 8px;">
                                <i class="fas fa-shield-alt"></i> ${category}
                                <span style="font-size: 12px; color: #94a3b8; font-weight: normal;">
                                    (${categoryChecks.length} verificação${categoryChecks.length !== 1 ? 'ões' : ''})
                                </span>
                            </h4>
                            <div style="display: grid; gap: 12px;">
                                ${categoryChecks.map(check => `
                                    <div style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px;">
                                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                                            <div style="flex: 1;">
                                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                                    <strong style="color: #e5e7eb;">${check.title}</strong>
                                                    ${getStatusBadge(check.status, check.severity)}
                                                    ${getSeverityBadge(check.severity)}
                                                </div>
                                                <p style="color: #94a3b8; font-size: 13px; margin: 4px 0;">${check.description}</p>
                                            </div>
                                        </div>
                                        ${check.current_value ? `
                                            <div style="margin-top: 8px; padding-top: 8px; border-top: 1px solid #334155;">
                                                <div style="display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 12px;">
                                                    <span style="color: #94a3b8;">Valor Atual:</span>
                                                    <span style="color: #e5e7eb;">${check.current_value}</span>
                                                    ${check.expected_value ? `
                                                        <span style="color: #94a3b8;">Esperado:</span>
                                                        <span style="color: #60a5fa;">${check.expected_value}</span>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        ` : ''}
                                        ${check.recommendation ? `
                                            <div style="margin-top: 12px; padding: 12px; background: #1e3a5f; border-left: 3px solid #60a5fa; border-radius: 4px;">
                                                <div style="display: flex; align-items: start; gap: 8px;">
                                                    <i class="fas fa-lightbulb" style="color: #60a5fa; margin-top: 2px;"></i>
                                                    <div style="flex: 1;">
                                                        <strong style="color: #93c5fd; font-size: 12px;">Recomendação:</strong>
                                                        <p style="color: #cbd5e1; font-size: 12px; margin: 4px 0 0 0;">${check.recommendation}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ` : ''}
                                        ${check.reference ? `
                                            <div style="margin-top: 8px;">
                                                <a href="${check.reference}" target="_blank" style="color: #60a5fa; font-size: 11px; text-decoration: none;">
                                                    <i class="fas fa-external-link-alt"></i> Documentação Microsoft
                                                </a>
                                            </div>
                                        ` : ''}
                                        ${check.details ? `
                                            <div style="margin-top: 8px; padding: 8px; background: #0f172a; border-radius: 4px; font-size: 11px; color: #94a3b8;">
                                                <strong>Detalhes:</strong>
                                                <ul style="margin: 4px 0 0 16px; padding: 0;">
                                                    ${Object.entries(check.details).map(([key, value]) => {
                                                        if (Array.isArray(value)) {
                                                            return `<li>${key}: ${value.slice(0, 5).join(', ')}${value.length > 5 ? ` (+${value.length - 5} mais)` : ''}</li>`;
                                                        }
                                                        return `<li>${key}: ${value}</li>`;
                                                    }).join('')}
                                                </ul>
                                            </div>
                                        ` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });

            content.innerHTML = `
                    <div class="stats-grid" style="grid-template-columns: repeat(6, 1fr); margin-bottom: 16px;">
                        <div class="stat-card" style="background: linear-gradient(135deg, ${scoreColor}22, ${scoreColor}11); border: 2px solid ${scoreColor};">
                            <div class="label">Security Score</div>
                            <div class="value" style="color: ${scoreColor}; font-size: 32px; font-weight: bold;">${securityScore}%</div>
                </div>
                        <div class="stat-card green">
                            <div class="label">Passed</div>
                            <div class="value">${summary.passed || 0}</div>
                        </div>
                        <div class="stat-card" style="background: #ef4444;">
                            <div class="label">Failed</div>
                            <div class="value">${summary.failed || 0}</div>
                        </div>
                        <div class="stat-card" style="background: #f59e0b;">
                            <div class="label">Warnings</div>
                            <div class="value">${summary.warnings || 0}</div>
                        </div>
                        <div class="stat-card" style="background: #ef4444;">
                            <div class="label">Critical</div>
                            <div class="value">${summary.critical_issues || 0}</div>
                        </div>
                        <div class="stat-card" style="background: #f59e0b;">
                            <div class="label">High</div>
                            <div class="value">${summary.high_issues || 0}</div>
                        </div>
                    </div>

                    <div class="card" style="margin-bottom: 16px;">
                        <h4 style="margin: 0 0 12px 0; color: #60a5fa;">
                            <i class="fas fa-info-circle"></i> Sobre as Verificações
                        </h4>
                        <p style="color: #94a3b8; font-size: 13px; line-height: 1.6; margin: 0;">
                            Esta análise verifica configurações de segurança do SQL Server de forma <strong>passiva</strong> (apenas consultas, sem testes ativos).
                            As verificações são baseadas nas melhores práticas da Microsoft e não disparam alertas de segurança.
                            Recomenda-se revisar e corrigir os itens marcados como "Fail" ou "Warning", especialmente os de severidade "Critical" ou "High".
                        </p>
                    </div>

                    ${categoriesHtml}
                `;

                debugLog(`✅ Security Analysis carregado: ${checks.length} verificações`, 'success');
            } catch (error) {
                debugLog(`❌ Erro ao carregar Security Analysis: ${error.message}`, 'error');
                content.innerHTML = `
                    <div class="card" style="border-left: 4px solid #ef4444;">
                        <h4 style="color: #ef4444; margin: 0 0 12px 0;">
                            <i class="fas fa-exclamation-triangle"></i> Erro ao Carregar Análise de Segurança
                        </h4>
                        <p style="color: #94a3b8; margin: 0;">${error.message}</p>
                    </div>
                `;
            }
        }

        async function loadBackupAnalysis() {
            const content = activeTabId ? openTabs.get(activeTabId)?.contentElement : document.getElementById('contentArea');
            if (!content) return;
            const serverId = selectedServer.server_id;
            debugLog(`💾 Carregando Backup Analysis...`, 'info');
            debugLog(`🔑 Server ID: ${serverId}`, 'info');

            content.innerHTML = createPremiumLoading('Carregando análise de backups...');

            try {
                const lookbackDays = parseInt(localStorage.getItem('backup_days')||'7',10);
                const includeSystem = (localStorage.getItem('backup_include_system')||'false') === 'true';
                const url = `/api/monitoring/backup/server/${serverId}/summary?days=${lookbackDays}${includeSystem ? '&include_system=true' : ''}`;
                debugLog(`📡 API: ${url}`, 'info');

                const res = await fetch(url);
                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.error || 'Falha ao obter dados');
                }

                const items = data.items || [];
                const issues = items.filter(i => i.issues && i.issues.length > 0);

                // Buscar padrões/gaps para compor coluna "Padrão" para TODAS as databases
                try {
                  const pattRes = await fetch(`/api/monitoring/backup/server/${serverId}/patterns?days=${Math.max(lookbackDays,30)}`);
                  const patt = await pattRes.json();
                  if (patt.success) {
                    const dbMap = patt.databases || {};
                    // Aplicar padrões para TODAS as databases, não apenas as com issues
                    items.forEach(it => {
                      const p = dbMap[it.database_name] || {};
                      const log = p.LOG || {}; const diff = p.DIFF || {}; const full = p.FULL || {};
                      const fmtInt = (v,unit) => v ? `${v}${unit}` : 'n/d';
                      const fmtHour = (h) => (h || h === 0) ? `${String(h).padStart(2,'0')}:00` : 'n/d';
                      // FULL: converter horas -> dias e exibir hora típica
                      const fullDays = full.interval_hours ? Math.round(full.interval_hours/24) : null;
                      const fullStr = fullDays ? `${fullDays}d @ ${fmtHour(full.hour_of_day)}` : 'n/d';
                      const diffStr = `${fmtInt(diff.interval_hours,'h')} @ ${fmtHour(diff.hour_of_day)}`;
                      const logStr  = `${fmtInt(log.interval_hours,'h')} @ ${fmtHour(log.hour_of_day)}`;
                      it._pattern = `LOG ${logStr} • DIFF ${diffStr} • FULL ${fullStr}`;
                      if (log.delayed_now || diff.delayed_now || full.delayed_now) {
                        it._gapBadge = ' ' + renderIssueBadge('GAP detectado');
                      } else {
                        it._gapBadge = '';
                      }
                    });
                  }
                } catch (e) { 
                  debugLog(`⚠️ Erro ao buscar padrões: ${e.message}`, 'warning');
                }

                // Helpers de formatação
                const fmt = (v) => v ? String(v).replace('T', ' ') : 'N/A';
                const renderIssueBadge = (txt) => `<span class=\"badge badge-warning\">${txt}</span>`;

                // Tabela de issues
                const issuesTable = issues.length === 0
                  ? '<div class="no-data">Nenhuma issue de backup detectada</div>'
                  : `
                    <div class="table-container" style="margin-top: 16px;">
                      <table style=\"width:100%; border-collapse: collapse; color:#e5e7eb; font-size:13px;\">
                        <thead>
                          <tr style=\"background:#0f172a; text-align:left;\">
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">Database</th>
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">Recovery Model</th>
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">Último FULL</th>
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">Último DIFF</th>
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">Último LOG</th>
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">Padrão</th>
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">Issues</th>
                            <th style=\"padding:10px; border-bottom:1px solid #334155;\">TDP</th>
                          </tr>
                        </thead>
                        <tbody id=\"backupIssuesTbody\">
                          ${issues.map(it => `
                            <tr>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${it.database_name}</td>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${it.recovery_model || 'N/A'}</td>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${fmt(it.last_full)}${it.last_full ? ` <span style=\\"color:#9ca3af;\\">(${Math.round((Date.now()-Date.parse(it.last_full))/3600000)}h)</span>` : ''}</td>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${fmt(it.last_diff)}</td>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${fmt(it.last_log)}${it.last_log ? ` <span style=\\"color:#9ca3af;\\">(${Math.round((Date.now()-Date.parse(it.last_log))/3600000)}h)</span>` : ''}</td>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${it._pattern || '...'}</td>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${(it.issues && it.issues.length) ? (it.issues.map(renderIssueBadge).join(' ')) : '<span class=\\"badge\\">OK</span>'}${it._gapBadge || ''}</td>
                              <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${(it.tdp_error_count||0) > 0 ? renderIssueBadge('TDP ' + it.tdp_error_count) : '<span class=\\"badge\\">OK</span>'}${(it.tdp_samples && it.tdp_samples.length) ? `<div style=\\"color:#9ca3af; font-size:12px; margin-top:6px;\\">${it.tdp_samples.map(s => s.replace(/</g,'&lt;')).join('<br>')}</div>` : ''}</td>
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>`;

                content.innerHTML = `
                  <div class=\"stats-grid\">
                    <div class=\"stat-card green\">
                      <div class=\"label\">Databases</div>
                      <div class=\"value\">${data.total_databases || items.length}</div>
                    </div>
                    <div class=\"stat-card yellow\">
                      <div class=\"label\">Com Issues</div>
                      <div class=\"value\">${issues.length}</div>
                    </div>
                    <div class=\"stat-card\" style=\"background:#1f2937;\">
                      <div class=\"label\">Servidor</div>
                      <div class=\"value\" style=\"font-size:18px\">${serverId}</div>
                    </div>
                  </div>

                  <div class=\"card\">
                    <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:12px;\">
                      <h4 style=\"margin:0\">Databases com Issues</h4>
                      <div style=\"display:flex; gap:8px; align-items:center;\">
                        <label style=\"color:#9ca3af; font-size:12px;\">Período:</label>
                        <select id=\"backupDaysSelect\" style=\"background:#0b1220; color:#e5e7eb; border:1px solid #1f2937; padding:4px 8px; border-radius:6px;\">
                          <option value=\"1\">1 dia</option>
                          <option value=\"3\">3 dias</option>
                          <option value=\"7\" selected>7 dias</option>
                          <option value=\"14\">14 dias</option>
                          <option value=\"30\">30 dias</option>
                        </select>
                        <label style=\"color:#9ca3af; font-size:12px; margin-left:10px;\">Ordenar:</label>
                        <select id=\"backupSortSelect\" style=\"background:#0b1220; color:#e5e7eb; border:1px solid #1f2937; padding:4px 8px; border-radius:6px;\">
                          <option value=\"severity\">Severidade</option>
                          <option value=\"age_full\">Idade FULL</option>
                          <option value=\"age_log\">Idade LOG</option>
                          <option value=\"name\">Nome</option>
                        </select>
                        <label style=\"color:#9ca3af; font-size:12px; margin-left:10px;\">Filtro:</label>
                        <select id=\"backupFilterSelect\" style=\"background:#0b1220; color:#e5e7eb; border:1px solid #1f2937; padding:4px 8px; border-radius:6px;\">
                          <option value=\"all\">Todos</option>
                          <option value=\"full\">Sem FULL</option>
                          <option value=\"log\">Sem LOG</option>
                          <option value=\"full_models\">Apenas FULL/BULK_LOGGED</option>
                        </select>
                        <label for=\"backupIncludeSystemChk\" style=\"color:#9ca3af; font-size:12px; margin-left:10px;\">Incluir sistema</label>
                        <input id=\"backupIncludeSystemChk\" type=\"checkbox\" style=\"accent-color:#3b82f6; width:16px; height:16px; cursor:pointer;\" />
                        <button id=\"backupExportBtn\" class=\"btn\" style=\"margin-left:10px;\">Exportar CSV</button>
                        <span class=\"badge\" style=\"background:#0f172a; color:#93c5fd; border:1px solid #1f2937\">Janela analisada: últimos ${lookbackDays} dias</span>
                      </div>
                    </div>
                    ${issuesTable}
                  </div>
                `;

                // Eventos dos controles
                const daysSel = document.getElementById('backupDaysSelect');
                const sortSel = document.getElementById('backupSortSelect');
                const includeSystemChk = document.getElementById('backupIncludeSystemChk');
                daysSel.value = String(lookbackDays);
                includeSystemChk.checked = (localStorage.getItem('backup_include_system')||'false') === 'true';
                daysSel.onchange = () => {
                  localStorage.setItem('backup_days', daysSel.value);
                  loadBackupAnalysis();
                };
                includeSystemChk.onchange = () => {
                  localStorage.setItem('backup_include_system', includeSystemChk.checked ? 'true' : 'false');
                  loadBackupAnalysis();
                };
                const applyRender = () => {
                  localStorage.setItem('backup_sort', sortSel.value);
                  localStorage.setItem('backup_filter', filterSel.value);
                  // filtrar e ordenar
                  let dataToRender = [...issues];
                  if (filterSel.value==='full') {
                    dataToRender = dataToRender.filter(it => (it.issues||[]).some(s=>s.toLowerCase().includes('full')));
                  } else if (filterSel.value==='log') {
                    dataToRender = dataToRender.filter(it => (it.issues||[]).some(s=>s.toLowerCase().includes('log')));
                  } else if (filterSel.value==='full_models') {
                    dataToRender = dataToRender.filter(it => ['FULL','BULK_LOGGED'].includes((it.recovery_model||'').toUpperCase()));
                  }
                  const sorted = dataToRender.sort((a,b)=>{
                    const sevA = (a.issues||[]).length; const sevB = (b.issues||[]).length;
                    const ageFullA = a.last_full ? (Date.now()-Date.parse(a.last_full))/3600000 : 999999;
                    const ageFullB = b.last_full ? (Date.now()-Date.parse(b.last_full))/3600000 : 999999;
                    const ageLogA = a.last_log ? (Date.now()-Date.parse(a.last_log))/3600000 : 999999;
                    const ageLogB = b.last_log ? (Date.now()-Date.parse(b.last_log))/3600000 : 999999;
                    const key = sortSel.value;
                    if (key==='name') return a.database_name.localeCompare(b.database_name);
                    if (key==='age_full') return ageFullB - ageFullA;
                    if (key==='age_log') return ageLogB - ageLogA;
                    return sevB - sevA;
                  });
                  // re-render rápido substituindo tbody
                  const tbody = document.querySelector('#backupIssuesTbody');
                  if (!tbody) return;
                  tbody.innerHTML = sorted.map(it => `
                    <tr>
                      <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${it.database_name}</td>

                      <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${(it.issues && it.issues.length) ? (it.issues.map(renderIssueBadge).join(' ')) : '<span class=\\"badge\\">OK</span>'}${it._gapBadge || ''}</td>
                      <td style=\"padding:10px; border-bottom:1px solid #1f2937;\">${(it.tdp_error_count||0) > 0 ? renderIssueBadge('TDP ' + it.tdp_error_count) : '<span class=\\"badge\\">OK</span>'}${(it.tdp_samples && it.tdp_samples.length) ? `<div style=\\"color:#9ca3af; font-size:12px; margin-top:6px;\\">${it.tdp_samples.map(s => s.replace(/</g,'&lt;')).join('<br>')}</div>` : ''}</td>

        }

        // ========================================

        async function loadLogAnalysis() {
            const content = activeTabId ? openTabs.get(activeTabId)?.contentElement : document.getElementById('contentArea');
            if (!content) return;
            const serverId = selectedServer.server_id;
            debugLog(`📋 Carregando Log Analysis...`, 'info');
            debugLog(`🔑 Server ID: ${serverId}`, 'info');

            content.innerHTML = createPremiumLoading('Carregando análise de logs...');

            try {
                const hours = parseInt(localStorage.getItem('log_hours')||'24',10);
                const logType = localStorage.getItem('log_type') || 'all';

                // Buscar logs do Windows e SQL Server em paralelo
                const [windowsLogsRes, sqlLogsRes] = await Promise.all([
                    createFetchWithAbort(`/api/monitoring/windows-events/${serverId}?hours=${hours}`).catch(() => null),
                    createFetchWithAbort(`/api/monitoring/sql-errors/${serverId}?hours=${hours}`).catch(() => null)
                ]);

                // Verificar se as requisições foram bem-sucedidas
                let windowsData, sqlData;
                
                if (!windowsLogsRes || !windowsLogsRes.ok || windowsLogsRes.status === 404) {
                    windowsData = { success: false, error: windowsLogsRes && windowsLogsRes.status === 404 ? 'Endpoint não disponível' : 'Erro ao conectar', events: [] };
                    debugLog(`❌ Windows logs response error: ${windowsLogsRes?.status || 'no response'}`, 'error');
                } else {
                    try {
                        windowsData = await windowsLogsRes.json();
                        debugLog(`✅ Windows logs response OK: success=${windowsData.success}, events=${windowsData.events?.length || 0}`, 'info');
                    } catch (e) {
                        windowsData = { success: false, error: 'Erro ao processar resposta', events: [] };
                        debugLog(`❌ Erro ao parsear Windows logs JSON: ${e.message}`, 'error');
                    }
                }
                
                if (!sqlLogsRes || !sqlLogsRes.ok || sqlLogsRes.status === 404) {
                    sqlData = { success: false, error: sqlLogsRes && sqlLogsRes.status === 404 ? 'Endpoint não implementado ainda' : 'Erro ao conectar', errors: [] };
                } else {
                    try {
                        sqlData = await sqlLogsRes.json();
                    } catch (e) {
                        sqlData = { success: false, error: 'Erro ao processar resposta', errors: [] };
                    }
                }

                const windowsEvents = windowsData.success && windowsData.events ? windowsData.events : [];
                const sqlErrors = sqlData.success && sqlData.errors ? sqlData.errors : [];

                debugLog(`📊 Dados recebidos - Windows success: ${windowsData.success}, Events: ${windowsEvents.length}, SQL success: ${sqlData.success}, Errors: ${sqlErrors.length}`, 'info');

                // Usar o mesmo elemento que foi usado para o loading
                const targetContent = activeTabId ? openTabs.get(activeTabId)?.contentElement : document.getElementById('contentArea');
                renderLogAnalysis({
                    windowsEvents,
                    sqlErrors,
                    windowsSuccess: windowsData.success !== false,
                    sqlSuccess: sqlData.success !== false,

                }, serverId, hours, logType, targetContent);

            } catch (err) {

        async function showOverflowDetails(serverId) {
            debugLog('🔴 Carregando análise preditiva de overflow...', 'info');
            
            try {
                // Buscar dados do servidor
                const response = await fetch(`/api/monitoring/space/server/${serverId}?t=${Date.now()}`);
                const json = await response.json();

                if (!data || data.error) throw new Error(data?.error || 'Dados inválidos');
                
                // Separar filegroups por categoria
                const analysis = analyzeFilegroups(data.filegroups || []);
                const volumesOverflow = data.volumes_overflow || [];
                
                debugLog(`📊 Análise: ${analysis.currentOverflow.length} overflow, ${analysis.risk30days.length} em risco 30d, ${analysis.risk60days.length} em risco 60d`, 'info');

            }
        }

        // ============================================================================
        // ANÁLISE PREDITIVA DE FILEGROUPS
        // ============================================================================
        function analyzeFilegroups(filegroups) {
            const currentOverflow = [];
            const risk1day = [];
            const risk7days = [];
            const risk30days = [];
            const risk60days = [];
            const safe = [];
            
            filegroups.forEach(fg => {
                // Só analisa DATA files (backend retorna 'ROWS' para DATA files)
                if (fg.filegroup_type !== 'ROWS') return;
                
                // Calcular baseado na soma dos datafiles do filegroup
                const totalMB = (fg.total_gb || 0) * 1024;
                const maxMB = (fg.max_gb || 0) * 1024;
                const usedMB = (fg.used_gb || 0) * 1024;
                const diskAvailGB = fg.available_disk_gb || 0;
                
                // Ignora UNLIMITED
                if (maxMB >= 999999) return;
                
                // Espaço disponível = (soma maxsize dos datafiles) - (soma tamanho atual dos datafiles)
                const currentGB = totalMB / 1024;  // Soma do tamanho atual de todos os datafiles
                const maxGB = maxMB / 1024;       // Soma do maxsize de todos os datafiles
                const availableGB = maxGB - currentGB;  // Espaço disponível real
                const usedPercent = (usedMB / totalMB) * 100;
                
                // Calcular taxa de crescimento (estimativa: 1-2% ao mês)
                // Em produção, isso viria do histórico Oracle
                const monthlyGrowthRate = estimateGrowthRate(totalMB, usedPercent);
                const growth1day = currentGB * monthlyGrowthRate / 30;
                const growth7days = currentGB * monthlyGrowthRate / 4.3; // 7 dias = 1/4.3 do mês
                const growth30days = currentGB * monthlyGrowthRate;
                const growth60days = currentGB * monthlyGrowthRate * 2;
                
                const projected1day = currentGB + growth1day;
                const projected7days = currentGB + growth7days;
                const projected30days = currentGB + growth30days;
                const projected60days = currentGB + growth60days;
                
                // Verificar limites baseado na soma dos datafiles
                const maxSizeLimit = maxGB;  // Soma do maxsize de todos os datafiles
                const diskLimit = diskAvailGB;  // Espaço disponível no disco
                const effectiveLimit = Math.min(maxSizeLimit, currentGB + diskLimit);
                
                // Espaço disponível real = menor entre (maxsize - atual) e (disco disponível)
                const realAvailableSpace = Math.min(availableGB, diskAvailGB);
                
                const fgAnalysis = {
                    database_name: fg.database_name,
                    filegroup_name: fg.filegroup_name,
                    current_gb: currentGB,
                    used_percent: usedPercent,
                    max_gb: maxGB,
                    disk_available_gb: diskAvailGB,
                    effective_limit: effectiveLimit,
                    real_available_space: realAvailableSpace,  // Espaço disponível real baseado na soma dos datafiles
                    growth_rate_monthly: monthlyGrowthRate * 100,
                    projected_1day: projected1day,
                    projected_7days: projected7days,
                    projected_30days: projected30days,
                    projected_60days: projected60days,
                    days_to_limit: calculateDaysToLimit(currentGB, effectiveLimit, monthlyGrowthRate),
                    volume: fg.volume,
                    limit_type: maxSizeLimit < diskLimit ? 'MAXSIZE' : 'DISK'
                };
                
                // Categorizar por risco (ordem de prioridade: mais urgente primeiro)
                if (fg.disk_overflow_risk === true) {
                    // Já está em overflow
                    currentOverflow.push(fgAnalysis);
                } else if (projected1day >= effectiveLimit * 0.99) {
                    // Vai atingir 99% do limite em 1 dia - URGENTE!
                    risk1day.push(fgAnalysis);
                } else if (projected7days >= effectiveLimit * 0.98) {
                    // Vai atingir 98% do limite em 7 dias - CRÍTICO!
                    risk7days.push(fgAnalysis);
                } else if (projected30days >= effectiveLimit * 0.95) {
                    // Vai atingir 95% do limite em 30 dias
                    risk30days.push(fgAnalysis);
                } else if (projected60days >= effectiveLimit * 0.90) {
                    // Vai atingir 90% do limite em 60 dias
                    risk60days.push(fgAnalysis);
                } else {
                    safe.push(fgAnalysis);
                }
            });
            
            return {
                currentOverflow: currentOverflow.sort((a, b) => b.current_gb - a.current_gb),
                risk1day: risk1day.sort((a, b) => a.days_to_limit - b.days_to_limit),
                risk7days: risk7days.sort((a, b) => a.days_to_limit - b.days_to_limit),
                risk30days: risk30days.sort((a, b) => a.days_to_limit - b.days_to_limit),
                risk60days: risk60days.sort((a, b) => a.days_to_limit - b.days_to_limit),
                safe: safe,
                totalDataFilegroups: currentOverflow.length + risk1day.length + risk7days.length + risk30days.length + risk60days.length + safe.length
            };
        }

        function estimateGrowthRate(totalMB, usedPercent) {
            // Estimativa baseada no tamanho e uso atual
            // Em produção, você usaria dados históricos do Oracle
            
            if (totalMB < 10240) { // < 10GB
                return 0.02; // 2% ao mês (crescimento mais rápido em DBs pequenos)
            } else if (totalMB < 102400) { // < 100GB
                return 0.015; // 1.5% ao mês
            } else if (totalMB < 1048576) { // < 1TB
                return 0.01; // 1% ao mês
            } else {
                return 0.005; // 0.5% ao mês (DBs muito grandes crescem mais devagar percentualmente)
            }
        }

        function calculateDaysToLimit(currentGB, limitGB, monthlyGrowthRate) {
            if (currentGB >= limitGB) return 0;
            
            const remainingGB = limitGB - currentGB;
            const dailyGrowth = (currentGB * monthlyGrowthRate) / 30;
            
            if (dailyGrowth <= 0) return 999;
            
            return Math.floor(remainingGB / dailyGrowth);
        }

            let html = `

        // ========================================
        // TOGGLE DATABASE

        async function toggleDatabase(dbName, serverId, dbId) {
            debugLog(`📽 Toggle: ${dbName}`, 'info');
            
            const fgRow = document.getElementById(`fg-row-${dbId}`);
            const toggleBtn = document.getElementById(`toggle-${dbId}`);
            const fgContent = document.getElementById(`fg-content-${dbId}`);
            
            if (fgRow.style.display === 'table-row') {
                fgRow.style.display = 'none';
                toggleBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
                debugLog(`✅ ${dbName} colapsado`, 'success');
                return;
            }
            
            toggleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            fgContent.innerHTML = 'Carregando filegroups...';
            
            try {
                const apiUrl = `/api/monitoring/space/database/${serverId}/${encodeURIComponent(dbName)}/filegroups?t=${Date.now()}`;
                debugLog(`📡 API: ${apiUrl}`, 'info');
                
                const response = await fetch(apiUrl);
                const result = await response.json();
                
                if (!result.success || !result.filegroups) {
                    throw new Error(result.error || 'Sem filegroups');
                }
                
                debugLog(`✅ ${result.filegroups.length} filegroups`, 'success');
                
                // DEBUG: Verificar dados recebidos
                if (result.filegroups && result.filegroups.length > 0) {
                    const firstFg = result.filegroups[0];
                    debugLog(`🔍 DEBUG - Primeiro filegroup:`, 'info');
                    debugLog(`   - filegroup_name: ${firstFg.filegroup_name}`, 'info');
                    debugLog(`   - total_gb: ${firstFg.total_gb}`, 'info');
                    debugLog(`   - used_gb: ${firstFg.used_gb}`, 'info');
                    debugLog(`   - free_percent: ${firstFg.free_percent}`, 'info');
                    debugLog(`   - free_mb: ${firstFg.free_mb}`, 'info');
                    console.log('🔍 FREE_MB DEBUG:', firstFg.free_mb);
                }
                
                let html = `
                    <table class="nested-table">
                        <thead>
                            <tr>
                                <th style="padding-left: 32px;">FileGroup</th>
                                <th style="text-align: right;">Total MB</th>
                                <th style="text-align: right;">Max MB</th>
                                <th style="text-align: right;">Used MB</th>
                                <th style="text-align: right;">Free MB</th>
                                <th style="text-align: right;">Free %</th>
                                <th style="text-align: center;">Files</th>
                                <th style="text-align: center;">Status</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                result.filegroups.forEach(fg => {
                    console.log('🔍 DEBUG Filegroup:', fg.filegroup_name, 'Total GB:', fg.total_gb, 'Max GB:', fg.max_gb, 'Used GB:', fg.used_gb, 'Free GB:', fg.free_gb);

                    // ✅ CORRIGIDO v1.4.8.2: Usar valores reais do backend, estimar apenas se não existirem
                    if (fg.total_gb > 0) {
                        // Se used_gb não vier do backend ou for inválido, estimar
                        if (!fg.used_gb || fg.used_gb === 0 || isNaN(fg.used_gb)) {
                            fg.used_gb = fg.total_gb * 0.75; // Estimativa apenas como fallback
                            console.log('⚠️ ESTIMATION - No used_gb from backend for:', fg.filegroup_name);
                        }
                        fg.free_gb = fg.total_gb - fg.used_gb;
                        fg.free_percent = ((fg.free_gb / fg.total_gb) * 100).toFixed(1);
                    }

                    // ✅ CORRIGIDO: Garantir que free_percent seja sempre um número
                    if (typeof fg.free_percent === 'string') {
                        fg.free_percent = parseFloat(fg.free_percent) || 0;
                    }
                    if (isNaN(fg.free_percent)) {
                        fg.free_percent = 0;
                    }
                    
                    const isLogFg = (fg.filegroup_name || '').toUpperCase() === 'LOG';
                    const statusClass = 
                        (!isLogFg && fg.alert_level === 'DISK_OVERFLOW') ? 'overflow' :
                        fg.alert_level === 'CRITICAL' ? 'critical' :
                        fg.alert_level === 'HIGH' ? 'high' :
                        fg.alert_level === 'MEDIUM' ? 'medium' : 'ok';
                    
                    const fgId = `${dbId}-${fg.filegroup_name.replace(/[^a-zA-Z0-9]/g, '_')}`;
                    
                    const dbNameEscaped = dbName.replace(/'/g, "\\'");
                    const fgNameEscaped = fg.filegroup_name.replace(/'/g, "\\'");
                    const serverIdEscaped = serverId.replace(/'/g, "\\'");
                    
                    html += `
                        <tr>
                            <td style="padding-left: 32px;">
                                <button class="toggle-btn" id="toggle-fg-${fgId}"

        // ========================================
        // TOGGLE FILEGROUP
        // ========================================
        async function toggleFilegroup(dbName, fgName, serverId, fgId) {
            debugLog(`📂 Toggle Filegroup: ${fgName}`, 'info');
            
            const filesRow = document.getElementById(`files-row-${fgId}`);
            const toggleBtn = document.getElementById(`toggle-fg-${fgId}`);
            const filesContent = document.getElementById(`files-content-${fgId}`);
            
            if (filesRow.style.display === 'table-row') {
                filesRow.style.display = 'none';
                toggleBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
                debugLog(`✅ ${fgName} colapsado`, 'success');
                return;
            }
            
            toggleBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            filesContent.innerHTML = '<div style="color: #60a5fa;">Carregando datafiles...</div>';
            
            try {
                const apiUrl = `/api/monitoring/space/database/${serverId}/${encodeURIComponent(dbName)}/files`;
                debugLog(`📡 API Files: ${apiUrl}`, 'info');
                
                const response = await fetch(apiUrl);
                const result = await response.json();
                
                if (!result.success || !result.files) {
                    throw new Error(result.error || 'Sem datafiles');
                }
                
                const filesInFg = result.files.filter(f => f.filegroup_name === fgName);
                
                debugLog(`✅ ${filesInFg.length} files no FG "${fgName}"`, 'success');
                
                if (filesInFg.length === 0) {
                    throw new Error(`Nenhum file encontrado no filegroup "${fgName}"`);
                }
                
                let html = `
                    <div style="background: #000; padding: 12px; border-left: 4px solid #3b82f6;">
                        <div style="color: #60a5fa; font-weight: bold; margin-bottom: 12px; font-size: 13px;">
                            📄 DATAFILES (${filesInFg.length} arquivos)
                        </div>
                        <table class="nested-table" style="font-size: 12px;">
                            <thead>
                                <tr>
                                    <th style="padding-left: 48px; min-width: 250px;">Logical Name</th>
                                    <th style="text-align: right;">Current MB</th>
                                    <th style="text-align: right;">Max MB</th>
                                    <th style="text-align: left;">Growth</th>
                                    <th style="text-align: center;">Type</th>
                                    <th style="text-align: center;">Volume</th>
                                    <th style="text-align: right;">Disk Avail GB</th>
                                    <th style="text-align: center;">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                filesInFg.forEach(file => {
                    const currentMB = parseFloat(file.current_size_mb) || 0;
                    const maxMB = parseFloat(file.max_size_mb) || 0;
                    const diskAvailGB = parseFloat(file.disk_available_gb) || 0;
                    const maxSizeStr = file.max_size_formatted || 'UNLIMITED';
                    const fileType = (file.file_type || '').toUpperCase();
                    // Corrigido: overflow apenas para DATA (ROWS)
                    const isDataFile = (fileType === 'ROWS');
                    const hasOverflow = isDataFile && 
                                       maxSizeStr !== 'UNLIMITED' && 
                                       (maxMB / 1024) > diskAvailGB && 
                                       diskAvailGB > 0;
                    
                    let statusClass = 'ok';
                    let statusText = 'OK';
                    let rowStyle = '';
                    
                    if (hasOverflow) {
                        statusClass = 'overflow';
                        statusText = 'OVERFLOW';
                        rowStyle = 'background: rgba(127, 29, 18, 0.3);';
                    } else if (maxSizeStr === 'UNLIMITED') {
                        statusText = 'UNLIMITED';
                    } else if (!isDataFile) {
                        // LOG files nunca mostram OVERFLOW
                        statusText = 'LOG FILE';
                        statusClass = 'ok';
                    }
                    
                    const logicalNameDisplay = file.logical_name.length > 35 
                        ? file.logical_name.substring(0, 32) + '...'
                        : file.logical_name;
                    
                    html += `
                        <tr style="${rowStyle}">
                            <td style="padding-left: 48px;" title="${file.physical_name}">
                                <i class="fas fa-file-alt" style="color: #60a5fa; margin-right: 6px;"></i>
                                <span style="font-family: monospace; font-size: 11px;">${logicalNameDisplay}</span>
                            </td>
                            <td style="text-align: right; font-family: monospace;">${currentMB.toFixed(2)}</td>
                            <td style="text-align: right; font-family: monospace; ${hasOverflow ? 'color: #fca5a5; font-weight: bold;' : ''}">${maxMB.toFixed(2)}</td>
                            <td style="text-align: left; font-size: 11px;">${file.growth_increment || 'N/A'}</td>
                            <td style="text-align: center;">
                                <span style="background: ${file.file_type === 'ROWS' ? '#065f46' : '#1e3a8a'}; 
                                             padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold;">
                                    ${file.file_type || 'N/A'}
                                </span>
                            </td>
                            <td style="text-align: center; font-family: monospace; font-size: 11px; font-weight: bold;">
                                ${file.volume || 'N/A'}
                            </td>
                            <td style="text-align: right; font-family: monospace; ${diskAvailGB < 100 ? 'color: #fbbf24;' : ''}">${diskAvailGB.toFixed(2)}</td>
                            <td style="text-align: center;">
                                <span class="badge ${statusClass}" style="font-size: 9px;">${statusText}</span>
                            </td>
                        </tr>
                    `;
                });
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                
                filesContent.innerHTML = html;
                filesRow.style.display = 'table-row';
                toggleBtn.innerHTML = '<i class="fas fa-chevron-down"></i>';
                debugLog(`✅ Filegroup "${fgName}" expandido com ${filesInFg.length} files`, 'success');
                
            } catch (error) {
                debugLog(`❌ Erro no Filegroup: ${error.message}`, 'error');
                filesContent.innerHTML = `
                    <div style="color: #fca5a5; padding: 16px; background: #7f1d1d; border-radius: 6px; border-left: 4px solid #dc2626;">
                        <i class="fas fa-exclamation-triangle"></i> <strong>Erro:</strong> ${error.message}
                    </div>
                `;
                filesRow.style.display = 'table-row';
                toggleBtn.innerHTML = '<i class="fas fa-exclamation-triangle" style="color: #ef4444;"></i>';
            }
        }

        /**
         * Gera relatório preditivo de crescimento de filegroup
         * Chama a API que executa os scripts Python de Machine Learning
         */
        async function generateReport(serverId, databaseName, filegroupName) {
            debugLog(`📊 Gerando relatório preditivo: ${filegroupName}`, 'info');
            debugLog(`🔑 Server ID: ${serverId}`, 'info');
            debugLog(`🗄️ Database: ${databaseName}`, 'info');

            // Abre o modal com loading
            openReportModal(serverId, databaseName, filegroupName);

            try {
                const apiUrl = '/api/monitoring/space/filegroup/generate-report';
                debugLog(`📡 POST ${apiUrl}`, 'info');

                const requestBody = {
                    server_id: serverId,
                    database_name: databaseName,
                    filegroup_name: filegroupName,
                    forecast_days: 60,     // Previsão de 60 dias
                    threshold: 0.85        // Alerta em 85% de uso
                };

                debugLog(`📤 Request: ${JSON.stringify(requestBody)}`, 'info');

                // Chama a API (pode demorar 30-60 segundos - Oracle + ML)
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
            
                debugLog(`📥 Response status: ${response.status}`, response.ok ? 'success' : 'error');
            
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }
            
                // A API retorna HTML direto (HTMLResponse)
                const htmlContent = await response.text();

                debugLog(`✅ Relatório HTML recebido (${htmlContent.length} chars)`, 'success');

                // Headers com metadados do relatório
                const reportPath = response.headers.get('X-Report-Path');
                const csvPath = response.headers.get('X-CSV-Path');
                const generatedAt = response.headers.get('X-Generated-At');

                if (reportPath) debugLog(`💾 Report saved: ${reportPath}`, 'info');
                if (csvPath) debugLog(`📁 CSV saved: ${csvPath}`, 'info');
                if (generatedAt) debugLog(`🕐 Generated: ${generatedAt}`, 'info');

                // Exibe o relatório no modal
                displayReport(htmlContent);
            
            } catch (error) {
                debugLog(`❌ Erro: ${error.message}`, 'error');
                showReportError(error.message);
            }
        }

        /**
         * Exibe o relatório HTML no iframe do modal
         */
        function displayReport(htmlContent) {
            // Criar blob do HTML
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            
            // Abrir em nova aba

            debugLog('📥 Exportando alertas agregados para CSV...', 'info');

                // Montar CSV com campos agregados
                let csv = 'Severity,Type,Database,FileGroup,Total Files,Files At Limit,Files With Space,';
                csv += 'Total Size GB,Total MAXSIZE GB,Available Growth GB,Current Usage %,Predicted 30d %,';
                csv += 'Days Until Full,Growth GB/day,Risk Type,Recommendation\n';
                
                data.alerts.forEach(alert => {
                    csv += `"${alert.severity}","${alert.alert_type}","${alert.database_name}","${alert.filegroup_name}",`;

                    csv += `${alert.total_size_gb.toFixed(2)},${alert.total_maxsize_gb.toFixed(2)},${alert.available_growth_gb.toFixed(2)},`;
                    csv += `${alert.current_usage_percent},${alert.predicted_usage_percent},${alert.days_until_full},`;
                    csv += `${alert.estimated_growth_per_day_gb},"${alert.risk_type}","${alert.recommendation}"\n`;

                // Download

                link.download = `predictive_alerts_aggregated_${serverId}_${new Date().toISOString().split('T')[0]}.csv`;

                debugLog('✅ CSV agregado exportado com sucesso', 'success');
                
            } catch (error) {
                debugLog(`❌ Erro ao exportar: ${error.message}`, 'error');
                alert(`Erro ao exportar: ${error.message}`);
