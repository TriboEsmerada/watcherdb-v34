<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watcher DB</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- CodeMirror para syntax highlighting SQL -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
    
    <!-- Favicon - Watcher DB Logo (Eye Icon) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg?v=1">
    <link rel="shortcut icon" href="/favicon.svg?v=1">
    <link rel="apple-touch-icon" href="/favicon.svg?v=1">
    <script>
        // Forçar reload do favicon
        (function() {
            const link = document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/svg+xml';
            link.href = '/favicon.svg?v=' + Date.now();
            document.head.appendChild(link);
            console.log('✅ Favicon carregado:', link.href);
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0f172a; 
            color: #e2e8f0; 
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 0.5s ease-out;
        }
        
        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .splash-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        .splash-logo {
            width: 400px;
            height: auto;
        }
        
        /* Animações do Splash */
        .splash-radar-ring {
            fill: none;
            stroke: #4CAF50;
            stroke-width: 2;
            opacity: 0;
            animation: splash-radar-pulse 4s ease-out infinite;
        }
        
        .splash-radar-ring:nth-child(2) { animation-delay: 1s; }
        .splash-radar-ring:nth-child(3) { animation-delay: 2s; }
        .splash-radar-ring:nth-child(4) { animation-delay: 3s; }
        
        @keyframes splash-radar-pulse {
            0% { r: 45; opacity: 0.8; stroke-width: 3; }
            100% { r: 80; opacity: 0; stroke-width: 0.5; }
        }
        
        .splash-radar-beam {
            stroke: #4CAF50;
            stroke-width: 2;
            stroke-linecap: round;
            opacity: 0.6;
            animation: splash-radar-scan 4s linear infinite;
            transform-origin: 50px 60px;
            filter: drop-shadow(0 0 5px #4CAF50);
        }
        
        @keyframes splash-radar-scan {
            0% { transform: rotate(0deg); opacity: 0.6; }
            100% { transform: rotate(360deg); opacity: 0.2; }
        }
        
        .splash-eye-container {
            filter: drop-shadow(0 0 15px rgba(0, 188, 212, 0.6));
        }
        
        .splash-eye-outer {
            fill: rgba(0, 188, 212, 0.1);
            stroke: #00BCD4;
            stroke-width: 3;
        }
        
        .splash-eye-iris {
            fill: url(#splash-iris-gradient);
            animation: splash-iris-expand 3s ease-in-out infinite;
            transform-origin: 50px 60px;
        }
        
        @keyframes splash-iris-expand {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .splash-eye-pupil {
            fill: #00BCD4;
            animation: splash-pupil-look 6s ease-in-out infinite;
        }
        
        @keyframes splash-pupil-look {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-3px, -2px); }
            50% { transform: translate(0, 0); }
            75% { transform: translate(3px, -2px); }
        }
        
        .splash-eyelid {
            display: none; /* Pálpebra removida - sem animação de piscar */
        }
        
        .splash-database-layers {
            animation: splash-db-pulse 3s ease-in-out infinite;
            transform-origin: 50px 60px;
        }
        
        @keyframes splash-db-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.95); opacity: 0.8; }
        }
        
        .splash-data-particle {
            fill: #4CAF50;
            opacity: 0;
            animation: splash-particle-flow 4s ease-in-out infinite;
        }
        
        .splash-data-particle:nth-child(1) { animation-delay: 0s; }
        .splash-data-particle:nth-child(2) { animation-delay: 0.5s; }
        .splash-data-particle:nth-child(3) { animation-delay: 1s; }
        .splash-data-particle:nth-child(4) { animation-delay: 1.5s; }
        .splash-data-particle:nth-child(5) { animation-delay: 2s; }
        .splash-data-particle:nth-child(6) { animation-delay: 2.5s; }
        
        @keyframes splash-particle-flow {
            0% { transform: translate(0, -30px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(0, 30px); opacity: 0; }
        }
        
        .splash-text-watcher {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 38px;
            font-weight: 700;
            fill: url(#splash-text-gradient-animated);
        }
        
        .splash-text-db {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 28px;
            font-weight: 700;
            fill: #1976D2;
            opacity: 0.9;
        }
        
        .splash-tagline {
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 11px;
            font-weight: 400;
            fill: #4CAF50;
            opacity: 0.7;
            letter-spacing: 2px;
        }
        
        .splash-status-indicator {
            animation: splash-status-pulse 2s ease-in-out infinite;
            transform-origin: center;
        }
        
        @keyframes splash-status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .splash-loading-text {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            margin-top: 20px;
            opacity: 0.8;
        }
        
        /* Esconder conteúdo principal enquanto splash está visível */
        body.splash-active .header,
        body.splash-active .main-container {
            opacity: 0;
            pointer-events: none;
        }
        
        body:not(.splash-active) .header,
        body:not(.splash-active) .main-container {
            opacity: 1;
            transition: opacity 0.5s ease-in;
        }
        
        /* Header */
        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 20px; color: #60a5fa; font-weight: bold; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        
        /* Logo Premium - Header */
        .watcher-logo-header {
            height: 40px;
            width: auto;
        }
        
        /* Animação da íris */
        .header-iris {
            animation: header-iris-pulse 3s ease-in-out infinite;
            transform-origin: 30px 30px;
        }
        
        @keyframes header-iris-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        /* Animação do database na pupila */
        .header-database {
            animation: header-db-pulse 3s ease-in-out infinite;
            transform-origin: center;
        }
        
        @keyframes header-db-pulse {
            0%, 100% { transform: translate(30px, 30px) scale(1); opacity: 1; }
            50% { transform: translate(30px, 30px) scale(0.95); opacity: 0.8; }
        }
        
        /* Animação de piscar - removida */
        .header-eyelid {
            display: none; /* Pálpebra removida - sem animação de piscar */
        }
        
        /* Status indicator pulsante */
        .header-status-indicator {
            animation: header-status-pulse 2s ease-in-out infinite;
            transform-origin: 50px 15px;
        }
        
        @keyframes header-status-pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        
        /* Search */
        .search-container { position: relative; flex: 1; max-width: 500px; margin: 0 32px; }
        .search-input {
            width: 100%;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px 40px 8px 16px;
            color: #e2e8f0;
            font-size: 14px;
        }
        .search-input:focus { outline: none; border-color: #60a5fa; }
        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px 8px;
            display: none;
        }
        .search-clear:hover { color: #f1f5f9; }
        .search-clear.show { display: block; }
        
        /* Main Layout */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* Sidebar */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: #1e293b;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 16px;
            transition: width 0.3s ease, min-width 0.3s ease, padding 0.3s ease;
            position: relative;
        }
        
        /* Sidebar colapsada - reduz para apenas uma barra fina com título vertical */
        .sidebar.collapsed {
            width: 50px;
            min-width: 50px;
            padding: 0;
            overflow: visible;
        }
        
        .sidebar.collapsed h3 {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            white-space: nowrap;
            padding: 8px 4px;
            margin: 0;
            width: 50px;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            border-right: 1px solid #334155;
            line-height: 1.2;
        }
        
        .sidebar.collapsed h3 span {
            display: inline;
            white-space: nowrap;
        }
        
        .sidebar.collapsed h3 #sidebarCount {
            display: inline;
            white-space: nowrap;
        }
        
        .sidebar.collapsed h3 * {
            white-space: nowrap;
        }
        
        .sidebar.collapsed .collapse-icon {
            display: none;
        }
        
        .sidebar.collapsed #serverList {
            display: none;
        }
        
        .sidebar.collapsed #searchStatus {
            display: none !important;
        }
        .sidebar h3 { 
            font-size: 13px; 
            color: #94a3b8; 
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            padding: 8px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        
        .sidebar h3:hover {
            background-color: rgba(148, 163, 184, 0.1);
        }
        
        .sidebar h3 .collapse-icon {
            margin-left: auto;
            transition: transform 0.3s ease;
            font-size: 11px;
            color: #60a5fa;
            opacity: 0.7;
        }
        
        .sidebar h3:hover .collapse-icon {
            opacity: 1;
        }
        
        .sidebar.collapsed .collapse-icon {
            transform: rotate(-90deg);
        }
        
        .sidebar.collapsed #serverList {
            display: none;
        }
        .search-status {
            font-size: 11px;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }
        .server-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: all 0.2s;
        }
        .server-item:hover { background: #334155; }
        .server-item.active { 
            background: #334155; 
            border-left: 4px solid #60a5fa;
        }
        .server-item .name { 
            font-weight: 500; 
            font-size: 14px;
            color: #f1f5f9;
        }
        .server-item .env { 
            font-size: 12px; 
            color: #94a3b8; 
            margin-top: 4px;
        }
        
        /* Content Area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Server Header */
        .server-header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: none;
        }
        .server-header.show { display: flex; justify-content: space-between; align-items: center; }
        .server-header h2 { font-size: 20px; color: #60a5fa; font-weight: bold; }
        .server-header .server-id { 
            font-size: 13px; 
            color: #94a3b8; 
            margin-top: 4px;
        }
        .server-header .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            transition: all 0.2s;
        }
        .server-header .close-btn:hover { 
            color: #ef4444; 
            background: rgba(239, 68, 68, 0.1);
            border-radius: 4px;
        }
        .nav-menu {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav-btn {
            padding: 6px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 4px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn:hover {
            background: #1e293b;
            border-color: #60a5fa;
            color: #60a5fa;
        }
        .nav-btn i {
            font-size: 11px;
        }
        
        /* Tabs Container */
        .tabs-container {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            display: none;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .tabs-container.show { display: block; }
        .tabs-container::-webkit-scrollbar {
            height: 4px;
        }
        .tabs-container::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .tabs-container::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 2px;
        }
        .tabs-container::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        
        /* Tabs Bar */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 0 8px;
            min-width: max-content;
        }
        
        /* Dynamic Tab */
        .dynamic-tab {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-bottom: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.2s;
            position: relative;
            min-width: 120px;
            max-width: 250px;
        }
        .dynamic-tab:hover {
            background: #1e293b;
            color: #f1f5f9;
        }
        .dynamic-tab.active {
            background: #1e293b;
            color: #60a5fa; 
            border-color: #60a5fa;
            border-bottom-color: transparent;
        }
        .dynamic-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #60a5fa;
        }
        .dynamic-tab .tab-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            position: relative;
        }
        /* Tooltip para abas dinâmicas */
        .dynamic-tab .tab-label[title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 10px;
            background: #1e293b;
            color: #f1f5f9;
            border: 1px solid #475569;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 1000;
            margin-bottom: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
        .dynamic-tab .tab-label[title]:hover::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #475569;
            z-index: 1001;
            margin-bottom: -1px;
            pointer-events: none;
        }
        .dynamic-tab .tab-refresh {
            display: flex !important;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 3px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            margin-right: 6px;
            opacity: 0.8;
        }
        .dynamic-tab .tab-refresh:hover {
            background: #475569;
            color: #60a5fa;
            opacity: 1;
        }
        .dynamic-tab.active .tab-refresh {
            color: #60a5fa;
            opacity: 1;
        }
        .dynamic-tab .tab-refresh.refreshing {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .dynamic-tab .tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 3px;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .dynamic-tab .tab-close:hover {
            background: #475569;
            color: #f1f5f9;
        }
        .dynamic-tab.active .tab-close:hover {
            background: #475569;
            color: #f1f5f9;
        }
        
        /* Tab Content */
        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .tab-content.active {
            display: block;
        }
        
        /* Content Scroll */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        
        /* Loading */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #334155;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Loading Premium com Logo */
        .loading-premium {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 300px;
            gap: 24px;
        }
        
        .loading-logo {
            width: 120px;
            height: 120px;
        }
        
        .loading-spinner-ring {
            stroke: #00BCD4;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            animation: loading-spin 1.5s linear infinite;
            transform-origin: center;
        }
        
        @keyframes loading-spin {
            0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 100, 200; stroke-dashoffset: -50; }
            100% { stroke-dasharray: 1, 200; stroke-dashoffset: -150; }
        }
        
        .loading-eye {
            fill: rgba(0, 188, 212, 0.1);
            stroke: #00BCD4;
            stroke-width: 2;
        }
        
        .loading-iris {
            fill: #1976D2;
            animation: loading-iris-pulse 2s ease-in-out infinite;
            transform-origin: center;
        }
        
        @keyframes loading-iris-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .loading-database {
            animation: loading-db-pulse 2s ease-in-out infinite;
            transform-origin: 0 0;
        }
        
        @keyframes loading-db-pulse {
            0%, 100% { transform: translate(60px, 60px) scale(1); opacity: 1; }
            50% { transform: translate(60px, 60px) scale(0.95); opacity: 0.8; }
        }
        
        .loading-text {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            margin-top: 8px;
        }
        
        /* Cards */
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .card h4 { 
            font-size: 16px; 
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        /* Versão compacta para Memory Analysis: 4 cards por linha */
        .stats-grid.memory {
            grid-template-columns: repeat(4, 1fr);
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-left: 4px solid;
            border-radius: 8px;
            padding: 14px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Cards mais compactos na aba de memória */
        .stats-grid.memory .stat-card { padding: 16px; }
        .stats-grid.memory .stat-card .value { font-size: 24px; }
        .stat-card.green { border-left-color: #10b981; }
        .stat-card.yellow { border-left-color: #f59e0b; }
        .stat-card.red { border-left-color: #ef4444; }
        .stat-card .label { 
            font-size: 12px; 
            color: #94a3b8; 
            margin-bottom: 6px;
        }

        <div class="content">
            
            <!-- Server Header -->
            <div id="serverHeader" class="server-header">

                    <div class="server-id">

                    <!-- Navigation Menu -->
                    <div class="nav-menu" style="display: flex; gap: 8px; flex-wrap: wrap;">

                            <i class="fas fa-home"></i> Overview
                        </button>
                        <button class="nav-btn" onclick="showTab('alwayson')" title="Always On">
                            <i class="fas fa-sync-alt"></i> Always On
                        </button>

                            <i class="fas fa-database"></i> Backup
                        </button>

                            <i class="fas fa-shield-alt"></i> Security
                        </button>

                            <i class="fas fa-hdd"></i> Space
                        </button>
                        <button class="nav-btn" onclick="showTab('memory')" title="Memory Analysis">
                            <i class="fas fa-memory"></i> Memory
                        </button>

                            <i class="fas fa-microchip"></i> CPU
                        </button>

                            <i class="fas fa-file-alt"></i> Log
                        </button>

                            <i class="fas fa-cogs"></i> Services

    <script>
        // ========================================
        // GLOBAL STATE
        // ========================================
        let allServers = [];
        let filteredServers = [];
        let selectedServer = null;
        let activeAbortControllers = new Map(); // Para cancelar requisições em andamento
        let currentTab = 'overview';
        
        // Tab Management
        let openTabs = new Map(); // Map<tabId, {server, tabType, content, element, interval}>
        let activeTabId = null;
        let tabCounter = 0;
        let tabIntervals = new Map(); // Map<tabId, intervalId> - para limpar intervalos quando fechar aba
        let tabTimeouts = new Map(); // Map<tabId, Set<timeoutId>> - para limpar timeouts quando fechar aba
        let tabAbortControllers = new Map(); // Map<tabId, Set<AbortController>> - para rastrear controllers por aba
        
        // Sistema de cache genérico para todas as abas (Map<tabType_serverId, {data, timestamp}>)
        let tabCache = new Map();
        const TAB_CACHE_TTL = 10000; // 10 segundos de cache
        
        // Função helper para gerenciar cache de abas
        function getTabCache(tabType, serverId) {
            const cacheKey = `${tabType}_${serverId}`;
            const cached = tabCache.get(cacheKey);
            const now = Date.now();
            
            if (cached && (now - cached.timestamp) < TAB_CACHE_TTL) {
                const cacheAge = Math.round((now - cached.timestamp) / 1000);
                debugLog(`✅ Cache válido para ${tabType} (${serverId}): ${cacheAge}s atrás`, 'info');
                return { valid: true, data: cached.data, age: cacheAge };
            }
            
            if (cached) {
                debugLog(`⏰ Cache expirado para ${tabType} (${serverId})`, 'info');
            }
            
            return { valid: false, data: null, age: 0 };
        }
        
        function setTabCache(tabType, serverId, data) {
            const cacheKey = `${tabType}_${serverId}`;
            tabCache.set(cacheKey, {
                data: data,
                timestamp: Date.now()
            });
            debugLog(`💾 Dados salvos no cache: ${tabType} (${serverId})`, 'info');
            
            // Limpar cache antigo (manter apenas últimos 10 minutos)
            const cacheCleanupTime = Date.now() - (10 * 60 * 1000);
            for (const [key, value] of tabCache.entries()) {
                if (value.timestamp < cacheCleanupTime) {
                    tabCache.delete(key);
                }
            }
        }
        
        function clearTabCache(tabType, serverId) {
            const cacheKey = `${tabType}_${serverId}`;
            tabCache.delete(cacheKey);
            debugLog(`🗑️ Cache removido: ${tabType} (${serverId})`, 'info');
        }
        
        // Search Frequency Tracking
        const SEARCH_FREQUENCY_KEY = 'watcherdb_server_search_frequency';
        
        // ========================================
        // SPLASH SCREEN
        // ========================================
        
        // Função para esconder splash screen após 5 segundos
        function hideSplashScreen() {
            // Adicionar classe ao body para esconder conteúdo
            document.body.classList.add('splash-active');
            
            const splash = document.getElementById('splashScreen');
            if (splash) {
                setTimeout(() => {
                    splash.classList.add('hidden');
                    // Remover classe do body para mostrar conteúdo
                    document.body.classList.remove('splash-active');
                    // Remover do DOM após transição
                    setTimeout(() => {
                        splash.remove();
                    }, 500);
                }, 5000); // 5 segundos
            }
        }
        
        function getSearchFrequency() {
            try {
                const stored = localStorage.getItem(SEARCH_FREQUENCY_KEY);
                return stored ? JSON.parse(stored) : {};
            } catch (e) {
                return {};
            }
        }
        
        function saveSearchFrequency(frequency) {
            try {
                localStorage.setItem(SEARCH_FREQUENCY_KEY, JSON.stringify(frequency));
            } catch (e) {
                console.error('Erro ao salvar frequência de pesquisas:', e);
            }
        }
        
        function incrementSearchCount(serverId) {
            const frequency = getSearchFrequency();
            frequency[serverId] = (frequency[serverId] || 0) + 1;
            saveSearchFrequency(frequency);
            return frequency[serverId];
        }
        
        function sortServersByFrequency(servers) {
            const frequency = getSearchFrequency();
            return servers.sort((a, b) => {
                const countA = frequency[a.server_id] || 0;
                const countB = frequency[b.server_id] || 0;
                if (countA !== countB) {
                    return countB - countA; // Maior frequência primeiro
                }
                // Se mesma frequência, ordenar alfabeticamente
                return a.name.localeCompare(b.name);
            });
        }
        
        // ========================================
        // Minimal debug - no on-screen panel
        // ========================================
        function debugLog(message, type = 'info') {
            // Verificar se debug está habilitado (exceto para erros e warnings que sempre aparecem)
            const enableDebug = localStorage.getItem('enableDebugLogs') === 'true';
            if (!enableDebug && (type === 'info' || type === 'success')) {
                return; // Não logar info/success se debug estiver desabilitado
            }
            
            // Keep console output only
            if (type === 'error') console.error(message);
            else if (type === 'warn') console.warn(message);
            else console.log(message);
        }
        
        // ========================================
        // INITIALIZATION
        // ========================================
        async function init() {
            debugLog('🚀 Iniciando Watcher DB...', 'info');
            
            // Esconder splash screen após 5 segundos
            hideSplashScreen();
            
            restoreSidebarState(); // Restaurar estado da sidebar
            await loadServers();
            setupEventListeners();
            renderDashboardCards();
            
            // Aplicar intervalo de refresh dos KPIs salvo
            applyKpiRefreshInterval();
        }
        
        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const clearBtn = document.getElementById('searchClear');
                if (e.target.value) {
                    clearBtn.classList.add('show');
                } else {
                    clearBtn.classList.remove('show');
                }
                
                debounce(handleSearch, 300)(e);
            });
        }
        
        function clearSearch() {
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('searchClear');
            searchInput.value = '';
            clearBtn.classList.remove('show');
            
            // Aplicar ordenação salva quando limpar busca
            const sortOrder = localStorage.getItem('serverSortOrder') || 'frequency';
            if (sortOrder === 'frequency') {
                filteredServers = sortServersByFrequency([...allServers]);
            } else if (sortOrder === 'alphabetical') {
                filteredServers = [...allServers].sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortOrder === 'environment') {
                filteredServers = [...allServers].sort((a, b) => {
                    const envOrder = { 'production': 1, 'quality': 2, 'development': 3, 'unknown': 4 };
                    const envA = envOrder[a.environment?.toLowerCase()] || 99;
                    const envB = envOrder[b.environment?.toLowerCase()] || 99;
                    if (envA !== envB) return envA - envB;
                    return a.name.localeCompare(b.name);
                });
            } else {
                filteredServers = [...allServers];
            }
            
            renderServerList();
            updateServerCount();
            debugLog(`🔄 Busca limpa (lista reordenada por: ${sortOrder})`, 'info');
        }
        
        // Toggle sidebar collapse/expand
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('collapsed');
                const isCollapsed = sidebar.classList.contains('collapsed');
                debugLog(`📂 Sidebar ${isCollapsed ? 'recolhida' : 'expandida'}`, 'info');
                // Salvar estado no localStorage
                localStorage.setItem('sidebarCollapsed', isCollapsed);
            }
        }
        
        // Restaurar estado da sidebar ao carregar
        function restoreSidebarState() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                const wasCollapsed = localStorage.getItem('sidebarCollapsed') === 'true';
                if (wasCollapsed) {
                    sidebar.classList.add('collapsed');
                }
            }
        }
        
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
        
        // ========================================
        // LOAD SERVERS
        // ========================================
        async function loadServers() {
            try {
                debugLog('📡 Buscando servidores...', 'info');
                const response = await fetch('/api/v3/servers');
                const data = await response.json();

        // Verificar se é erro de "sem dados históricos"
        if (!data.success) {
            if (data.error && (data.error.includes('No rows match filters') || data.error.includes('ValueError'))) {
                showNoDataError(serverId, databaseName, filegroupName);
                return;
            }
        }

        // Verificar se é erro de "sem dados históricos"
        if (!data.success) {
            if (data.error && (data.error.includes('No rows match filters') || data.error.includes('ValueError'))) {
                showNoDataError(serverId, databaseName, filegroupName);
                return;
            }
        }
                
                if (data.success) {
                    allServers = data.servers;
                    
                    // Aplicar ordenação salva
                    const sortOrder = localStorage.getItem('serverSortOrder') || 'frequency';
                    if (sortOrder === 'frequency') {
                        allServers = sortServersByFrequency([...allServers]);
                        debugLog(`✅ ${data.servers.length} servidores carregados (ordenados por frequência)`, 'success');
                    } else if (sortOrder === 'alphabetical') {
                        allServers.sort((a, b) => a.name.localeCompare(b.name));
                        debugLog(`✅ ${data.servers.length} servidores carregados (ordenados alfabeticamente)`, 'success');
                    } else if (sortOrder === 'environment') {
                        allServers.sort((a, b) => {
                            const envOrder = { 'production': 1, 'quality': 2, 'development': 3, 'unknown': 4 };
                            const envA = envOrder[a.environment?.toLowerCase()] || 99;
                            const envB = envOrder[b.environment?.toLowerCase()] || 99;
                            if (envA !== envB) return envA - envB;
                            return a.name.localeCompare(b.name);
                        });
                        debugLog(`✅ ${data.servers.length} servidores carregados (ordenados por ambiente)`, 'success');
                    }
                    
                    filteredServers = [...allServers];
                    renderServerList();
                    updateServerCount();
                    
                    if (data.servers.length > 0) {
                        const firstServer = data.servers[0];
                        debugLog(`📋 Primeiro servidor: ${JSON.stringify(firstServer).substring(0, 200)}...`, 'info');
                        if (firstServer.description) {
                            debugLog(`📝 Primeiro servidor tem description: "${firstServer.description.substring(0, 50)}..."`, 'info');
                        } else {
                            debugLog(`⚠️ Primeiro servidor NÃO tem campo description`, 'warning');
                        }
                    }
                } else {
                    debugLog(`❌ Erro: ${data.error}`, 'error');
                }
            } catch (error) {
                debugLog(`❌ Erro de rede: ${error.message}`, 'error');
            }
        }
        
        // ========================================
        // RENDER SERVER LIST
        // ========================================
        function renderServerList() {
            const list = document.getElementById('serverList');
            list.innerHTML = '';
            
            filteredServers.slice(0, 50).forEach(server => {
                const item = document.createElement('div');
                item.className = 'server-item';
                if (selectedServer && selectedServer.server_id === server.server_id) {
                    item.classList.add('active');
                }
                
                item.innerHTML = `
                    <div class="name">${server.name}</div>
                    <div class="env">${server.environment}</div>
                `;
                
                item.onclick = () => selectServer(server);
                list.appendChild(item);
            });
        }
        
        function updateServerCount() {
            const searchInput = document.getElementById('searchInput');
            const searchStatus = document.getElementById('searchStatus');
            const isSearching = searchInput.value.trim().length >= 2;
            
            // Atualizar apenas o contador da sidebar (o header não tem mais contador)
            document.getElementById('sidebarCount').textContent = filteredServers.length;
            
            if (isSearching) {
                searchStatus.style.display = 'block';
                const query = searchInput.value.trim();
                const hasExactMatch = filteredServers.some(s => 
                    s.name.toLowerCase() === query.toLowerCase() || 
                    s.server_id.toLowerCase() === query.toLowerCase()
                );
                
                if (hasExactMatch && filteredServers.length === 1) {
                    searchStatus.textContent = '✓ Match exato';
                    searchStatus.style.background = 'rgba(16, 185, 129, 0.2)';
                    searchStatus.style.color = '#10b981';
                } else if (filteredServers.length > 0) {
                    searchStatus.textContent = `${filteredServers.length} resultados`;
                    searchStatus.style.background = 'rgba(96, 165, 250, 0.2)';
                    searchStatus.style.color = '#60a5fa';
                } else {
                    searchStatus.textContent = 'Sem resultados';
                    searchStatus.style.background = 'rgba(239, 68, 68, 0.2)';
                    searchStatus.style.color = '#ef4444';
                }
            } else {
                searchStatus.style.display = 'none';
            }
        }
        
        // ========================================
        // SEARCH
        // ========================================
        async function handleSearch(event) {
            const query = event.target.value.trim();
            
            if (!query || query.length < 2) {
                filteredServers = allServers;
                renderServerList();
                updateServerCount();
                return;
            }
            
            debugLog(`🔍 Buscando: ${query}`, 'info');
            
            const queryLower = query.toLowerCase();
            
            // Debug: verificar se algum servidor tem description
            const serversWithDesc = allServers.filter(s => s.description && s.description.length > 0);
            debugLog(`📝 Servidores com description: ${serversWithDesc.length} de ${allServers.length}`, 'info');
            
            const scored = allServers.map(server => {
                const nameLower = server.name.toLowerCase();
                const idLower = server.server_id.toLowerCase();
                const envLower = server.environment ? server.environment.toLowerCase() : '';
                const descLower = server.description ? server.description.toLowerCase() : '';
                
                let score = 0;
                
                if (nameLower === queryLower || idLower === queryLower) {
                    score = 100;
                }
                else if (nameLower.startsWith(queryLower) || idLower.startsWith(queryLower)) {
                    score = 90;
                }
                else if (nameLower.includes(queryLower) || idLower.includes(queryLower)) {
                    score = 70;
                }
                else if (descLower.includes(queryLower)) {
                    // Busca na descrição - pontuação entre nome e environment
                    score = 60;
                    debugLog(`✅ Match na descrição: ${server.name} - "${server.description}"`, 'info');
                }
                else if (envLower.includes(queryLower)) {
                    score = 50;
                }
                else {
                    const queryWords = queryLower.split(/[\s\\_-]+/);
                    const nameWords = nameLower.split(/[\s\\_-]+/);
                    
                    // Também buscar palavras na descrição
                    if (descLower) {
                        const descWords = descLower.split(/[\s\\_-]+/);
                        queryWords.forEach(qWord => {
                            descWords.forEach(dWord => {
                                if (dWord.includes(qWord) || qWord.includes(dWord)) {
                                    score = Math.max(score, 40);
                                }
                            });
                        });
                    }
                    
                    queryWords.forEach(qWord => {
                        nameWords.forEach(nWord => {
                            if (nWord.includes(qWord) || qWord.includes(nWord)) {
                                score = Math.max(score, 30);
                            }
                        });
                    });
                }
                
                return { server, score };
            });
            
            filteredServers = scored
                .filter(s => s.score > 0)
                .sort((a, b) => {
                    // Primeiro ordenar por score da busca
                    if (b.score !== a.score) {
                        return b.score - a.score;
                    }
                    // Se mesmo score, ordenar por frequência de pesquisas
                    const frequency = getSearchFrequency();
                    const countA = frequency[a.server.server_id] || 0;
                    const countB = frequency[b.server.server_id] || 0;
                    if (countA !== countB) {
                        return countB - countA;
                    }
                    // Se mesma frequência, ordenar alfabeticamente
                    return a.server.name.localeCompare(b.server.name);
                })
                .slice(0, 20)
                .map(s => s.server);
            
            renderServerList();
            updateServerCount();
            
            debugLog(`✅ ${filteredServers.length} resultados (ordenados por relevância e frequência)`, 'success');
            
            if (filteredServers.length > 0) {
                debugLog(`📊 Top 3: ${filteredServers.slice(0, 3).map(s => s.name).join(', ')}`, 'info');
            }
        }
        
        // ========================================
        // TAB MANAGEMENT
        // ========================================
        function generateTabId(serverId, tabType) {
            return `${serverId}_${tabType}_${Date.now()}`;
        }
        
        function getTabLabel(server, tabType) {
            const tabLabels = {
                'overview': 'Overview',
                'alwayson': 'Always On',
                'backup': 'Backup',
                'cpu': 'CPU',
                'log': 'Log',
                'memory': 'Memory',
                'security': 'Security',
                'services': 'Services',
                'space': 'Space',
                'sql-diagnostics': 'SQL Diag',
                'dashboard-kpis': 'Dashboard KPIs'
            };
            
            // Se for dashboard-kpis, não precisa de servidor
            if (tabType === 'dashboard-kpis') {
                return 'Dashboard de KPIs';
            }
            
            const shortName = server.name.length > 15 ? server.name.substring(0, 15) + '...' : server.name;
            const label = tabLabels[tabType] || tabType;
            return `${shortName} - ${label}`;
        }
        
        function createDashboardKPIstab() {
            // Verificar se já existe uma aba de dashboard
            const existingTab = Array.from(openTabs.values()).find(
                tab => tab.tabType === 'dashboard-kpis'
            );
            
            if (existingTab) {
                // Se já existe, apenas ativar
                activateTab(existingTab.tabId);
                return existingTab.tabId;
            }
            
            // Criar um objeto "servidor" fictício para o dashboard
            const dashboardServer = {
                server_id: 'dashboard-kpis',
                name: 'Dashboard de KPIs',
                environment: 'system'
            };
            
            // Usar createTab que já tem a lógica de limpar tabsContentArea e recriar abas
            return createTab(dashboardServer, 'dashboard-kpis');
        }
        
        function createTab(server, tabType) {
            const tabId = generateTabId(server.server_id, tabType);
            
            // Verificar se já existe uma aba para este servidor e tipo
            const existingTab = Array.from(openTabs.values()).find(
                tab => tab.server.server_id === server.server_id && tab.tabType === tabType
            );
            
            if (existingTab) {
                // Se já existe, apenas ativar
                activateTab(existingTab.tabId);
                return existingTab.tabId;
            }
            
            // Criar nova aba
            const tabsContainer = document.getElementById('tabs');
            const tabsContentArea = document.getElementById('tabsContentArea');
            
            // IMPORTANTE: Limpar apenas conteúdo que não seja de uma aba (KPIs do dashboard)
            // Mas preservar os contentElements das abas existentes
            const existingContentElements = Array.from(tabsContentArea.children).filter(
                child => child.classList.contains('tab-content')
            );

            // Limpar tabsContentArea (remove KPIs do dashboard se houver)
            // IMPORTANTE: Remover qualquer conteúdo que não seja um tab-content para evitar
            // que KPIs do dashboard apareçam nas abas de overview
            tabsContentArea.innerHTML = '';

            // Restaurar apenas os contentElements das abas existentes
            existingContentElements.forEach(element => {
                tabsContentArea.appendChild(element);
            });
            
            // Criar elemento da nova aba
            const tabElement = document.createElement('div');
            tabElement.className = 'dynamic-tab';
            tabElement.dataset.tabId = tabId;
            const tabLabel = getTabLabel(server, tabType);
            tabElement.innerHTML = `
                <span class="tab-label" title="${tabLabel}">${tabLabel}</span>
                <span class="tab-refresh" onclick="event.stopPropagation(); refreshTab('${tabId}')" title="Atualizar aba">
                    <i class="fas fa-sync-alt"></i>
                </span>
                <span class="tab-close" onclick="event.stopPropagation(); closeTab('${tabId}')" title="Fechar aba">
                    <i class="fas fa-times" style="font-size: 10px;"></i>
                </span>
            `;
            
            tabElement.onclick = () => activateTab(tabId);
            
            // Criar conteúdo da nova aba
            const contentElement = document.createElement('div');
            contentElement.className = 'tab-content';
            contentElement.id = `tab-content-${tabId}`;
            contentElement.innerHTML = ''; // Limpar conteúdo
            
            // Adicionar nova aba ao DOM
            tabsContainer.appendChild(tabElement);
            tabsContentArea.appendChild(contentElement);
            
            // Armazenar no Map
            openTabs.set(tabId, {
                tabId: tabId,
                server: server,
                tabType: tabType,
                element: tabElement,
                contentElement: contentElement,
                interval: null // Intervalo específico desta aba (se houver)
            });
            
            // Mostrar container de abas ANTES de ativar
            document.getElementById('tabsContainer').classList.add('show');
            
            // Ativar a nova aba (isso vai carregar o conteúdo)
            activateTab(tabId);
            
            debugLog(`📑 Nova aba criada: ${tabId} (${server.name} - ${tabType})`, 'info');
            
            return tabId;
        }
        
        function activateTab(tabId) {
            const tab = openTabs.get(tabId);
            if (!tab) return;
            
            // Desativar todas as abas
            document.querySelectorAll('.dynamic-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            // Ativar a aba selecionada
            tab.element.classList.add('active');
            tab.contentElement.classList.add('active');
            
            activeTabId = tabId;
            // Só definir selectedServer se não for dashboard-kpis
            if (tab.tabType !== 'dashboard-kpis') {
                selectedServer = tab.server;
            } else {
                selectedServer = null;
            }
            currentTab = tab.tabType;
            
            // Atualizar header
            document.getElementById('serverHeader').classList.add('show');
            document.getElementById('serverName').textContent = tab.server.name;
            document.getElementById('serverId').textContent = tab.server.server_id;
            
            // Habilitar botão de ping apenas se não for dashboard-kpis

        function closeTab(tabId) {
            const tab = openTabs.get(tabId);
            if (!tab) return;
            
            debugLog(`🗑️ Fechando aba: ${tabId} (${tab.tabType})`, 'info');
            
            // 1. Cancelar TODAS as requisições ativas relacionadas a esta aba
            cancelTabRequests(tabId);
            
            // 2. Limpar intervalos específicos desta aba
            if (tab.interval) {
                clearInterval(tab.interval);
                debugLog(`⏹️ Intervalo da aba ${tabId} cancelado`, 'info');
            }
            
            // Limpar intervalo do Map de intervalos
            if (tabIntervals.has(tabId)) {
                clearInterval(tabIntervals.get(tabId));
                tabIntervals.delete(tabId);
                debugLog(`⏹️ Intervalo do Map cancelado para aba ${tabId}`, 'info');
            }
            
            // 3. Cancelar todos os timeouts desta aba
            if (tabTimeouts.has(tabId)) {
                const timeouts = tabTimeouts.get(tabId);
                timeouts.forEach(timeoutId => clearTimeout(timeoutId));
                tabTimeouts.delete(tabId);
                debugLog(`⏹️ ${timeouts.size} timeout(s) da aba ${tabId} cancelado(s)`, 'info');
            }
            
            // 4. Se for uma aba de dashboard, limpar TODOS os intervalos relacionados
            // IMPORTANTE: Fazer isso ANTES de remover a aba do Map para poder verificar outras abas
            if (tab.tabType === 'dashboard-kpis') {
                // Limpar intervalo da aba específica
                if (tab.interval) {
                    clearInterval(tab.interval);
                    tab.interval = null;
                    debugLog(`⏹️ Intervalo da aba dashboard cancelado (tab.interval)`, 'info');
                }
                
                // Limpar intervalo do Map de intervalos
                if (tabIntervals.has(tabId)) {
                    const intervalId = tabIntervals.get(tabId);
                    clearInterval(intervalId);
                    tabIntervals.delete(tabId);
                    debugLog(`⏹️ Intervalo da aba dashboard cancelado (tabIntervals)`, 'info');
                }
                
                // Limpar dashboardRefreshInterval global APENAS se for desta aba específica
                // Verificar se há outras abas de dashboard abertas (ANTES de remover esta aba)
                const otherDashboardTabs = Array.from(openTabs.values()).filter(
                    t => t.tabType === 'dashboard-kpis' && t.tabId !== tabId
                );
                
                if (otherDashboardTabs.length === 0) {
                    // Não há outras abas de dashboard, pode limpar o global
                    if (dashboardRefreshInterval) {
                        clearInterval(dashboardRefreshInterval);
                        dashboardRefreshInterval = null;
                        debugLog(`⏹️ Auto-refresh global do dashboard cancelado (última aba fechada)`, 'info');
                    }
                } else {
                    debugLog(`ℹ️ Outras abas de dashboard ainda abertas (${otherDashboardTabs.length}), mantendo intervalo global`, 'info');
                }
            }
            
            // 5. Limpar qualquer Promise.all ou processos assíncronos pendentes
            // (isso é feito automaticamente ao cancelar os AbortControllers)
            
            // 6. Remover do DOM
            tab.element.remove();
            tab.contentElement.remove();
            
            // 7. Remover do Map (DEPOIS de limpar intervalos e verificar outras abas)
            openTabs.delete(tabId);
            
            // 6. Se era a aba ativa, ativar outra
            if (activeTabId === tabId) {
                const remainingTabs = Array.from(openTabs.values());
                if (remainingTabs.length > 0) {
                    // Ativar a última aba ou a primeira
                    activateTab(remainingTabs[remainingTabs.length - 1].tabId);
                } else {
                    // Nenhuma aba restante
                    activeTabId = null;
                    selectedServer = null;
                    currentTab = 'overview';
                    document.getElementById('serverHeader').classList.remove('show');
                    document.getElementById('tabsContainer').classList.remove('show');
                    
                    // Desabilitar botão de ping
                    const pingButton = document.getElementById('pingButton');
                    if (pingButton) {
                        pingButton.style.opacity = '0.5';
                        pingButton.style.pointerEvents = 'none';
                    }
                }
            }
            
            debugLog(`❌ Aba fechada: ${tabId}`, 'info');
        }

        // Função para cancelar todas as requisições em andamento
        function cancelAllActiveRequests() {
            activeAbortControllers.forEach((value, key) => {
                const controller = typeof value === 'object' && value.controller ? value.controller : value;
                controller.abort();
                debugLog(`🚫 Requisição cancelada: ${key}`, 'info');
            });
            activeAbortControllers.clear();
        }
        
        // Função para criar uma requisição com AbortController
        function createFetchWithAbort(url, options = {}) {
            const controller = new AbortController();
            const key = `${url}_${Date.now()}`;
            const tabId = activeTabId; // Associar requisição à aba ativa
            activeAbortControllers.set(key, { controller, tabId });
            
            // Adicionar ao Map de controllers por aba
            if (tabId) {
                if (!tabAbortControllers.has(tabId)) {
                    tabAbortControllers.set(tabId, new Set());
                }
                tabAbortControllers.get(tabId).add(controller);
            }
            
            const fetchOptions = {
                ...options,
                signal: controller.signal
            };
            
            const fetchPromise = fetch(url, fetchOptions)
                .catch(error => {
                    // Tratar erros de abort de forma silenciosa
                    const errorMessage = error?.message || error?.toString() || '';
                    const errorName = error?.name || '';
                    const isAbort = (
                        errorName === 'AbortError' || 
                        errorMessage.toLowerCase().includes('aborted') ||
                        errorMessage.toLowerCase().includes('signal is aborted') ||
                        errorMessage.toLowerCase().includes('abort')
                    );
                    
                    if (isAbort) {
                        // Rejeitar com um erro mais limpo que pode ser ignorado
                        const abortError = new Error('Request aborted');
                        abortError.name = 'AbortError';
                        abortError.isAbort = true;
                        throw abortError;
                    }
                    // Re-lançar outros erros normalmente
                    throw error;
                })
                .finally(() => {
                    activeAbortControllers.delete(key);
                    // Remover do Map de controllers por aba
                    if (tabId && tabAbortControllers.has(tabId)) {
                        tabAbortControllers.get(tabId).delete(controller);
                        if (tabAbortControllers.get(tabId).size === 0) {
                            tabAbortControllers.delete(tabId);
                        }
                    }
                });
            
            return fetchPromise;
        }
        
        // Função para cancelar requisições de uma aba específica
        function cancelTabRequests(tabId) {
            let cancelled = 0;
            
            // Cancelar via activeAbortControllers (sistema de fallback)
            const keysToDelete = [];
            activeAbortControllers.forEach((value, key) => {
                const requestInfo = typeof value === 'object' && value.controller ? value : { controller: value, tabId: null };
                if (requestInfo.tabId === tabId) {
                    try {
                    requestInfo.controller.abort();
                        keysToDelete.push(key);
                    cancelled++;
                    } catch (e) {
                        // Ignorar erros ao abortar
                        keysToDelete.push(key);
                    }
                }
            });
            keysToDelete.forEach(key => activeAbortControllers.delete(key));
            
            // Cancelar via tabAbortControllers (sistema principal)
            if (tabAbortControllers.has(tabId)) {
                const controllers = tabAbortControllers.get(tabId);
                controllers.forEach(controller => {
                    try {
                    controller.abort();
                    cancelled++;
                    } catch (e) {
                        // Ignorar erros ao abortar (pode já estar abortado)
                    }
                });
                tabAbortControllers.delete(tabId);
                debugLog(`🚫 ${controllers.size} requisição(ões) da aba ${tabId} cancelada(s) via tabAbortControllers`, 'info');
            }
            
            // Cancelar timeouts da aba
            if (tabTimeouts.has(tabId)) {
                const timeouts = tabTimeouts.get(tabId);
                timeouts.forEach(timeoutId => {
                    clearTimeout(timeoutId);
                    cancelled++;
                });
                tabTimeouts.delete(tabId);
                debugLog(`⏹️ ${timeouts.size} timeout(s) da aba ${tabId} cancelado(s)`, 'info');
            }
            
            if (cancelled > 0) {
                debugLog(`✅ Total: ${cancelled} operação(ões) da aba ${tabId} cancelada(s)`, 'info');
            } else {
                debugLog(`ℹ️ Nenhuma operação pendente para cancelar na aba ${tabId}`, 'info');
            }
        }
        
        // Função helper para criar timeout rastreável
        function createTabTimeout(callback, delay) {
            const tabId = activeTabId;
            const timeoutId = setTimeout(() => {
                // Remover do Map quando executar
                if (tabId && tabTimeouts.has(tabId)) {
                    tabTimeouts.get(tabId).delete(timeoutId);
                    if (tabTimeouts.get(tabId).size === 0) {
                        tabTimeouts.delete(tabId);
                    }
                }
                callback();
            }, delay);
            
            // Adicionar ao Map de timeouts por aba
            if (tabId) {
                if (!tabTimeouts.has(tabId)) {
                    tabTimeouts.set(tabId, new Set());
                }
                tabTimeouts.get(tabId).add(timeoutId);
            }
            
            return timeoutId;
        }

        async function renderOverview() {
            // Sempre usar o contentElement da aba ativa se houver
            let content = null;

                const tab = openTabs.get(activeTabId);
                if (tab && tab.tabType === 'overview') {
                    content = tab.contentElement;

                }
            } else {
                content = document.getElementById('contentArea');
            }

            if (!content) {
                debugLog('⚠️ Elemento de conteúdo não encontrado', 'warning');
                return;
            }

            // Verificar se selectedServer existe e não é dashboard-kpis
            if (!selectedServer || selectedServer.server_id === 'dashboard-kpis') {
                debugLog('⚠️ selectedServer inválido ou é dashboard-kpis', 'warning');
                content.innerHTML = '<div class="error">Erro: Servidor não selecionado ou inválido.</div>';
                return;
            }

            // FIX: LIMPAR COMPLETAMENTE conteúdo antes de renderizar
            // Garantir que não há nenhum vestígio de KPIs do dashboard
            content.innerHTML = '';
            content.textContent = '';
            content.removeAttribute('style'); // Remover qualquer estilo inline que possa ter sido aplicado

            const serverId = selectedServer.server_id;
            content.innerHTML = createPremiumLoading('Carregando overview...');

            try {
                // Verificar cache primeiro
                const cacheResult = getTabCache('overview', serverId);
                let useCache = false;
                let cachedData = null;
                
                // Inicializar variáveis com valores padrão (importante para evitar erros)
                let spaceHealth = { success: false, health_score: null };
                let backupSummary = { success: false, items: [], total_databases: 0 };
                let patt = { success: false, patterns: [] };
                let winlog = { success: false, error: 'Não disponível' };
                let servicesStatus = { is_healthy: true, critical_down: 0 };
                let tdeData = { tde_status: [] };
                let tdeDbData = { tde_database_status: [] };
                let alwaysonData = { is_alwayson: false };
                
                if (cacheResult.valid) {
                    useCache = true;
                    cachedData = cacheResult.data;
                }
                
                // Se não usar cache, fazer requisições paralelas
                if (!useCache) {
                    // Simplesmente tentar carregar os dados
                    // Se o servidor estiver offline, as requisições falharão naturalmente
                    const days = parseInt(localStorage.getItem('backup_days')||'7',10);
                    // Função auxiliar para tratar erros de abort silenciosamente
                    const handleAbort = (promise, fallback) => {
                        return promise.catch(error => {
                            const errorMessage = error?.message || error?.toString() || '';
                            const errorName = error?.name || '';
                            const isAbort = (
                                error?.isAbort === true ||
                                errorName === 'AbortError' || 
                                errorMessage.toLowerCase().includes('aborted') ||
                                errorMessage.toLowerCase().includes('signal is aborted') ||
                                errorMessage.toLowerCase().includes('abort') ||
                                errorMessage.toLowerCase().includes('request aborted')
                            );
                            
                            if (isAbort) {
                                // Retornar fallback para erros de abort (não rejeitar)
                                return fallback;
                            }
                            // Re-lançar outros erros
                            throw error;
                        });
                    };
                    
                    debugLog(`⏳ Iniciando requisições Overview (paralelas)...`, 'info');
                    const startTime = Date.now();
                    
                    // PARALELIZAR todas as requisições (já estava assim, mas vamos garantir)
                    const [spaceHealthRes, backupSumRes, pattRes, winlogRes, servicesRes, tdeRes, tdeDbRes, alwaysonRes] = await Promise.all([
                        handleAbort(createFetchWithAbort(`/api/monitoring/space/server/${serverId}/dashboard/health`), { json: async () => ({ success: false, health_score: null }) }),
                        handleAbort(createFetchWithAbort(`/api/monitoring/backup/server/${serverId}/summary?days=${days}`), { json: async () => ({ success: false, items: [], total_databases: 0 }) }),
                        handleAbort(createFetchWithAbort(`/api/monitoring/backup/server/${serverId}/patterns?days=${Math.max(days,30)}`), { json: async () => ({ success: false, patterns: [] }) }),
                        createFetchWithAbort(`/api/monitoring/windows-events/${serverId}?hours=24`).catch(() => ({ json: async () => ({ success: false, error: 'Não disponível' }) })),
                        createFetchWithAbort(`/api/monitoring/services/server/${serverId}`).catch(() => ({ ok: false, json: async () => ({ is_healthy: true, error: 'Não disponível' }) })),
                        createFetchWithAbort(`/api/queries/tde-status/${serverId}`).catch(() => ({ ok: false, json: async () => ({ tde_status: [] }) })),
                        createFetchWithAbort(`/api/queries/tde-database-status/${serverId}`).catch(() => ({ ok: false, json: async () => ({ tde_database_status: [] }) })),
                        createFetchWithAbort(`/api/alwayson/server/${serverId}/overview`).catch(() => ({ ok: false, json: async () => ({ is_alwayson: false }) }))
                    ]);
                    
                    const elapsedTime = Date.now() - startTime;

        async function loadSpaceAnalysis(contentElement = null) {
            // Se contentElement não foi fornecido, tentar obter da aba ativa ou contentArea
            const content = contentElement || (activeTabId ? openTabs.get(activeTabId)?.contentElement : document.getElementById('contentArea'));
            if (!content) {
                debugLog('⚠️ contentElement não encontrado para loadSpaceAnalysis', 'warning');
                return;
            }
            const serverId = selectedServer.server_id;
            
            debugLog(`📦 Carregando Space Analysis...`, 'info');
            debugLog(`🔑 Server ID: ${serverId}`, 'info');
            
            content.innerHTML = createPremiumLoading('Carregando análise de espaço...');
            
            try {
                const apiUrl = `/api/monitoring/space/server/${serverId}?t=${Date.now()}`;
                debugLog(`📡 API: ${apiUrl}`, 'info');
                
                const response = await fetch(apiUrl);
                const json = await response.json();
                
                debugLog(`📊 Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const data = (json.success && json.data) ? json.data : json;
                
                if (!data || data.error) {
                    throw new Error(data?.error || 'Dados inválidos');
                }
                
                const filegroups = data.filegroups || [];
                debugLog(`✅ ${filegroups.length} filegroups`, 'success');
                
                const dbGroups = {};
                filegroups.forEach(fg => {
                    const dbName = fg.database_name;
                    if (!dbGroups[dbName]) {
                        dbGroups[dbName] = {
                            filegroups: [],
                            total_gb: 0,
                            has_overflow: false
                        };
                    }
                    dbGroups[dbName].filegroups.push(fg);
                    dbGroups[dbName].total_gb += (fg.total_gb || 0);
                    if (fg.disk_overflow_risk && fg.filegroup_type === 'ROWS') {
                        dbGroups[dbName].has_overflow = true;
                    }
                });
                
                debugLog(`📊 ${Object.keys(dbGroups).length} databases`, 'success');
                
                renderSpaceAnalysis(dbGroups, serverId, content);
                
            } catch (error) {
                debugLog(`❌ Erro: ${error.message}`, 'error');
                content.innerHTML = `
                    <div class="card" style="background: #7f1d1d; border-color: #991b1b;">
                        <h4 style="color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Erro</h4>
                        <p style="color: #fecaca;">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function renderSpaceAnalysis(dbGroups, serverId, contentElement = null) {
            // Obter o elemento de conteúdo correto
            const content = contentElement || (activeTabId ? openTabs.get(activeTabId)?.contentElement : document.getElementById('contentArea'));
            if (!content) {
                debugLog('⚠️ contentElement não encontrado para renderSpaceAnalysis', 'warning');
                return;
            }
            const totalDbs = Object.keys(dbGroups).length;

            // ✅ CORRIGIDO v1.4.8.2: Calcular databases com alertas (CRITICAL, HIGH, MEDIUM)
            let alertDbs = 0;
            Object.values(dbGroups).forEach(db => {
                const hasAlerts = db.filegroups.some(fg =>
                    fg.alert_level && ['CRITICAL', 'HIGH', 'MEDIUM'].includes(fg.alert_level)
                );
                if (hasAlerts) alertDbs++;
            });

            // Contar APENAS databases com DATA filegroups em overflow
            let overflowDbs = 0;
            Object.values(dbGroups).forEach(db => {
                const hasDataOverflow = db.filegroups.some(fg => fg.filegroup_type === 'ROWS' && fg.disk_overflow_risk === true);
                if (hasDataOverflow) overflowDbs++;
            });
            debugLog(`📊 Total DBs: ${totalDbs}, Alertas: ${alertDbs}, DATA Overflows: ${overflowDbs}`, 'info');

            let html = `
                <div class="stats-grid">
                    <div class="stat-card green">
                        <div class="label">Total Databases</div>
                        <div class="value">${totalDbs}</div>
                    </div>
                    <div class="stat-card yellow">
                        <div class="label">Com Alertas</div>
                        <div class="value">${alertDbs}</div>
                    </div>
                    <div class="stat-card red" 
                         onclick="showOverflowDetails('${serverId}')" 
                         style="cursor: pointer; transition: transform 0.2s;"
                         onmouseover="this.style.transform='translateY(-2px)'"
                         onmouseout="this.style.transform='translateY(0)'"
                         title="🔮 Clique para análise preditiva de overflow e riscos futuros">
                        <div class="label">🔮 Análise Preditiva</div>
                        <div class="value">${overflowDbs}</div>
                    </div>
                </div>
                
                <div class="card">
                    <h4>Databases (${totalDbs})</h4>
                    <div class="table-container" style="margin-top: 16px;">
                    <table>
                        <thead>
                            <tr>
                                <th>Database</th>
                                <th style="text-align: right;">Total GB</th>
                                <th style="text-align: center;">FileGroups</th>
                                <th style="text-align: center;">Status</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            Object.keys(dbGroups).forEach(dbName => {
                const db = dbGroups[dbName];
                const dbId = dbName.replace(/[^a-zA-Z0-9]/g, '_');
                const hasDataOverflow = db.filegroups.some(fg => fg.filegroup_type === 'ROWS' && fg.disk_overflow_risk === true);
                const statusClass = hasDataOverflow ? 'overflow' : 'ok';
                const statusText = hasDataOverflow ? 'OVERFLOW' : 'OK';
                
                html += `
                    <tr>
                        <td>
                            <button class="toggle-btn" id="toggle-${dbId}" onclick="toggleDatabase('${dbName}', '${serverId}', '${dbId}')">
                                <i class="fas fa-chevron-right"></i>
                            </button>
                            <strong>${dbName}</strong>
                        </td>
                        <td style="text-align: right; font-family: monospace;">${db.total_gb.toFixed(2)}</td>
                        <td style="text-align: center;">
                            <span style="background: #1e40af; padding: 4px 12px; border-radius: 12px; font-size: 12px;">
                                ${db.filegroups.length}
                            </span>
                        </td>
                        <td style="text-align: center;">
                            <span class="badge ${statusClass}">${statusText}</span>
                        </td>
                    </tr>
                    <tr id="fg-row-${dbId}" style="display: none;">
                        <td colspan="4" style="padding: 0; background: #0f172a;">
                            <div id="fg-content-${dbId}" style="padding: 16px;">
                                Carregando...
                            </div>
                        </td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                    </div>
                </div>
            `;
            
            content.innerHTML = html;
        }
