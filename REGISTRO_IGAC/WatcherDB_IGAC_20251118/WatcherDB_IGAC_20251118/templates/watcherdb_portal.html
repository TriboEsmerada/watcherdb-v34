        // Funções auxiliares para cards
        function getCardClass(value, criticalValue = 0, warningValue = 0) {
            if (value > criticalValue) return 'has-problem critical';
            if (value > warningValue) return 'has-problem';
            return '';
        }
        
        function getValueColor(value, criticalValue = 0, warningValue = 0) {
            if (value > criticalValue) return '#ef4444';
            if (value > warningValue) return '#f59e0b';
            return '#10b981';
        }
        
        function formatNumber(num) {
            if (num >= 1000) {
                return (num / 1000).toFixed(2) + 'K';
            }
            return num.toString();
        }
        
        // Função para obter configurações do dashboard
        function getDashboardConfig() {
            const defaultConfig = {
                visibleKPIs: Object.keys(KPI_METADATA),
                sortOrder: 'category', // 'category', 'alphabetical' ou 'custom'
                customOrder: [], // Ordem personalizada (array de IDs)
                categories: ['Disponibilidade', 'Performance', 'Espaço', 'Alta Disponibilidade']
            };
            
            const saved = localStorage.getItem('dashboardKPIConfig');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    return { ...defaultConfig, ...parsed };
                } catch (e) {
                    console.warn('Erro ao carregar configuração do dashboard:', e);
                }
            }
            return defaultConfig;
        }
        
        // Função para salvar configurações do dashboard
        function saveDashboardConfig(config) {
            localStorage.setItem('dashboardKPIConfig', JSON.stringify(config));
        }
        
        // Função para obter configuração do SQL Diagnostics
        function getSQLDiagnosticsConfig() {
            const defaultQueries = [
                'blocking', 'slow-queries', 'log-space', 'sql-agent-jobs', 'sessions',
                'index-fragmentation', 'tempdb', 'file-growth', 'statistics', 
                'mirroring', 'backup', 'database-connections',
                'filegroup-growth-history', 'filegroup-growth-forecast',
                'backup-history-analysis', 'missing-index-analysis'
            ];
            
            const defaultConfig = {
                visibleQueries: defaultQueries // Todas visíveis por padrão
            };
            
            const saved = localStorage.getItem('sqlDiagnosticsConfig');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Mesclar queries padrão com as salvas, garantindo que novos IDs sejam incluídos
                    const mergedQueries = [...new Set([...defaultQueries, ...(parsed.visibleQueries || [])])];
                    return { 
                        ...defaultConfig, 
                        ...parsed,
                        visibleQueries: mergedQueries // Sempre incluir todos os IDs padrão
                    };
                } catch (e) {
                    console.warn('Erro ao carregar configuração do SQL Diagnostics:', e);
                }
            }
            return defaultConfig;
        }
        
        // Função para salvar configuração do SQL Diagnostics
        function saveSQLDiagnosticsConfig(config) {
            localStorage.setItem('sqlDiagnosticsConfig', JSON.stringify(config));
        }
        
        // Função para inicializar drag and drop dos cards de KPI
        function initializeKPIDragAndDrop(container) {
            // Sempre habilitar drag and drop, independente da ordenação
            const draggableCards = container.querySelectorAll('.kpi-draggable');
            
            if (draggableCards.length === 0) {
                return;
            }
            
            // Para ordenação por categoria, precisamos trabalhar com múltiplos containers
            const config = getDashboardConfig();
            const containers = config.sortOrder === 'category' 
                ? container.querySelectorAll('.kpi-draggable-container')
                : [container.querySelector('.kpi-draggable-container')].filter(c => c);
            
            if (containers.length === 0) {
                return;
            }
            
            // Inicializar drag and drop para cada container
            containers.forEach(containerElement => {
                const cardsInContainer = Array.from(containerElement.querySelectorAll('.kpi-draggable'));
                if (cardsInContainer.length === 0) return;
            
                let draggedElement = null;
                let draggedIndex = -1;
                
                // Event: Início do drag
                cardsInContainer.forEach((card, index) => {
                    card.addEventListener('dragstart', (e) => {
                        draggedElement = card;
                        draggedIndex = index;
                        card.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/html', card.outerHTML);
                        e.dataTransfer.setData('text/plain', card.getAttribute('data-kpi-id'));
                        containerElement.classList.add('drag-active');
                    });
                    
                    // Event: Fim do drag
                    card.addEventListener('dragend', (e) => {
                        card.classList.remove('dragging');
                        containerElement.classList.remove('drag-active');
                        
                        // Remover classe drag-over de todos os cards deste container
                        cardsInContainer.forEach(c => c.classList.remove('drag-over'));
                        
                        draggedElement = null;
                        draggedIndex = -1;
                    });
                    
                    // Event: Sobre outro card (dragover)
                    card.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        
                        if (draggedElement && draggedElement !== card) {
                            card.classList.add('drag-over');
                        }
                    });
                    
                    // Event: Sair de outro card
                    card.addEventListener('dragleave', (e) => {
                        card.classList.remove('drag-over');
                    });
                    
                    // Event: Soltar (drop)
                    card.addEventListener('drop', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        
                        if (!draggedElement || draggedElement === card) {
                            return;
                        }
                        
                        const dropTarget = card;
                        const allCards = Array.from(containerElement.querySelectorAll('.kpi-draggable'));
                        const dropIndex = allCards.indexOf(dropTarget);
                        const currentDraggedIndex = allCards.indexOf(draggedElement);
                        
                        // Reordenar os elementos no DOM
                        if (currentDraggedIndex < dropIndex) {
                            // Arrastou para baixo
                            if (dropTarget.nextSibling) {
                                containerElement.insertBefore(draggedElement, dropTarget.nextSibling);
                            } else {
                                containerElement.appendChild(draggedElement);
                            }
                        } else {
                            // Arrastou para cima
                            containerElement.insertBefore(draggedElement, dropTarget);
                        }
                        
                        // Atualizar ordem personalizada
                        // Usar o container principal passado para initializeKPIDragAndDrop
                        updateCustomOrder(container);
                        
                        // Remover classe drag-over
                        card.classList.remove('drag-over');
                        
                        // Reinicializar drag and drop com a nova ordem
                        setTimeout(() => {
                            initializeKPIDragAndDrop(container);
                        }, 100);
                    });
                });
            });
        }
        
        // Função para atualizar a ordem personalizada após drag and drop
        function updateCustomOrder(mainContainer) {
            const config = getDashboardConfig();
            const customOrder = [];
            
            // Buscar todos os containers de cards (pode ser um único ou múltiplos se for categoria)
            const allContainers = mainContainer.querySelectorAll('.kpi-draggable-container');
            
            if (allContainers.length > 0) {
                // Coletar ordem de todos os containers
                allContainers.forEach(cont => {
                    const cards = cont.querySelectorAll('.kpi-draggable');
                    cards.forEach(card => {
                        customOrder.push(card.getAttribute('data-kpi-id'));
                    });
                });
            } else {
                // Fallback: buscar cards diretamente no container
                const cards = mainContainer.querySelectorAll('.kpi-draggable');
                cards.forEach(card => {
                    customOrder.push(card.getAttribute('data-kpi-id'));
                });
            }
            
            config.customOrder = customOrder;
            
            // Se não estiver em modo categoria, mudar para custom automaticamente
            if (config.sortOrder !== 'category') {
                config.sortOrder = 'custom';
            }
            // Se estiver em categoria, manter mas salvar a ordem personalizada
            
            saveDashboardConfig(config);
            debugLog('✅ Ordem personalizada dos KPIs salva', 'success');
        }
        
        // Função para gerar cards dos KPIs baseado nas configurações
        function generateKPICards(data) {
            const config = getDashboardConfig();
            // Garantir que todos os KPIs do KPI_METADATA estejam na lista de visíveis
            // Isso garante que novos KPIs sejam automaticamente incluídos
            const allKPIIds = Object.keys(KPI_METADATA);
            const visibleKPIs = config.visibleKPIs 
                ? [...new Set([...config.visibleKPIs, ...allKPIIds])] // Merge: manter os existentes + adicionar novos
                : allKPIIds;
            
            // Filtrar KPIs visíveis
            let kpis = visibleKPIs
                .map(id => KPI_METADATA[id])
                .filter(kpi => kpi !== undefined);
            
            // Ordenar
            if (config.sortOrder === 'custom' && config.customOrder && config.customOrder.length > 0) {
                // Ordenar pela ordem personalizada
                const customOrderMap = {};
                config.customOrder.forEach((id, index) => {
                    customOrderMap[id] = index;
                });
                kpis.sort((a, b) => {
                    const orderA = customOrderMap[a.id] !== undefined ? customOrderMap[a.id] : 9999;
                    const orderB = customOrderMap[b.id] !== undefined ? customOrderMap[b.id] : 9999;
                    return orderA - orderB;
                });
            } else if (config.sortOrder === 'alphabetical') {
                kpis.sort((a, b) => a.title.localeCompare(b.title));
            } else {
                // Ordenar por categoria e depois por order
                const categoryOrder = config.categories || [];
                kpis.sort((a, b) => {
                    const catA = categoryOrder.indexOf(a.category) !== -1 ? categoryOrder.indexOf(a.category) : 999;
                    const catB = categoryOrder.indexOf(b.category) !== -1 ? categoryOrder.indexOf(b.category) : 999;
                    if (catA !== catB) return catA - catB;
                    return a.order - b.order;
                });
            }
            
            // Gerar HTML dos cards
            let html = '';
            let currentCategory = null;
            const isCustomOrder = config.sortOrder === 'custom';
            
            kpis.forEach((kpi, index) => {
                // Adicionar cabeçalho de categoria se mudou (não mostrar se for ordem custom)
                if (!isCustomOrder && config.sortOrder === 'category' && currentCategory !== kpi.category) {
                    if (currentCategory !== null) {
                        html += '</div></div>'; // Fechar grupo anterior (dashboard-cards e kpi-category-group)
                    }
                    currentCategory = kpi.category;
                    html += `
                        <div class="kpi-category-group" style="margin-bottom: 24px;">
                            <h3 style="color: #60a5fa; font-size: 18px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #1e3a8a;">
                                <i class="fas fa-tag"></i> ${kpi.category}
                            </h3>
                            <div class="dashboard-cards kpi-draggable-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">
                    `;
                }
                
                const value = kpi.getValue(data);
                // Debug para verificar valores
                if (kpi.id === 'db-availability-ok') {
                    debugLog(`🔍 Card db-availability-ok: value=${value}, data=${JSON.stringify(data.db_availability || {})}`, 'info');
                }
                const cardClass = kpi.getCardClass(data);
                const valueColor = kpi.getValueColor(data);
                const displayValue = kpi.id === 'db-availability-total' ? formatNumber(value) : value;
                // Para db-availability-ok, usar o kpiType específico, não 'all'
                const onClick = kpi.all 
                    ? `showProblematicInstances('${kpi.kpiType}', '${kpi.modalTitle}', true)`
                    : kpi.okFilter
                    ? `showProblematicInstances('${kpi.kpiType}', '${kpi.modalTitle}')`
                    : `showProblematicInstances('${kpi.kpiType}', '${kpi.modalTitle}')`;
                
                // Sempre adicionar drag and drop (nativo para todas as opções)
                const draggableAttr = 'draggable="true"';
                const dragClass = 'kpi-draggable';
                
                // Para drag and drop, usar event listener ao invés de onclick inline
                const cardId = `kpi-card-${kpi.id}-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                
                html += `
                    <div class="kpi-card ${cardClass} ${dragClass}" 
                         id="${cardId}"
                         data-kpi-id="${kpi.id}"
                         ${draggableAttr}
                         style="cursor: grab; position: relative;">
                        <div class="kpi-drag-handle" style="position: absolute; top: 4px; right: 4px; color: #64748b; font-size: 12px; opacity: 0.5; cursor: grab;"><i class="fas fa-grip-vertical"></i></div>
                        <div class="kpi-header">
                            <span class="kpi-title">${kpi.title}</span>
                            <i class="fas ${kpi.icon} kpi-icon"></i>
                        </div>
                        <div class="kpi-subtitle">${kpi.subtitle}</div>
                        <div class="kpi-value" style="color: ${valueColor};">
                            ${displayValue}
                        </div>
                    </div>
                `;
                
                // Armazenar o onClick para ser adicionado depois
                if (!window._kpiCardClickHandlers) {
                    window._kpiCardClickHandlers = [];
                }
                window._kpiCardClickHandlers.push({
                    cardId: cardId,
                    onClick: onClick
                });
                
                // Fechar último grupo se for o último item
                if (index === kpis.length - 1 && currentCategory !== null && !isCustomOrder) {
                    html += '</div></div>'; // Fechar dashboard-cards e kpi-category-group
                }
            });
            
            // Se não foi por categoria ou se for custom, adicionar container de cards
            if (isCustomOrder || config.sortOrder !== 'category') {
                html = `<div class="dashboard-cards kpi-draggable-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;">${html}</div>`;
            }
            
            return html;
        }
        
        async function renderDashboardCardsForTab(tabId) {
            const tab = openTabs.get(tabId);
            if (!tab) return;
            
            const contentElement = tab.contentElement;
            contentElement.innerHTML = createPremiumLoading('Carregando KPIs...');
            
            // Usar a mesma lógica de renderDashboardCards, mas renderizar na aba
            await renderDashboardCardsContent(contentElement, tabId);
        }
        
        async function renderDashboardCardsContent(contentElement, tabId = null, backgroundRefresh = false) {
            try {
                // Se não for refresh em background, mostrar loading
                if (!backgroundRefresh) {
                    contentElement.innerHTML = createPremiumLoading('Carregando KPIs...');
                }
                
                const response = await fetch('/api/oracle-kpis/dashboard');
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Erro ao carregar KPIs');
                }
                
                const data = result.data;
                
                // Gerar cards usando a função dinâmica
                const kpiCardsHtml = generateKPICards(data);
                
                const html = `
                    <div style="padding: 24px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                            <h2 style="font-size: 24px; color: #60a5fa; margin: 0;">
                                <i class="fas fa-chart-line"></i> Dashboard de KPIs
                            </h2>
                            <button id="refreshDashboardBtn" 
                                    onclick="refreshDashboardKPIs()"
                                    style="padding: 8px 16px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border: none; border-radius: 6px; color: white; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;"
                                    onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 4px 12px rgba(16, 185, 129, 0.4)'"
                                    onmouseout="this.style.transform=''; this.style.boxShadow=''"
                                    title="Atualizar Dashboard">
                                <i class="fas fa-sync-alt"></i> Atualizar
                            </button>
                        </div>
                        
                        <!-- Grid de Cards - Gerado dinamicamente -->
                        ${kpiCardsHtml}
                                </div>
                `;
                
                contentElement.innerHTML = html;
                
                // Adicionar event listeners de click aos cards
                if (window._kpiCardClickHandlers) {
                    window._kpiCardClickHandlers.forEach(handler => {
                        const card = document.getElementById(handler.cardId);
                        if (card) {
                            let dragStarted = false;
                            let mouseDownX = 0;
                            let mouseDownY = 0;
                            
                            card.addEventListener('mousedown', (e) => {
                                dragStarted = false;
                                mouseDownX = e.clientX;
                                mouseDownY = e.clientY;
                            });
                            
                            card.addEventListener('dragstart', () => {
                                dragStarted = true;
                            });
                            
                            card.addEventListener('click', (e) => {
                                // Verificar se houve movimento significativo (mais de 5px)
                                const moved = Math.abs(e.clientX - mouseDownX) > 5 || Math.abs(e.clientY - mouseDownY) > 5;
                                if (!dragStarted && !moved) {
                                    eval(handler.onClick);
                                }
                            });
                        }
                    });
                    window._kpiCardClickHandlers = [];
                }
                
                // Inicializar drag and drop para os cards de KPI
                initializeKPIDragAndDrop(contentElement);
                
                // Configurar auto-refresh a cada 30 segundos quando estiver no dashboard KPI
                if (tabId) {
                    // Se está em uma aba, configurar refresh apenas para essa aba
                    // Limpar intervalo anterior desta aba se existir
                    const tab = openTabs.get(tabId);
                    if (tab && tab.interval) {
                        clearInterval(tab.interval);
                        tab.interval = null;
                    }
                    if (tabIntervals.has(tabId)) {
                        clearInterval(tabIntervals.get(tabId));
                        tabIntervals.delete(tabId);
                    }
                    if (dashboardRefreshInterval) {
                        clearInterval(dashboardRefreshInterval);
                    }
                    
                    // Criar novo intervalo e armazenar na aba (usar intervalo configurado)
                    if (kpiRefreshInterval > 0) {
                        // Limpar qualquer intervalo anterior desta aba ANTES de criar novo
                        if (tabIntervals.has(tabId)) {
                            clearInterval(tabIntervals.get(tabId));
                            tabIntervals.delete(tabId);
                        }
                        if (tab && tab.interval) {
                            clearInterval(tab.interval);
                            tab.interval = null;
                        }
                        
                        const intervalId = setInterval(() => {
                            const currentTab = openTabs.get(tabId);
                            if (currentTab && currentTab.tabType === 'dashboard-kpis') {
                                refreshDashboardKPIsInBackground(tabId);
                            } else {
                                // Se a aba não existe mais ou mudou de tipo, limpar intervalo
                                clearInterval(intervalId);
                                tabIntervals.delete(tabId);
                                if (currentTab) {
                                    currentTab.interval = null;
                                }
                                // Se era o intervalo global, limpar também
                                if (dashboardRefreshInterval === intervalId) {
                                    dashboardRefreshInterval = null;
                                }
                            }
                        }, kpiRefreshInterval);
                        
                        // Armazenar em todos os lugares para garantir limpeza completa
                        dashboardRefreshInterval = intervalId;
                        tabIntervals.set(tabId, intervalId);
                        if (tab) {
                            tab.interval = intervalId;
                        }
                        
                        debugLog(`✅ Auto-refresh criado para aba dashboard ${tabId}: ${kpiRefreshInterval / 1000}s`, 'info');
                    }
                } else {
                    // Se não está em uma aba, usar lógica antiga
                    if (dashboardRefreshInterval) {
                        clearInterval(dashboardRefreshInterval);
                    }
                    if (kpiRefreshInterval > 0) {
                        dashboardRefreshInterval = setInterval(() => {
                            // Só atualizar se não houver servidor selecionado nem abas abertas
                            if (!selectedServer && openTabs.size === 0) {
                                refreshDashboardKPIsInBackground(null);
                            }
                        }, kpiRefreshInterval);
                    }
                }
                
            } catch (error) {
                debugLog(`❌ Erro ao carregar dashboard: ${error.message}`, 'error');
                contentElement.innerHTML = `
                    <div style="padding: 24px;">
                        <div class="card" style="background: #7f1d1d; border-color: #991b1b;">
                            <h4 style="color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Erro ao carregar KPIs</h4>
                            <p style="color: #fecaca;">${error.message}</p>
                        </div>
                    </div>
                `;
            }
        }

        // Função para testar conexão (ping) com o servidor - apenas hostname, sem instância
        async function pingServer(hostname) {
            try {
                // Ping apenas no hostname, sem instância
                const response = await fetch(`/api/monitoring/test-connection/${hostname}`);
                const result = await response.json();
                return result;
            } catch (error) {
                return {
                    success: false,
                    message: `Erro ao testar conexão: ${error.message}`,
                    response_time_ms: 0
                };
            }
        }
        
        // Função auxiliar para extrair hostname (sem instância e sem domínio)
        function extractHostname(serverIdOrName) {
            let hostname = serverIdOrName;
            
            // Remover instância do formato HOST\INSTANCE
            if (hostname.includes('\\')) {
                const parts = hostname.split('\\');
                hostname = parts[0]; // Apenas o hostname antes da barra invertida
            }
            // Remover instância do formato HOST_INSTANCE
            else if (hostname.includes('_')) {
                const parts = hostname.split('_');
                // Verificar se a última parte parece ser uma instância (ex: I01, I02, DEFAULT)
                const lastPart = parts[parts.length - 1];
                if (lastPart.match(/^I\d+$|^DEFAULT$/i)) {
                    hostname = parts.slice(0, -1).join('_'); // Tudo exceto a última parte
                }
                // Se não parece ser instância, pode ser parte do nome do servidor
            }
            
            // Remover domínio se houver (ex: SQLHDSPRD302.tapnet.tap.pt -> SQLHDSPRD302)
            hostname = hostname.split('.')[0];
            
            return hostname;
        }

        async function showProblematicInstances(kpiType, title, showAll = false) {
            const modal = document.getElementById('instancesModal');
            const modalTitle = document.getElementById('instancesModalTitle');
            const modalBody = document.getElementById('instancesModalBody');
            
            modalTitle.textContent = title;
            
            // Armazenar o tipo de KPI no modal para usar quando clicar na instância
            modal.dataset.kpiType = kpiType;
            modalBody.innerHTML = createPremiumLoading('Carregando instâncias...');
            modal.classList.add('show');
            
            try {
                const url = showAll ? `/api/oracle-kpis/instances/${kpiType}?all=true` : `/api/oracle-kpis/instances/${kpiType}`;
                const response = await fetch(url);
                const result = await response.json();
                
                if (!result.success) {
                    throw new Error(result.error || 'Erro ao carregar instâncias');
                }
                
                const instances = result.instances || [];
                
                if (instances.length === 0) {
                    const emptyMessage = kpiType === 'db-availability-ok' 
                        ? 'Nenhuma instância OK encontrada.' 
                        : 'Nenhuma instância com problema encontrada.';
                    modalBody.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: #94a3b8;">
                            <i class="fas fa-check-circle" style="font-size: 48px; color: #10b981; margin-bottom: 16px;"></i>
                            <p>${emptyMessage}</p>
                        </div>
                    `;
                    return;
                }
                
                const summaryText = kpiType === 'db-availability-ok'
                    ? `Total: <strong style="color: #f1f5f9;">${instances.length}</strong> instância(s) OK`
                    : `Total: <strong style="color: #f1f5f9;">${instances.length}</strong> instância(s) com problema`;
                
                let html = `
                    <div style="margin-bottom: 16px; color: #94a3b8; font-size: 14px;">
                        ${summaryText}
                    </div>
                    <div class="instances-list">
                `;
                
                instances.forEach((instance, index) => {
                    // Para Always On, priorizar ServerInstance, depois INSTANCE, depois AG_NAME
                    let instanceName = '';
                    if (kpiType === 'always-on') {
                        // Priorizar ServerInstance (mais importante)
                        instanceName = instance.SERVER_INSTANCE || instance.server_instance || 
                                       instance.INSTANCE || instance.instance || 
                                       instance.AG_NAME || instance.ag_name || 
                                       instance.AGNAME || instance.agname ||
                                       'N/A';
                    } else {
                        // Para outros KPIs, usar lógica padrão
                        instanceName = instance.INSTANCE || instance.instance || 
                                       instance.AG_NAME || instance.ag_name || 
                                       instance.AGNAME || instance.agname ||
                                       'N/A';
                    }
                    
                    // Filtrar campos para detalhes (excluir campos já usados no nome)
                    let detailsArray = Object.entries(instance)
                        .filter(([key]) => {
                            const keyUpper = key.toUpperCase();
                            return keyUpper !== 'INSTANCE' && 
                                   keyUpper !== 'AG_NAME' && 
                                   keyUpper !== 'AGNAME' &&
                                   keyUpper !== 'SERVER_INSTANCE' &&
                                   keyUpper !== 'SERVERINSTANCE';
                        })
                        .map(([key, value]) => `<strong>${key}:</strong> ${value}`);
                    
                    // Se for Always On e tiver AG_NAME, adicionar nos detalhes
                    if (kpiType === 'always-on') {
                        const agName = instance.AG_NAME || instance.ag_name || instance.AGNAME || instance.agname;
                        if (agName) {
                            detailsArray.unshift(`<strong>AG:</strong> ${agName}`);
                        }
                    }
                    
                    const details = detailsArray.join(' | ');
                    
                    // Usar data-attribute para evitar problemas com caracteres especiais
                    const safeInstanceName = instanceName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                    
                    html += `
                        <div class="instance-item" style="cursor: pointer;" 
                             data-instance-name="${instanceName.replace(/"/g, '&quot;')}" 
                             data-kpi-type="${kpiType}"
                             onclick="selectInstanceFromModal(this.dataset.instanceName, this.dataset.kpiType)">
                            <div class="instance-name" style="color: #60a5fa; font-weight: 600;">
                                <i class="fas fa-server" style="margin-right: 8px;"></i>${instanceName}
                            </div>
                            <div class="instance-details">${details || 'Sem detalhes adicionais'}</div>
                            <div style="margin-top: 8px; font-size: 11px; color: #60a5fa;">
                                <i class="fas fa-arrow-right"></i> Clique para abrir esta instância no SQL Diagnostics
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                modalBody.innerHTML = html;
                
            } catch (error) {
                debugLog(`❌ Erro ao carregar instâncias: ${error.message}`, 'error');
                modalBody.innerHTML = `
                    <div style="background: #7f1d1d; border: 1px solid #991b1b; border-radius: 8px; padding: 16px;">
                        <p style="color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Erro: ${error.message}</p>
                    </div>
                `;
            }
        }

        // Função para aplicar o intervalo de refresh
        function applyKpiRefreshInterval() {
            // Limpar intervalos existentes
            if (dashboardRefreshInterval) {
                clearInterval(dashboardRefreshInterval);
                dashboardRefreshInterval = null;
            }
            
            // Limpar intervalos das abas
            tabIntervals.forEach((intervalId, tabId) => {
                clearInterval(intervalId);
                const tab = openTabs.get(tabId);
                if (tab) {
                    tab.interval = null;
                }
            });
            tabIntervals.clear();
            
            // Se o intervalo for 0, não criar novo intervalo
            if (kpiRefreshInterval === 0) {
                debugLog('⏹️ Auto-refresh dos KPIs desabilitado', 'info');
                return;
            }
            
            // Aplicar intervalo para abas de dashboard abertas
            openTabs.forEach((tab, tabId) => {
                if (tab.tabType === 'dashboard-kpis') {
                    const intervalId = setInterval(() => {
                        const currentTab = openTabs.get(tabId);
                        if (currentTab && currentTab.tabType === 'dashboard-kpis') {
                            refreshDashboardKPIsInBackground(tabId);
                        } else {
                            clearInterval(intervalId);
                            tabIntervals.delete(tabId);
                        }
                    }, kpiRefreshInterval);
                    
                    tabIntervals.set(tabId, intervalId);
                    tab.interval = intervalId;
                }
            });
            
            // Aplicar intervalo para dashboard principal (se não houver abas)
            if (!selectedServer && openTabs.size === 0) {
                dashboardRefreshInterval = setInterval(() => {
                    if (!selectedServer && openTabs.size === 0) {
                        refreshDashboardKPIsInBackground(null);
                    }
                }, kpiRefreshInterval);
            }
            
            debugLog(`✅ Auto-refresh dos KPIs configurado: ${kpiRefreshInterval / 1000} segundos`, 'success');
        }

        window.saveSqlServersConfig = async function() {
            const textarea = document.getElementById('sqlServersJson');
            const jsonText = textarea.value.trim();
            
            try {
                // Validar JSON
                const parsed = JSON.parse(jsonText);
                
                // Enviar para o servidor
                const response = await fetch('/api/config/sql-servers', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(parsed)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    debugLog('✅ Configuração de servidores salva com sucesso', 'success');
                    
                    // Mostrar feedback visual
                    const button = textarea.nextElementSibling.querySelector('button');
                    const originalText = button.innerHTML;
                    button.innerHTML = '<i class="fas fa-check"></i> Salvo!';
                    button.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                    setTimeout(() => {
                        button.innerHTML = originalText;
                        button.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                    }, 2000);
                } else {
                    throw new Error(result.error || 'Erro ao salvar configuração');
                }
            } catch (error) {
                debugLog(`❌ Erro ao salvar configuração: ${error.message}`, 'error');
                alert(`Erro ao salvar configuração: ${error.message}\n\nVerifique se o JSON está válido.`);
            }
        };

    SUBSTRING(t.text, (r.statement_start_offset/2)+1, 
        ((CASE r.statement_end_offset 
            WHEN -1 THEN DATALENGTH(t.text) 
            ELSE r.statement_end_offset 
        END - r.statement_start_offset)/2) + 1) AS statement_text
FROM sys.dm_exec_requests r
INNER JOIN sys.dm_exec_sessions s ON r.session_id = s.session_id
OUTER APPLY sys.dm_exec_sql_text(r.sql_handle) t
WHERE s.is_user_process = 1;`,

            },

    i.name AS IndexName,
    i.type_desc AS IndexType,

    s.user_scans,
    s.user_lookups,
    s.user_updates,
    s.last_user_seek,
    s.last_user_scan,
    s.last_user_lookup
FROM sys.indexes i
LEFT JOIN sys.dm_db_index_usage_stats s 
    ON i.object_id = s.object_id 
    AND i.index_id = s.index_id 
    AND s.database_id = DB_ID()
WHERE i.object_id > 100 
    AND i.type > 0
    AND (s.user_seeks = 0 OR s.user_seeks IS NULL)

        // Função para validar SQL básico
        function validateSQL(sql) {
            if (!sql || sql.trim().length === 0) {
                return { valid: false, error: "SQL não pode estar vazio" };
            }
            
            // Verificar se contém pelo menos uma palavra-chave SQL
            const sqlKeywords = ['SELECT', 'INSERT', 'UPDATE', 'DELETE', 'EXEC', 'EXECUTE', 'WITH'];
            const upperSql = sql.toUpperCase().trim();
            const hasKeyword = sqlKeywords.some(keyword => upperSql.startsWith(keyword));
            
            if (!hasKeyword) {
                return { valid: false, error: "SQL deve começar com uma palavra-chave válida (SELECT, INSERT, UPDATE, DELETE, EXEC, etc.)" };
            }
            
            // Verificar se não contém comandos perigosos (básico)
            const dangerousKeywords = ['DROP DATABASE', 'DROP TABLE', 'TRUNCATE TABLE', 'ALTER DATABASE', 'SHUTDOWN'];
            const hasDangerous = dangerousKeywords.some(keyword => upperSql.includes(keyword));
            
            if (hasDangerous) {
                return { valid: false, error: "SQL contém comandos potencialmente perigosos. Use apenas queries de leitura (SELECT)" };
            }
            
            return { valid: true };
        }

        // Função para inicializar CodeMirror
        function initializeCodeMirror(textareaId) {
            const textarea = document.getElementById(textareaId);
            if (!textarea) return;
            
            // Se já existe um editor, não criar outro
            if (codeMirrorEditors.has(textareaId)) {
                return;
            }
            
            const editor = CodeMirror.fromTextArea(textarea, {
                mode: 'text/x-sql',
                theme: 'monokai',
                lineNumbers: true,
                indentWithTabs: true,
                smartIndent: true,
                lineWrapping: true,
                matchBrackets: true,
                autofocus: false,
                readOnly: false
            });
            
            codeMirrorEditors.set(textareaId, editor);
            
            // Atualizar textarea quando editor mudar
            editor.on('change', function() {
                editor.save();
            });
        }

        // Função para testar query
        window.testQuerySQL = async function(queryId) {
            const nameInput = document.getElementById(`queryName_${queryId}`);
            const sqlTextarea = document.getElementById(`querySql_${queryId}`);
            const requiresDbCheck = document.getElementById(`queryRequiresDb_${queryId}`);

                return;
            }
            
            let sql = sqlTextarea.value;
            
            // Se tem CodeMirror, pegar do editor
            const editor = codeMirrorEditors.get(`querySql_${queryId}`);
            if (editor) {
                sql = editor.getValue();
            }
            
            const requiresDb = requiresDbCheck ? requiresDbCheck.checked : false;
            
            // Validar SQL
            const validation = validateSQL(sql);
            if (!validation.valid) {
                alert(`SQL inválido: ${validation.error}`);
                return;
            }
            
            // Verificar se há um servidor selecionado
            let serverId = null;
            
            if (selectedServer && selectedServer.server_id) {
                serverId = selectedServer.server_id;
            } else {
                // Tentar pegar da aba ativa
                const activeTab = openTabs.get(activeTabId);
                if (activeTab && activeTab.server && activeTab.server.server_id) {
                    serverId = activeTab.server.server_id;
                } else {
                    // Pedir para o usuário selecionar
                    const serverList = Array.from(allServers.values());
                    if (serverList.length === 0) {
                        alert('Nenhum servidor disponível. Por favor, recarregue a página.');
                        return;
                    }
                    
                    // Criar lista de opções
                    const serverOptions = serverList.map(s => `${s.server_id} - ${s.name || s.server_id}`).join('\n');
                    const selectedIndex = prompt(`Selecione um servidor (digite o número):\n\n${serverList.map((s, i) => `${i + 1}. ${s.server_id}`).join('\n')}\n\nDigite o número:`);
                    
                    if (!selectedIndex || isNaN(selectedIndex)) {
                        alert('Operação cancelada.');
                        return;
                    }
                    
                    const index = parseInt(selectedIndex) - 1;
                    if (index < 0 || index >= serverList.length) {
                        alert('Número inválido.');
                        return;
                    }
                    
                    serverId = serverList[index].server_id;
                }
            }
            
            if (!serverId) {
                alert('Não foi possível determinar o servidor. Por favor, selecione um servidor na lista à esquerda.');
                return;
            }
            let database = null;
            
            // Se requer database, pedir para selecionar
            if (requiresDb) {
                database = prompt('Esta query requer um database. Digite o nome do database:');
                if (!database) {
                    alert('Database é obrigatório para esta query.');
                    return;
                }
            }
            
            // Substituir placeholders
            let finalSql = sql;
            if (database) {
                finalSql = finalSql.replace(/{database}/g, database);
                finalSql = finalSql.replace(/{db}/g, database);
            }
            finalSql = finalSql.replace(/{server_id}/g, serverId);
            
            // Executar query
            try {
                const response = await fetch(`/api/queries/custom/${serverId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sql: finalSql,
                        database: database
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Erro ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                
                // Abrir resultado em uma nova aba dinâmica
                const tabId = `test-query-${Date.now()}`;
                const tabName = `Teste: ${nameInput.value || 'Query'}`;
                
                openDynamicTab(tabId, tabName, 'sql-diag', selectedServer);
                
                // Aguardar um pouco para a aba ser criada
                setTimeout(async () => {
                    const tab = openTabs.get(tabId);

                                </div>
                        `;
                        
                        if (result.success && result.results) {
                            const results = result.results;
                            const columns = result.columns || Object.keys(results[0] || {});
                            
                            html += `
                                <div style="overflow-x: auto;">
                                    <table class="data-table" style="width: 100%; border-collapse: collapse;">
                                        <thead>
                                            <tr>
                                                ${columns.map(col => `<th style="padding: 8px; text-align: left; border-bottom: 1px solid #334155; color: #60a5fa;">${col}</th>`).join('')}
                                            </tr>
                                        </thead>
                                        <tbody>
                            `;
                            
                            results.forEach(row => {
                                html += '<tr>';
                                columns.forEach(col => {
                                    const value = row[col] !== null && row[col] !== undefined ? String(row[col]) : '';
                                    html += `<td style="padding: 8px; border-bottom: 1px solid #334155; color: #e2e8f0;">${escapeHtml(value)}</td>`;
                                });
                                html += '</tr>';
                            });
                            
                            html += `
                                        </tbody>
                                    </table>
                                    <p style="color: #94a3b8; margin-top: 12px; font-size: 12px;">
                                        Total de linhas: <strong>${results.length}</strong>
                                    </p>
                                </div>
                            `;
                        } else {
                            html += `
                                <div style="padding: 16px; background: #7f1d1d; border: 1px solid #dc2626; border-radius: 6px; color: #fca5a5;">
                                    <i class="fas fa-exclamation-triangle"></i> Erro ao executar query: ${result.error || 'Erro desconhecido'}
                                </div>

                        html += '</div>';
                        tab.contentElement.innerHTML = html;

            } catch (error) {

                alert(`❌ Erro ao testar query: ${error.message}`);
            }
        };
        
        // Função para salvar query
        window.saveCustomQuery = async function(queryId) {
            const nameInput = document.getElementById(`queryName_${queryId}`);
            const descriptionInput = document.getElementById(`queryDescription_${queryId}`);
            const sqlTextarea = document.getElementById(`querySql_${queryId}`);
            const enabledCheck = document.getElementById(`queryEnabled_${queryId}`);
            const requiresDbCheck = document.getElementById(`queryRequiresDb_${queryId}`);
            
            if (!nameInput || !sqlTextarea) {
                alert('Erro: Campos não encontrados');
                return;
            }
            
            const name = nameInput.value.trim();
            const description = descriptionInput ? descriptionInput.value.trim() : '';
            let sql = sqlTextarea.value;
            
            // Se tem CodeMirror, pegar do editor
            const editor = codeMirrorEditors.get(`querySql_${queryId}`);
            if (editor) {
                sql = editor.getValue();
            }
            
            const enabled = enabledCheck ? enabledCheck.checked : true;
            const requiresDb = requiresDbCheck ? requiresDbCheck.checked : false;
            
            // Validar
            if (!name) {
                alert('Por favor, insira um nome para a query');
                nameInput.focus();
                return;
            }
            
            const validation = validateSQL(sql);
            if (!validation.valid) {
                if (!confirm(`Aviso: ${validation.error}\n\nDeseja salvar mesmo assim?`)) {
                    return;
                }
            }
            
            // Buscar queries existentes
            try {
                const response = await fetch('/api/config/custom-queries');
                if (!response.ok) {
                    throw new Error(`Erro ao carregar queries: ${response.status} ${response.statusText}`);
                }
                
                const queries = await response.json();
                if (!Array.isArray(queries)) {
                    throw new Error('Resposta inválida do servidor');
                }
                
                // Encontrar ou criar query
                let queryIndex = queries.findIndex(q => (q.id || '').toString() === queryId.toString());
                
                const queryData = {
                    id: queryId.startsWith('new_') ? `custom-query-${Date.now()}` : queryId,
                    name: name,
                    description: description,
                    sql: sql,
                    icon: 'fa-database', // Pode ser melhorado para permitir escolha
                    requiresDb: requiresDb,
                    enabled: enabled
                };
                
                // Garantir que todas as queries existentes têm os campos obrigatórios
                const validQueries = queries.map(q => ({
                    id: q.id || '',
                    name: q.name || '',
                    sql: q.sql || '',
                    description: q.description || '',
                    icon: q.icon || 'fa-database',
                    requiresDb: q.requiresDb || false,
                    enabled: q.enabled !== undefined ? q.enabled : true
                })).filter(q => q.id && q.name && q.sql); // Remover queries inválidas
                
                if (queryIndex >= 0) {
                    // Atualizar query existente
                    const existingIndex = validQueries.findIndex(q => q.id === queryData.id);
                    if (existingIndex >= 0) {
                        validQueries[existingIndex] = queryData;
                    } else {
                        validQueries.push(queryData);
                    }
                } else {
                    // Adicionar nova query
                    validQueries.push(queryData);
                }
                
                // Salvar
                const saveResponse = await fetch('/api/config/custom-queries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(validQueries)
                });
                
                if (!saveResponse.ok) {
                    const errorText = await saveResponse.text();
                    let errorMessage = `Erro ${saveResponse.status}: ${saveResponse.statusText}`;
                    try {
                        const errorJson = JSON.parse(errorText);
                        errorMessage = errorJson.detail || errorMessage;
                    } catch (e) {
                        errorMessage = errorText || errorMessage;
                    }
                    throw new Error(errorMessage);
                }
                
                // Recarregar lista
                await loadCustomQueriesManager();
                
                // Feedback
                const result = await saveResponse.json();
                
                // Atualizar todas as abas SQL Diagnostics abertas
                let updatedTabs = 0;
                for (const [tabId, tab] of openTabs.entries()) {
                    if (tab.tabType === 'sql-diag') {
                        await loadSQLDiagnosticsForTab(tabId);
                        updatedTabs++;
                    }
                }
                
                if (updatedTabs > 0) {
                    alert(`✅ Query salva com sucesso!\n\n${result.message || ''}\n\n${updatedTabs} aba(s) SQL Diagnostics atualizada(s) automaticamente.`);
                } else {
                    alert(`✅ Query salva com sucesso!\n\n${result.message || ''}\n\nAbra a aba SQL Diagnostics para ver a nova query.`);

                    requiresDb: q.requiresDb || false,
                    enabled: q.enabled !== undefined ? q.enabled : true
                })).filter(q => q.id && q.name && q.sql); // Remover queries inválidas
                
                const saveResponse = await fetch('/api/config/custom-queries', {
                    method: 'POST',

        // Função para selecionar instância do modal e abrir o servidor no SQL Diagnostics
        async function selectInstanceFromModal(instanceName, kpiType = null) {
            // Garantir que recebemos uma string válida
            if (!instanceName || typeof instanceName !== 'string') {
                debugLog(`❌ Nome de instância inválido: ${instanceName}`, 'error');
                alert('Erro: Nome de instância inválido.');
                return;
            }
            
            debugLog(`🔍 Buscando servidor para instância: ${instanceName}`, 'info');
            debugLog(`📋 Tipo: ${typeof instanceName}, Valor: "${instanceName}"`, 'info');
            debugLog(`📋 KPI Type: ${kpiType}`, 'info');
            
            // Se for Always On, buscar a instância correta no inventory primeiro
            let resolvedServerId = null;
            if (kpiType === 'always-on') {
                try {
                    debugLog(`🔍 Buscando instância no inventory para AG: ${instanceName}`, 'info');
                    const response = await fetch(`/api/alwayson/instance-by-ag/${encodeURIComponent(instanceName)}`);
                    
                    // Verificar se a resposta é OK
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Erro desconhecido' }));
                        debugLog(`⚠️ Erro HTTP ${response.status}: ${errorData.error || 'N/A'}`, 'warning');
                        alert(`AG "${instanceName}" não foi encontrado na configuração.\n\n` +
                              `Erro: ${errorData.error || 'AG não configurado'}\n\n` +
                              `Sugestão: ${errorData.suggestion || 'Verifique se o AG está configurado no alwayson_inventory.json ou sql_servers.json'}`);
                        closeInstancesModal();
                        return;
                    }
                    
                    const result = await response.json();
                    
                    if (result.success && result.server_id) {
                        debugLog(`✅ Instância encontrada no inventory: ${result.server_id} (${result.server}\\${result.instance || 'DEFAULT'})`, 'success');
                        debugLog(`📋 Source: ${result.source || 'unknown'}`, 'info');
                        // Usar o server_id encontrado no inventory
                        resolvedServerId = result.server_id;
                        instanceName = result.server_id;
                    } else {
                        debugLog(`⚠️ AG não encontrado no inventory: ${result.error || 'N/A'}`, 'warning');
                        // Mostrar mensagem mais clara ao usuário
                        alert(`AG "${instanceName}" não foi encontrado na configuração.\n\n` +
                              `Erro: ${result.error || 'AG não configurado'}\n\n` +
                              `Sugestão: ${result.suggestion || 'Verifique se o AG está configurado no alwayson_inventory.json ou sql_servers.json'}`);
                        closeInstancesModal();
                        return;
                    }
                } catch (error) {
                    debugLog(`⚠️ Erro ao buscar instância no inventory: ${error.message}`, 'error');
                    alert(`Erro ao buscar instância para o AG "${instanceName}":\n${error.message}\n\nTente buscar manualmente na barra de pesquisa.`);
                    closeInstancesModal();
                    return;
                }
            }
            
            // Remover domínio do nome (ex: "SQLHDSPRD302.tapnet.tap.pt" -> "SQLHDSPRD302")
            const removeDomain = (hostname) => {
                if (!hostname) return hostname;
                // Remover domínios comuns (.tapnet.tap.pt, .tap.pt, etc)
                return hostname.split('.')[0];
            };
            
            // Extrair host e instância do nome (pode vir como "SQLHDSPRD014\I03" ou "SQLHDSPRD014_I03" ou "SQLHDSPRD302.tapnet.tap.pt\I01")
            let host = '';
            let instance = '';
            
            if (instanceName.includes('\\')) {
                const parts = instanceName.split('\\', 2);
                host = removeDomain(parts[0]); // Remover domínio do host
                instance = parts[1] || '';
            } else if (instanceName.includes('_')) {
                const parts = instanceName.split('_');
                host = removeDomain(parts.slice(0, -1).join('_')); // Tudo exceto a última parte, removendo domínio
                instance = parts[parts.length - 1]; // Última parte
            } else {
                host = removeDomain(instanceName);
            }
            
            // Normalizar instância (remover zeros à esquerda, tratar I maiúsculo/minúsculo)
            const normalizeInstance = (inst) => {
                if (!inst) return '';
                // Se começa com I, manter o I e normalizar o número
                if (inst.toUpperCase().startsWith('I')) {
                    const num = inst.substring(1).replace(/^0+/, '') || '0';
                    return 'I' + num.padStart(inst.substring(1).length, '0'); // Manter zeros à esquerda originais
                }
                // Se é só número, normalizar
                return inst.replace(/^0+/, '') || '0';
            };
            
            const normalizedInstance = normalizeInstance(instance);
            const hostLower = host.toLowerCase();
            
            debugLog(`📋 Host: ${host}, Instância: ${instance} (normalizada: ${normalizedInstance})`, 'info');
            
            // Tentar encontrar o servidor na lista
            let foundServer = null;
            
            // 0. Se temos um resolvedServerId (do Always On), buscar diretamente por ele primeiro
            if (resolvedServerId) {
                foundServer = allServers.find(server => {
                    const match = server.server_id.toLowerCase() === resolvedServerId.toLowerCase();
                    if (match) {
                        debugLog(`✅ Match direto pelo resolvedServerId: ${server.server_id}`, 'success');
                    }
                    return match;
                });
                
                // Se não encontrou pelo server_id, tentar pelo name também
                if (!foundServer) {
                    // Converter resolvedServerId para formato name (SQLHDSPRD214_I01 -> SQLHDSPRD214\I01)
                    const nameFormat = resolvedServerId.replace('_', '\\');
                    foundServer = allServers.find(server => {
                        const match = server.name.toLowerCase() === nameFormat.toLowerCase();
                        if (match) {
                            debugLog(`✅ Match pelo name formatado do resolvedServerId: ${server.name}`, 'success');
                        }
                        return match;
                    });
                }
            }
            
            // 1. Match exato com barra invertida (name) - formato: SQLHDSPRD023\I01
            // Também tentar sem domínio (só se ainda não encontrou)
            if (!foundServer) {
            foundServer = allServers.find(server => {
                const serverNameLower = server.name.toLowerCase();
                const instanceNameLower = instanceName.toLowerCase();
                const instanceNameNoDomain = instanceNameLower.split('\\').map(p => removeDomain(p)).join('\\');
                
                if (serverNameLower === instanceNameLower || serverNameLower === instanceNameNoDomain) {
                    debugLog(`✅ Match exato no name: ${server.name}`, 'success');
                    return true;
                }
                return false;
            });
            }
            
            // 2. Match exato com underscore (server_id) - formato: SQLHDSPRD023_I01
            if (!foundServer) {
                const expectedId = instance ? `${host}_${instance}` : host;
                foundServer = allServers.find(server => {
                    const match = server.server_id.toLowerCase() === expectedId.toLowerCase();
                    if (match) {
                        debugLog(`✅ Match exato no server_id: ${server.server_id}`, 'success');
                    }
                    return match;
                });
            }
            
            // 2b. Match exato com underscore alternativo (caso a instância venha sem I)
            if (!foundServer && instance) {
                // Tentar com e sem o I na frente
                const variations = [
                    `${host}_${instance}`,           // SQLHDSPRD023_I01
                    `${host}_I${instance}`,          // SQLHDSPRD023_II01 (se vier só 01)
                    `${host}_${instance.replace(/^I/i, '')}`, // SQLHDSPRD023_01 (se vier I01)
                ];
                
                for (const variation of variations) {
                    foundServer = allServers.find(server => {
                        const match = server.server_id.toLowerCase() === variation.toLowerCase();
                        if (match) {
                            debugLog(`✅ Match exato no server_id (variação): ${server.server_id}`, 'success');
                        }
                        return match;
                    });
                    if (foundServer) break;
                }
            }
            
            // 3. Match com instância normalizada (I03 = I03, I003 = I003, etc)
            // Considerar também remoção de domínio
            if (!foundServer && instance) {
                foundServer = allServers.find(server => {
                    const serverNameLower = server.name.toLowerCase();
                    const serverIdLower = server.server_id.toLowerCase();
                    
                    // Tentar match no name (formato HOST\INSTANCE)
                    if (serverNameLower.includes('\\')) {
                        const [srvHostFull, srvInst] = serverNameLower.split('\\', 2);
                        const srvHost = removeDomain(srvHostFull);
                        if (srvHost === hostLower) {
                            const srvInstNorm = normalizeInstance(srvInst);
                            if (srvInstNorm === normalizedInstance || srvInstNorm.toLowerCase() === normalizedInstance.toLowerCase()) {
                                debugLog(`✅ Match normalizado no name (sem domínio): ${server.name}`, 'success');
                                return true;
                            }
                        }
                    }
                    
                    // Tentar match no server_id (formato HOST_INSTANCE)
                    if (serverIdLower.includes('_')) {
                        const parts = serverIdLower.split('_');
                        const srvHostFull = parts.slice(0, -1).join('_');
                        const srvHost = removeDomain(srvHostFull);
                        const srvInst = parts[parts.length - 1];
                        if (srvHost === hostLower) {
                            const srvInstNorm = normalizeInstance(srvInst);
                            if (srvInstNorm === normalizedInstance || srvInstNorm.toLowerCase() === normalizedInstance.toLowerCase()) {
                                debugLog(`✅ Match normalizado no server_id (sem domínio): ${server.server_id}`, 'success');
                                return true;
                            }
                        }
                    }
                    
                    return false;
                });
            }
            
            // 4. Match parcial (apenas host, pegar primeira instância encontrada)
            // Também tentar match sem domínio
            if (!foundServer) {
                foundServer = allServers.find(server => {
                    const serverNameLower = server.name.toLowerCase();
                    const serverIdLower = server.server_id.toLowerCase();
                    const serverHost = removeDomain(serverNameLower.split('\\')[0] || serverNameLower.split('_')[0] || '');
                    const serverIdHost = removeDomain(serverIdLower.split('_')[0] || '');
                    
                    return serverNameLower.startsWith(hostLower + '\\') || 
                           serverNameLower.startsWith(hostLower + '_') ||
                           serverIdLower.startsWith(hostLower + '_') ||
                           serverHost === hostLower ||
                           serverIdHost === hostLower;
                });
            }
            
            // 5. Match flexível (busca por substring)
            // Considerar também sem domínio
            if (!foundServer) {
                foundServer = allServers.find(server => {
                    const serverNameLower = server.name.toLowerCase();
                    const serverIdLower = server.server_id.toLowerCase();
                    const searchTerm = instanceName.toLowerCase();
                    const searchTermNoDomain = removeDomain(searchTerm.split('\\')[0] || searchTerm.split('_')[0] || searchTerm);
                    const serverHostNoDomain = removeDomain(serverNameLower.split('\\')[0] || serverNameLower.split('_')[0] || serverNameLower);
                    const serverIdHostNoDomain = removeDomain(serverIdLower.split('_')[0] || serverIdLower);
                    
                    return serverNameLower.includes(searchTerm) || 
                           serverIdLower.includes(searchTerm) ||
                           searchTerm.includes(serverNameLower) ||
                           searchTerm.includes(serverIdLower) ||
                           serverHostNoDomain === searchTermNoDomain ||
                           serverIdHostNoDomain === searchTermNoDomain ||
                           (searchTermNoDomain && serverNameLower.includes(searchTermNoDomain)) ||
                           (searchTermNoDomain && serverIdLower.includes(searchTermNoDomain));
                });
            }
            
            if (foundServer) {
                debugLog(`✅ Servidor encontrado: ${foundServer.name} (${foundServer.server_id})`, 'success');
                closeInstancesModal();
                
                // Se é instance-availability e a instância está OFF, apenas fazer ping para confirmar
                if (kpiType === 'instance-availability') {
                    debugLog(`🔍 Verificando status da instância offline: ${foundServer.name}`, 'info');
                    
                    // Extrair apenas o hostname (sem instância) do foundServer
                    const serverId = foundServer.server_id || foundServer.name || '';
                    const hostname = extractHostname(serverId);
                    
                    // Mostrar loading no modal antes de fechar
                    const modalBody = document.querySelector('#instancesModal .modal-body');
                    if (modalBody) {
                        modalBody.innerHTML = createPremiumLoading(`Verificando conectividade de ${hostname}...`);
                    }
                    
                    // Fazer ping apenas no hostname (sem instância)
                    const pingResult = await pingServer(hostname);
                    
                    // Fechar modal
                    closeInstancesModal();
                    
                    // Mostrar resultado do ping em um alerta informativo
                    if (!pingResult.success) {
                        // Instância está OFF - confirmado
                        const message = `Instância OFFLINE confirmada\n\n` +
                                      `Instância: ${foundServer.name}\n` +
                                      `Hostname: ${hostname}\n` +
                                      `Status: OFFLINE\n` +
                                      `Resultado do Ping: ${pingResult.message || 'Sem resposta'}\n` +
                                      `${pingResult.response_time_ms > 0 ? `Tempo de Resposta: ${pingResult.response_time_ms.toFixed(2)} ms\n` : ''}\n` +
                                      `A instância não está respondendo. Verifique se o serviço SQL Server está em execução.`;
                        
                        alert(message);
                    } else {
                        // Instância está ONLINE (pode ter voltado)
                        const message = `Instância ONLINE\n\n` +
                                      `Instância: ${foundServer.name}\n` +
                                      `Hostname: ${hostname}\n` +
                                      `Status: ONLINE\n` +
                                      `Tempo de Resposta: ${pingResult.response_time_ms.toFixed(2)} ms\n\n` +
                                      `A instância está respondendo ao ping.`;
                        
                        if (confirm(message + '\n\nDeseja abrir a instância?')) {
                            selectServer(foundServer);
                        }
                    }
                    return;
                }
                
                // Se é Always On, abrir a aba Always On
                if (kpiType === 'always-on') {
                    debugLog(`🔍 Navegando para Always On (KPI: ${kpiType})`, 'info');
                    createTab(foundServer, 'always-on');
                    return;
                }
                
                // Se é DB Availability, abrir modal com dados da view
                if (kpiType === 'db-availability' || kpiType === 'db-availability-ok') {
                    debugLog(`🔍 Abrindo modal de DB Availability (KPI: ${kpiType})`, 'info');
                    // O modal será aberto pela função handleKPICardClick
                    return;
                }
                
                // Se temos um kpiType, navegar diretamente para SQL Diagnostics com a query apropriada
                if (kpiType && KPI_TO_QUERY_MAP[kpiType]) {
                    const queryId = KPI_TO_QUERY_MAP[kpiType];
                    debugLog(`🔍 Navegando para SQL Diagnostics com query: ${queryId} (KPI: ${kpiType})`, 'info');
                    
                    // Criar diretamente a aba SQL Diagnostics (sem criar Overview)
                    createTab(foundServer, 'sql-diagnostics');
                    
                    // Aguardar a aba ser criada e carregada antes de executar a query
                    // Usar um intervalo para verificar se a aba está pronta
                    const checkAndExecute = setInterval(() => {
                        // Usar activeTabId para pegar a aba ativa atual
                        if (activeTabId) {
                            const tab = openTabs.get(activeTabId);
                            if (tab && tab.contentElement && tab.tabType === 'sql-diagnostics') {
                                const queryResultsDiv = tab.contentElement.querySelector('#queryResults');
                                if (queryResultsDiv) {
                                    // Aba está pronta, executar a query
                                    clearInterval(checkAndExecute);
                                    
                                    const queryEndpoint = `/api/queries/${queryId}/${foundServer.server_id}`;
                                    const queryName = getQueryName(queryId);
                                    
                                    debugLog(`🚀 Executando query automaticamente: ${queryName}`, 'info');
                                    
                                    // Executar a query automaticamente
                                    loadQueryDiagnostic(queryId, queryEndpoint, queryName, queryId === 'file-growth');
                                }
                            }
                        }
                    }, 100);
                    
                    // Timeout de segurança (máximo 3 segundos)
                    setTimeout(() => {
                        clearInterval(checkAndExecute);
                        const queryEndpoint = `/api/queries/${queryId}/${foundServer.server_id}`;
                        const queryName = getQueryName(queryId);
                        debugLog(`🚀 Executando query automaticamente (timeout): ${queryName}`, 'info');
                        loadQueryDiagnostic(queryId, queryEndpoint, queryName, queryId === 'file-growth');
                    }, 3000);
                } else {
                    // Se não há kpiType ou query mapeada, apenas selecionar o servidor (cria Overview)
                    selectServer(foundServer);
                }
                // Se não temos kpiType, o servidor já foi selecionado acima, não precisa fazer nada mais
            } else {
                debugLog(`❌ Servidor não encontrado para instância: ${instanceName}`, 'error');
                debugLog(`📋 Tentou buscar: host="${host}", instance="${instance}"`, 'info');
                debugLog(`📋 Servidores disponíveis (primeiros 5): ${allServers.slice(0, 5).map(s => s.name).join(', ')}`, 'info');
                alert(`Servidor "${instanceName}" não encontrado na lista de servidores.\n\nTente buscar manualmente na barra de pesquisa.`);
            }
        }

                // Ativar e atualizar a aba de dashboard em background
                activateTab(dashboardTab.tabId);
                refreshDashboardKPIsInBackground(dashboardTab.tabId);
                return;
            }
            
            // Se não há abas, atualizar o dashboard principal em background
            if (!selectedServer && openTabs.size === 0) {
                refreshDashboardKPIsInBackground(null);
            }
        };

        // ========================================
        // START
        // ========================================
        window.addEventListener('DOMContentLoaded', init);
    </script>

            const modal = document.getElementById('overflowModal');
            if (event.target === modal) {
                closeOverflowModal();
            }
            const reportModal = document.getElementById('reportModal');
            if (event.target === reportModal) {
                closeReportModal();
            }
            const predictiveModal = document.getElementById('predictiveAlertsModal');
            if (event.target === predictiveModal) {
                closePredictiveAlertsModal();
            }
            const instancesModal = document.getElementById('instancesModal');
            if (event.target === instancesModal) {
                closeInstancesModal();
            }
            const settingsModal = document.getElementById('settingsModal');
            if (event.target === settingsModal) {
                closeSettingsModal();
            }
        }
        </script>
