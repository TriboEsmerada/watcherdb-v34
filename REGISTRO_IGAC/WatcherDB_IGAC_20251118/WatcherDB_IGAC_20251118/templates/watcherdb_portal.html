        // ========================================
        // ALWAYS ON TAB
        // ========================================
        async function loadAlwaysOn() {
            const content = activeTabId ? openTabs.get(activeTabId)?.contentElement : document.getElementById('contentArea');
            if (!content) return;
            const serverId = selectedServer.server_id;
            
            debugLog(`🔄 Carregando Always On...`, 'info');
            debugLog(`🔑 Server ID: ${serverId}`, 'info');
            
            content.innerHTML = createPremiumLoading('Carregando Always On...');
            
            try {
                // Função auxiliar para fazer fetch com timeout (com tracking para cancelamento)
                const fetchWithTimeout = async (url, timeout = 10000) => {
                    try {
                        const controller = new AbortController();
                        const tabId = activeTabId; // Associar à aba ativa
                        
                        // Adicionar ao sistema de tracking
                        if (tabId) {
                            if (!tabAbortControllers.has(tabId)) {
                                tabAbortControllers.set(tabId, new Set());
                            }
                            tabAbortControllers.get(tabId).add(controller);
                        }
                        
                        const timeoutId = setTimeout(() => {
                            controller.abort();
                            if (tabId && tabTimeouts.has(tabId)) {
                                tabTimeouts.get(tabId).delete(timeoutId);
                            }
                        }, timeout);
                        
                        // Rastrear timeout
                        if (tabId) {
                            if (!tabTimeouts.has(tabId)) {
                                tabTimeouts.set(tabId, new Set());
                            }
                            tabTimeouts.get(tabId).add(timeoutId);
                        }
                        
                        const response = await fetch(url, { signal: controller.signal }).catch(err => {
                            clearTimeout(timeoutId);
                            if (tabId && tabTimeouts.has(tabId)) {
                                tabTimeouts.get(tabId).delete(timeoutId);
                            }
                            if (err.name === 'AbortError') {
                                debugLog(`⏱️ Timeout ou cancelamento ao buscar ${url} (${timeout}ms)`, 'warn');
                                throw new Error(`Timeout após ${timeout}ms`);
                            }
                            debugLog(`⚠️ Erro de rede ao buscar ${url}: ${err.message}`, 'warn');
                            throw err;
                        }).finally(() => {
                            clearTimeout(timeoutId);
                            if (tabId && tabTimeouts.has(tabId)) {
                                tabTimeouts.get(tabId).delete(timeoutId);
                            }
                            // Remover controller do tracking
                            if (tabId && tabAbortControllers.has(tabId)) {
                                tabAbortControllers.get(tabId).delete(controller);
                                if (tabAbortControllers.get(tabId).size === 0) {
                                    tabAbortControllers.delete(tabId);
                                }
                            }
                        });
                        
                        return response;
                    } catch (err) {
                        debugLog(`⚠️ Erro ao buscar ${url}: ${err.message}`, 'warn');
                        // Retornar um objeto que simula uma resposta HTTP com erro
                        return {
                            ok: false,
                            status: err.message.includes('Timeout') ? 408 : 0,
                            error: err.message,
                            json: async () => ({ error: err.message })
                        };
                    }
                };
                
                // Converter serverId para formato esperado pelo endpoint
                // serverId pode ser "SQLMDMPRD01_101" ou "SQLMDMPRD01\101" ou "SQLMDMPRD01_I01"
                // O endpoint espera server_name e instance como query param
                // IMPORTANTE: O formato pode ser "SQLMDMPRD01_101" mas a instance real é "I01"
                // Vamos tentar usar o serverId diretamente primeiro, depois tentar parsear
                let serverNameForApi = serverId;
                let instanceParam = '';
                
                // Primeiro, tentar usar o endpoint /overview que aceita server_id diretamente
                // Se isso não funcionar, tentar parsear
                const useOverviewEndpoint = true; // Usar endpoint /overview que aceita server_id
                
                if (!useOverviewEndpoint) {
                    // Método antigo: parsear serverId
                    if (serverId.includes('_')) {
                        // Converter "SQLMDMPRD01_101" para "SQLMDMPRD01" com instance="101"
                        // Ou "SQLMDMPRD01_I01" para "SQLMDMPRD01" com instance="I01"
                        const parts = serverId.split('_');
                        serverNameForApi = parts[0];
                        instanceParam = parts.length > 1 ? parts[1] : '';
                    } else if (serverId.includes('\\')) {
                        // Converter "SQLMDMPRD01\101" para "SQLMDMPRD01" com instance="101"
                        const parts = serverId.split('\\');
                        serverNameForApi = parts[0];
                        instanceParam = parts.length > 1 ? parts[1] : '';
                    }
                }
                
                debugLog(`🔧 ServerId original: ${serverId}`, 'info');
                debugLog(`🔧 ServerName para API: ${serverNameForApi}`, 'info');
                debugLog(`🔧 Instance param: ${instanceParam}`, 'info');
                
                // Construir URL - usar endpoint /overview que aceita server_id diretamente
                // Isso é mais confiável porque não precisa parsear o formato
                let serverUrl = `/api/alwayson/server/${encodeURIComponent(serverId)}/overview`;
                
                // Para eventos, ainda precisamos parsear (endpoint antigo)
                let eventsUrl = `/api/alwayson/events/${encodeURIComponent(serverNameForApi)}?days=30`;
                if (instanceParam) {
                    eventsUrl += `&instance=${encodeURIComponent(instanceParam)}`;
                } else if (serverId.includes('_')) {
                    // Tentar extrair instance do serverId
                    const parts = serverId.split('_');
                    if (parts.length > 1) {
                        eventsUrl += `&instance=${encodeURIComponent(parts[1])}`;
                    }
                }
                
                debugLog(`🔗 URLs: serverUrl=${serverUrl}, eventsUrl=${eventsUrl}`, 'info');
                
                // Verificar cache primeiro (usando sistema genérico)
                const cacheResult = getTabCache('always-on', serverId);
                let useCache = false;
                let overview = { success: false, total_ags: 0, ags: [] };
                let serverStatus = { success: false };
                let eventsPayload = { total_events: 0, events: [], patterns: [] };
                
                if (cacheResult.valid) {
                    const cached = cacheResult.data;
                    overview = cached.overview;
                    serverStatus = cached.serverStatus;
                    eventsPayload = cached.eventsPayload;
                    
                    // Debug: verificar se cache tem campo status
                    const cacheHasStatus = !!(serverStatus && serverStatus.status);
                    console.log('[AlwaysOn] Cache verificado:', {
                        hasStatus: cacheHasStatus,
                        cacheAge: cacheResult.age,
                        serverStatusKeys: Object.keys(serverStatus || {})
                    });
                    
                    // Se cache não tem campo status (estrutura antiga), invalidar e buscar novamente
                    if (!cacheHasStatus && serverStatus && serverStatus.is_alwayson) {
                        console.log('[AlwaysOn] Cache inválido (sem campo status) - forçando nova requisição');
                        useCache = false;
                        // Limpar cache antigo
                        clearTabCache('always-on', serverId);
                    } else {
                        useCache = true;
                    }
                }
                
                // Se não usar cache, fazer requisições paralelas
                if (!useCache) {
                    // Buscar overview geral e status do servidor com timeout
                    // Usar endpoint /overview que aceita server_id diretamente (mais confiável)
                    debugLog(`⏳ Iniciando requisições Always On (paralelas)...`, 'info');
                    
                    // PARALELIZAR as 2 requisições principais (removendo overview que trava)
                    // Overview geral foi removido porque tenta conectar a todos os 42 servidores Always On
                    // e está travando a aplicação. Não é crítico para exibir informações do servidor específico.
                    const startTime = Date.now();
                    const [serverRes, eventsRes] = await Promise.all([
                        
                        // Requisição 2: Status do servidor (a mais importante - timeout maior para servidores lentos)
                        // Timeout aumentado para 50s (permite backend responder com cache/timeout em 45s)
                        fetchWithTimeout(serverUrl, 50000).catch(err => {
                            debugLog(`⚠️ Erro ao buscar status do servidor: ${err.message}`, 'warn');
                            return { ok: false, json: async () => ({ is_alwayson: false, error: err.message }) };
                        }),
                        
                        // Requisição 3: Eventos (opcional - pode ser lento)
                        fetchWithTimeout(eventsUrl, 10000).catch(err => {
                            debugLog(`⚠️ Erro ao buscar eventos (não crítico): ${err.message}`, 'warn');
                            return { ok: false, json: async () => ({ total_events: 0, events: [], patterns: [] }) };
                        })
                    ]);
                    
                    // Overview geral não é necessário - retornar vazio (foi removido porque trava)
                    // O endpoint /api/alwayson/overview tenta conectar a todos os 42 servidores Always On
                    // e está travando a aplicação. Não é crítico para exibir informações do servidor específico.
                    overview = { success: false, total_ags: 0, ags: [] };
                    
                    const elapsedTime = Date.now() - startTime;
                    debugLog(`✅ Requisições paralelas concluídas em ${elapsedTime}ms: server=${serverRes?.ok}, events=${eventsRes?.ok}`, 'info');
                    
                    if (serverRes && serverRes.ok) {
                        try {
                            serverStatus = await serverRes.json();
                            // Debug: verificar estrutura recebida
                            console.log('[AlwaysOn] Resposta do endpoint /overview recebida:', {
                                hasStatus: !!serverStatus.status,
                                statusType: typeof serverStatus.status,
                                statusKeys: serverStatus.status ? Object.keys(serverStatus.status) : [],
                                replicasInStatus: serverStatus.status?.replicas?.length || 0,
                                databasesInStatus: serverStatus.status?.databases?.length || 0,
                                fullResponse: JSON.stringify(serverStatus).substring(0, 500)
                            });
                        } catch (e) {
                            debugLog(`⚠️ Erro ao parsear serverStatus: ${e.message}`, 'warn');
                            serverStatus = { success: false, error: e.message };
                        }
                    } else if (serverRes) {
                        // Se retornou 404, o servidor não é Always On - isso é OK
                        if (serverRes.status === 404) {
                            debugLog(`ℹ️ Servidor ${serverNameForApi} não é Always On (404)`, 'info');
                            serverStatus = { success: false, not_alwayson: true };
                        } else if (serverRes.status === 0 || serverRes.error) {
                            // Timeout ou erro de rede
                            debugLog(`⚠️ ServerStatus timeout/erro: ${serverRes.error || 'Timeout'}`, 'warn');
                            serverStatus = { success: false, error: serverRes.error || 'Timeout ao conectar' };
                        } else {
                            debugLog(`⚠️ ServerStatus retornou status ${serverRes.status}`, 'warn');
                            serverStatus = { success: false, error: `HTTP ${serverRes.status}` };
                        }
                    } else {
                        debugLog(`⚠️ ServerStatus não retornou resposta (timeout ou erro)`, 'warn');
                        serverStatus = { success: false, error: 'Timeout ou erro de conexão' };
                    }
                    
                    if (eventsRes && eventsRes.ok) {
                        try {
                            eventsPayload = await eventsRes.json();
                        } catch (e) {
                            debugLog(`⚠️ Erro ao parsear eventsPayload: ${e.message}`, 'warn');
                        }
                    } else if (eventsRes && !eventsRes.ok) {
                        debugLog(`⚠️ Events retornou status ${eventsRes.status}`, 'warn');
                    }
                    
                    // Salvar no cache após processar todos os dados
                    const cacheData = {
                        overview,
                        serverStatus,
                        eventsPayload
                    };
                    setTabCache('always-on', serverId, cacheData);
                }
                
                // Normalizar flag de Always On a partir do payload real da API
                // O endpoint /overview retorna is_alwayson diretamente
                // Se serverStatus.not_alwayson é true, definitivamente não é Always On
                // Também verificar se serverStatus.success é true ou se tem status
                const hasAO = !!(serverStatus && 
                    (serverStatus.is_alwayson === true || 
                     serverStatus.status || 
                     serverStatus.success) && 
                    !serverStatus.not_alwayson &&
                    !serverStatus.error);
                
                debugLog(`📊 Always On Status: hasAO=${hasAO}, is_alwayson=${serverStatus?.is_alwayson}, serverStatus=${JSON.stringify(serverStatus).substring(0, 200)}`, 'info');
                
                // Se houver erro e não for "não é Always On", mostrar mensagem de erro
                if (serverStatus.error && !serverStatus.not_alwayson) {
                    const isTimeout = serverStatus.error.toLowerCase().includes('timeout') || 
                                     serverStatus.error.toLowerCase().includes('aborted');
                    
                    debugLog(`⚠️ Erro ao carregar Always On: ${serverStatus.error}`, 'warn');
                    
                    // Se for timeout, mostrar mensagem mais amigável
                    if (isTimeout) {
                        content.innerHTML = `
                            <div class="card" style="background: #78350f; border-color: #92400e;">
                                <h4 style="color: #fbbf24;"><i class="fas fa-clock"></i> Timeout ao Carregar Always On</h4>
                                <p style="color: #fde68a; margin-top: 12px;">
                                    A conexão com o servidor está demorando mais que o esperado. Isso pode acontecer se:
                                </p>
                                <ul style="color: #fde68a; margin-top: 8px; margin-left: 20px; font-size: 12px;">
                                    <li>O servidor está sobrecarregado</li>
                                    <li>A rede está lenta ou instável</li>
                                    <li>O servidor está processando muitas consultas</li>
                                </ul>
                                <p style="color: #fde68a; margin-top: 12px; font-size: 12px;">
                                    <strong>Erro:</strong> ${serverStatus.error}
                                </p>
                                <p style="color: #fde68a; margin-top: 8px; font-size: 12px;">
                                    <strong>Servidor:</strong> ${serverNameForApi}${instanceParam ? '\\' + instanceParam : ''}
                                </p>
                                <p style="color: #fde68a; margin-top: 12px; font-size: 11px; font-style: italic;">
                                    💡 Dica: Aguarde alguns instantes e tente novamente. O timeout foi aumentado para 15 segundos.
                                </p>
                                <button class="btn" onclick="loadAlwaysOn()" style="margin-top: 12px;">
                                    <i class="fas fa-redo"></i> Tentar Novamente
                                </button>
                            </div>
                        `;
                        return;
                    }
                    
                    // Erro não é timeout - mostrar erro completo
                    content.innerHTML = `
                        <div class="card" style="background: #7f1d1d; border-color: #991b1b;">
                            <h4 style="color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Erro ao Carregar Always On</h4>
                            <p style="color: #fecaca; margin-top: 12px;">
                                Não foi possível carregar as informações de Always On para este servidor.
                            </p>
                            <p style="color: #fecaca; margin-top: 8px; font-size: 12px;">
                                <strong>Erro:</strong> ${serverStatus.error}
                            </p>
                            <p style="color: #fecaca; margin-top: 8px; font-size: 12px;">
                                <strong>Servidor:</strong> ${serverNameForApi}${instanceParam ? '\\' + instanceParam : ''}
                            </p>
                            <button class="btn" onclick="loadAlwaysOn()" style="margin-top: 12px;">
                                <i class="fas fa-redo"></i> Tentar Novamente
                            </button>
                        </div>
                    `;
                    return;
                }

                // Renderizar Always On
                const cacheIndicator = useCache ? `
                    <div style="background: #1e3a8a; border: 1px solid #3b82f6; border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; color: #93c5fd; font-size: 12px;">
                        <i class="fas fa-clock"></i> Dados do cache (${cacheResult.age}s atrás) - 
                        <a href="javascript:void(0)" onclick="clearTabCache('always-on', '${serverId}'); loadAlwaysOn();" style="color: #60a5fa; text-decoration: underline; cursor: pointer;">Atualizar agora</a>
                    </div>
                ` : '';
                
                let html = cacheIndicator + `
                    <div class="stats-grid">
                        <div class="stat-card ${overview.total_ags > 0 ? 'green' : 'yellow'}">
                            <div class="label">Total AGs</div>
                            <div class="value">${overview.total_ags || 0}</div>
                        </div>
                        <div class="stat-card ${hasAO ? 'green' : 'yellow'}">
                            <div class="label">Servidor Always On</div>
                            <div class="value">${hasAO ? 'Sim' : 'Não'}</div>
                        </div>
                    </div>
                `;
                
                // Para endpoint /overview, os dados vêm diretamente em serverStatus
                // Para endpoint antigo, vêm em serverStatus.status
                    const agName = serverStatus.ag_name || (serverStatus.status ? serverStatus.status.ag_name : '');
                const replicasData = serverStatus.replicas || (serverStatus.status ? serverStatus.status.replicas : {});
                const databasesData = serverStatus.databases || (serverStatus.status ? serverStatus.status.databases : {});
                const replicasCount = replicasData.total || serverStatus.replicas?.total || (serverStatus.status ? serverStatus.status.total_replicas : 0);
                const dbCount = databasesData.total || serverStatus.databases?.total || (serverStatus.status ? serverStatus.status.total_databases : 0);
                const role = serverStatus.role || (serverStatus.status ? 'UNKNOWN' : 'UNKNOWN');
                const syncHealth = serverStatus.synchronization_health || (serverStatus.status ? serverStatus.status.synchronization_health : 'UNKNOWN');
                const statusText = syncHealth === 'HEALTHY' ? 'Healthy' : syncHealth;
                
                if (hasAO && agName) {
                    html += `
                        <div class="card">
                            <h4>Availability Group: ${agName}</h4>
                            <div style="margin-top: 12px;">
                                <p><strong>Status:</strong> <span class="badge ${statusText === 'Healthy' ? 'ok' : 'badge-warning'}">${statusText}</span></p>
                                <p><strong>Listener:</strong> ${serverStatus.listener || 'N/A'}</p>
                                <p><strong>Réplicas:</strong> ${replicasCount || 0}</p>
                                <p><strong>Bases:</strong> ${dbCount || 0}</p>
                            </div>
                        </div>
                    `;

                    // Tabelas detalhadas de réplicas e bases
                    // O endpoint /server/{server_name} retorna direto em serverStatus.status.replicas
                    const replicas = [];
                    const databases = [];

                    // Debug: log da estrutura recebida
                    console.log('[AlwaysOn] serverStatus recebido:', {
                        hasStatus: !!serverStatus.status,
                        statusReplicas: serverStatus.status?.replicas?.length || 0,
                        statusDatabases: serverStatus.status?.databases?.length || 0,
                        directReplicas: serverStatus.replicas?.length || 0,
                        directDatabases: serverStatus.databases?.length || 0,
                        fullStatus: serverStatus
                    });

                    // Priorizar estrutura nova (serverStatus.status)
                    if (serverStatus.status && serverStatus.status.replicas) {
                        if (Array.isArray(serverStatus.status.replicas)) {
                        replicas.push(...serverStatus.status.replicas);
                            console.log('[AlwaysOn] Réplicas extraídas de status.replicas:', replicas.length);
                        } else {
                            console.warn('[AlwaysOn] status.replicas não é array:', typeof serverStatus.status.replicas);
                        }
                    } else if (serverStatus.replicas && Array.isArray(serverStatus.replicas)) {
                        // Fallback: resposta direta (sem .status wrapper)
                        replicas.push(...serverStatus.replicas);
                        console.log('[AlwaysOn] Réplicas extraídas de replicas direto:', replicas.length);
                    }

                    if (serverStatus.status && serverStatus.status.databases) {
                        if (Array.isArray(serverStatus.status.databases)) {
                        databases.push(...serverStatus.status.databases);
                            console.log('[AlwaysOn] Databases extraídas de status.databases:', databases.length);
                        } else {
                            console.warn('[AlwaysOn] status.databases não é array:', typeof serverStatus.status.databases);
                        }
                    } else if (serverStatus.databases && Array.isArray(serverStatus.databases)) {
                        // Fallback: resposta direta (sem .status wrapper)
                        databases.push(...serverStatus.databases);
                        console.log('[AlwaysOn] Databases extraídas de databases direto:', databases.length);
                    }
                    
                    console.log('[AlwaysOn] Resultado final - Réplicas:', replicas.length, 'Databases:', databases.length);
                    
                    // Se não tiver detalhes mas é Always On, mostrar mensagem informativa
                    if (replicas.length === 0 && databases.length === 0 && hasAO) {
                        html += `
                            <div class="card" style="border-left: 4px solid #3b82f6;">
                                <h4><i class="fas fa-info-circle"></i> Informações Resumidas</h4>
                                <p style="color: #94a3b8; margin-top: 8px;">
                                    As informações detalhadas de réplicas e databases não estão disponíveis no momento.
                                    O servidor está configurado como Always On (AG: ${agName}).
                                </p>
                                <p style="color: #64748b; font-size: 12px; margin-top: 8px;">
                                    <strong>Role:</strong> ${role} | 
                                    <strong>Sincronização:</strong> ${syncHealth} | 
                                    <strong>Réplicas:</strong> ${replicasCount} | 
                                    <strong>Databases:</strong> ${dbCount}
                                </p>
                            </div>
                        `;
                    }
                    
                    if (replicas.length > 0) {
                        html += `
                            <div class="card">
                                <h4>Réplicas</h4>
                                <div style="overflow-x:auto; margin-top: 12px;">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Servidor</th>
                                                <th>Role</th>
                                                <th>Operacional</th>
                                                <th>Conexão</th>
                                                <th>Health</th>
                                                <th>Modo</th>
                                                <th>Failover</th>
                                                <th>Primária</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${replicas.map(r => `
                                                <tr>
                                                    <td>${r.server_name}</td>
                                                    <td>${r.role}</td>
                                                    <td>${r.operational_state}</td>
                                                    <td>${r.connected_state}</td>
                                                    <td><span class="badge ${r.synchronization_health === 'HEALTHY' ? 'ok' : 'badge-warning'}">${r.synchronization_health}</span></td>
                                                    <td>${r.availability_mode}</td>
                                                    <td>${r.failover_mode}</td>
                                                    <td>${r.is_current_primary ? 'Sim' : 'Não'}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    }
                    if (databases.length > 0) {
                        // Agrupar databases por réplica
                        const databasesByReplica = {};
                        databases.forEach(db => {
                            const replicaName = db.replica_server_name || 'Unknown';
                            if (!databasesByReplica[replicaName]) {
                                databasesByReplica[replicaName] = [];
                            }
                            databasesByReplica[replicaName].push(db);
                        });
                        
                        // Identificar qual réplica é a atual (baseado no servidor selecionado)
                        const currentServerId = serverId.toLowerCase().replace(/[\\_]/g, '');
                        let currentReplicaName = null;
                        Object.keys(databasesByReplica).forEach(replicaName => {
                            const normalizedReplica = replicaName.toLowerCase().replace(/[\\_]/g, '');
                            if (normalizedReplica.includes(currentServerId) || currentServerId.includes(normalizedReplica)) {
                                currentReplicaName = replicaName;
                            }
                        });
                        
                        // Se não encontrou, verificar nas réplicas
                        if (!currentReplicaName && replicas.length > 0) {
                            replicas.forEach(r => {
                                const normalizedReplica = r.server_name.toLowerCase().replace(/[\\_]/g, '');
                                if (normalizedReplica.includes(currentServerId) || currentServerId.includes(normalizedReplica)) {
                                    currentReplicaName = r.server_name;
                                }
                            });
                        }
                        
                        // Renderizar agrupado por réplica
                        html += `
                            <div class="card">
                                <h4>Bases no AG (${databases.length} total - ${Object.keys(databasesByReplica).length} réplica(s))</h4>
                                <div style="overflow-x:auto; margin-top: 12px;">
                        `;
                        
                        // Renderizar cada réplica como uma seção
                        Object.keys(databasesByReplica).sort().forEach(replicaName => {
                            const replicaDbs = databasesByReplica[replicaName];
                            const isCurrentReplica = replicaName === currentReplicaName;
                            const replicaInfo = replicas.find(r => r.server_name === replicaName);
                            const isPrimary = replicaInfo && replicaInfo.role === 'PRIMARY';
                            
                            html += `
                                <div style="margin-bottom: 24px; border-left: 3px solid ${isCurrentReplica ? '#10b981' : (isPrimary ? '#3b82f6' : '#64748b')}; padding-left: 12px;">
                                    <h5 style="margin: 0 0 8px 0; color: ${isCurrentReplica ? '#10b981' : (isPrimary ? '#3b82f6' : '#94a3b8')};">
                                        ${isCurrentReplica ? '📍 ' : ''}${replicaName}
                                        ${isPrimary ? ' <span style="background: #3b82f6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px;">PRIMARY</span>' : ''}
                                        ${isCurrentReplica ? ' <span style="background: #10b981; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px;">ATUAL</span>' : ''}
                                        <span style="color: #64748b; font-size: 12px; font-weight: normal;">(${replicaDbs.length} bases)</span>
                                    </h5>
                                    <table style="width: 100%; margin-top: 8px;">
                                        <thead>
                                            <tr>
                                                <th>Base</th>
                                                <th>Sync State</th>
                                                <th>Health</th>
                                                <th>DB State</th>
                                                <th>Suspensa</th>
                                                <th>Log Send Queue</th>
                                                <th>Redo Queue</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${replicaDbs.map(d => `
                                                <tr>
                                                    <td><strong>${d.database_name}</strong></td>
                                                    <td>${d.synchronization_state}</td>
                                                    <td><span class="badge ${d.synchronization_health === 'HEALTHY' ? 'ok' : 'badge-warning'}">${d.synchronization_health}</span></td>
                                                    <td>${d.database_state}</td>
                                                    <td>${d.is_suspended ? 'Sim' : 'Não'}</td>
                                                    <td>${d.log_send_queue_size ?? 'N/A'}</td>
                                                    <td>${d.redo_queue_size ?? 'N/A'}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            `;
                        });
                        
                        html += `
                                </div>
                            </div>
                        `;
                    }

                    // Eventos recentes e padrões
                    html += `
                        <div class="card">
                            <h4>Eventos e Padrões (30 dias)</h4>
                            ${eventsPayload.total_events === 0 ? '<p style="color:#94a3b8;">Nenhum evento de Always On encontrado.</p>' : ''}
                            ${eventsPayload.total_events > 0 ? `

        // Função auxiliar para carregar resultados de query
        async function loadQueryDiagnostic(queryId, endpoint, queryName, requiresDb = false, isCustom = false, customSql = '') {
            const resultsDiv = document.getElementById('queryResults');
            if (!resultsDiv) return;
            
            // Validar seleção de database se necessário
            // NOTA: requiresDb indica que a query SUPORTA filtro por database, mas não é obrigatório
            // O backend aceita database=None para buscar em todas as bases
            // Portanto, não bloqueamos a execução quando o filtro está em "Todas as Bases"
            // A validação só é necessária para queries que REALMENTE precisam de database específico
            // (atualmente nenhuma query padrão tem essa restrição)
            
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 16px; color: #94a3b8;">Executando ${queryName}...</p>
                </div>
            `;
            
            try {
                debugLog(`🔍 Executando query: ${queryName} em ${endpoint}`, 'info');
                
                let response;
                let data;
                
                // Se for query customizada, fazer POST com SQL
                if (isCustom && customSql) {
                    const dbSelect = document.getElementById('dbFilter');
                    const db = dbSelect ? dbSelect.value : '';
                    
                    const requestBody = {
                        sql: customSql,
                        database: db || null
                    };
                    
                    debugLog(`📤 Enviando query customizada: ${customSql.substring(0, 100)}...`, 'info');
                    
                    response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });
                    
                    if (!response.ok) {
                        const txt = await response.text().catch(() => '');
                        throw new Error(`HTTP ${response.status} ${response.statusText}${txt ? ` - ${txt.substring(0,200)}` : ''}`);
                    }
                    
                    data = await response.json().catch(() => ({}));
                    
                    // Para queries customizadas, os resultados vêm em data.results
                    if (data.success && data.results) {
                        data = { results: data.results, columns: data.columns };
                    }
                } else {
                    // Query padrão - GET como antes
                let finalEndpoint = endpoint;
                if (requiresDb || endpoint.includes('/file-growth/')) {
                    const dbSelect = document.getElementById('dbFilter');
                    const db = dbSelect ? dbSelect.value : '';
                    if (db && db.trim()) {
                        const qs = finalEndpoint.includes('?') ? '&' : '?';
                        finalEndpoint = `${finalEndpoint}${qs}database=${encodeURIComponent(db.trim())}`;
                    }
                }
                    response = await createFetchWithAbort(finalEndpoint);
                if (!response.ok) {
                    const txt = await response.text().catch(() => '');
                    throw new Error(`HTTP ${response.status} ${response.statusText}${txt ? ` - ${txt.substring(0,200)}` : ''}`);
                }
                    data = await response.json().catch(() => ({}));
                }
                debugLog(`📦 Resposta recebida: ${JSON.stringify(data).substring(0, 200)}...`, 'info');
                
                // Detecta automaticamente a propriedade array no payload
                // Para blocking, pode vir como blocking_chains
                // Para queries customizadas, vem em data.results
                let results = [];
                if (isCustom && Array.isArray(data.results)) {
                    results = data.results;
                } else if (Array.isArray(data)) {
                    results = data;
                } else if (Array.isArray(data.data)) {
                    results = data.data;
                } else if (Array.isArray(data.blocking_chains)) {
                    results = data.blocking_chains;
                } else if (Array.isArray(data.slow_queries)) {
                    results = data.slow_queries;
                } else if (Array.isArray(data.log_space)) {
                    results = data.log_space;
                } else if (Array.isArray(data.failing_jobs)) {
                    results = data.failing_jobs;
                } else if (Array.isArray(data.sessions)) {
                    results = data.sessions;
                } else if (Array.isArray(data.fragmented_indexes)) {
                    results = data.fragmented_indexes;
                } else if (Array.isArray(data.tempdb_usage)) {
                    results = data.tempdb_usage;
                } else if (Array.isArray(data.file_growth)) {
                    results = data.file_growth;
                } else if (Array.isArray(data.outdated_stats)) {
                    results = data.outdated_stats;
                } else if (Array.isArray(data.mirroring_status)) {
                    results = data.mirroring_status;
                } else if (Array.isArray(data.database_connections)) {
                    results = data.database_connections;
                } else if (Array.isArray(data.backup_status)) {
                    results = data.backup_status;
                } else if (Array.isArray(data.filegroup_growth_history)) {
                    results = data.filegroup_growth_history;
                } else if (Array.isArray(data.filegroup_growth_forecast)) {
                    results = data.filegroup_growth_forecast;
                } else if (Array.isArray(data.backup_history_analysis)) {
                    results = data.backup_history_analysis;
                } else if (Array.isArray(data.missing_index_analysis)) {
                    results = data.missing_index_analysis;
                } else if (Array.isArray(data.index_fragmentation)) {
                    results = data.index_fragmentation;
                } else {
                    const firstArray = Object.values(data).find(v => Array.isArray(v));
                    results = Array.isArray(firstArray) ? firstArray : [];
                }
                
                // Para queries customizadas, usar colunas do response se disponível
                const columns = isCustom && data.columns ? data.columns : (results.length > 0 ? Object.keys(results[0]) : []);
                
                debugLog(`📊 Resultados encontrados: ${results.length}`, 'info');
                if (results.length > 0) {
                    debugLog(`📋 Primeiro resultado: ${JSON.stringify(results[0]).substring(0, 200)}...`, 'info');
                }
                
                if (results.length === 0) {
                    // Mensagens específicas por tipo de query
                    // Usar tanto queryId quanto endpoint para detectar o tipo
                    const queryType = queryId || (endpoint && endpoint.includes('index-fragmentation') ? 'index-fragmentation' : 
                                                  endpoint && endpoint.includes('log-space') ? 'log-space' :
                                                  endpoint && endpoint.includes('slow-queries') ? 'slow-queries' :
                                                  endpoint && endpoint.includes('blocking') ? 'blocking' :
                                                  endpoint && endpoint.includes('sessions') ? 'sessions' :
                                                  endpoint && endpoint.includes('statistics') ? 'statistics' :
                                                  endpoint && endpoint.includes('tempdb') ? 'tempdb' :
                                                  endpoint && endpoint.includes('file-growth') ? 'file-growth' :
                                                  endpoint && endpoint.includes('backup-history-analysis') ? 'backup-history-analysis' :
                                                  endpoint && endpoint.includes('backup') ? 'backup' :
                                                  endpoint && endpoint.includes('database-connections') ? 'database-connections' :
                                                  endpoint && endpoint.includes('filegroup-growth-history') ? 'filegroup-growth-history' :
                                                  endpoint && endpoint.includes('filegroup-growth-forecast') ? 'filegroup-growth-forecast' :
                                                  endpoint && endpoint.includes('missing-index-analysis') ? 'missing-index-analysis' : '');
                    
                    debugLog(`🔍 Query sem resultados - queryId: ${queryId}, queryType: ${queryType}, endpoint: ${endpoint}`, 'info');
                    
                    let noteMessage = '';
                    if (queryType === 'blocking' || queryId === 'blocking') {
                        noteMessage = 'Nota: Isso pode significar que não há bloqueios ativos no momento, mesmo que o Oracle KPI tenha detectado bloqueios anteriormente.';
                    } else if (queryType === 'log-space' || queryId === 'log-space') {
                        noteMessage = 'Nota: Nenhum database com uso de log transaction detectado acima de 0%. Todos os databases podem estar com logs em estado normal.';
                    } else if (queryType === 'slow-queries' || queryId === 'slow-queries') {
                        noteMessage = 'Nota: Nenhuma query lenta detectada no momento. Todas as queries estão executando dentro dos parâmetros normais.';
                    } else if (queryType === 'sessions' || queryId === 'sessions') {
                        noteMessage = 'Nota: Nenhuma sessão problemática detectada no momento.';
                    } else if (queryType === 'index-fragmentation' || queryId === 'index-fragmentation') {
                        noteMessage = 'Nota: Nenhum índice fragmentado detectado. Todos os índices estão em bom estado.';
                    } else if (queryType === 'statistics' || queryId === 'statistics') {
                        noteMessage = 'Nota: Nenhuma estatística desatualizada detectada. Todas as estatísticas estão atualizadas ou dentro dos parâmetros aceitáveis.';
                    } else if (queryType === 'tempdb' || queryId === 'tempdb') {
                        noteMessage = 'Nota: Nenhum problema detectado no TempDB. O uso está dentro dos parâmetros normais.';
                    } else if (queryType === 'file-growth' || queryId === 'file-growth') {
                        noteMessage = 'Nota: Nenhum problema de crescimento de arquivo detectado. Todos os arquivos estão configurados adequadamente.';
                    } else if (queryType === 'backup' || queryId === 'backup') {
                        noteMessage = 'Nota: Nenhum problema de backup detectado. Todos os backups estão em dia.';
                    } else if (queryType === 'database-connections' || queryId === 'database-connections') {
                        noteMessage = 'Nota: Nenhuma conexão de database detectada no momento.';
                    } else if (queryType === 'filegroup-growth-history' || queryId === 'filegroup-growth-history') {
                        noteMessage = 'Nota: Nenhum histórico de crescimento de filegroups encontrado nos últimos 12 meses.';
                    } else if (queryType === 'filegroup-growth-forecast' || queryId === 'filegroup-growth-forecast') {
                        noteMessage = 'Nota: Nenhuma projeção de crescimento de filegroups disponível no momento.';
                    } else if (queryType === 'backup-history-analysis' || queryId === 'backup-history-analysis') {
                        noteMessage = 'Nota: Nenhum histórico de backup encontrado para análise.';
                    } else if (queryType === 'missing-index-analysis' || queryId === 'missing-index-analysis') {
                        noteMessage = 'Nota: Nenhum índice faltante com alto impacto detectado.';
                    } else {
                        noteMessage = 'Nota: Nenhum resultado encontrado para esta consulta no momento.';
                    }
                    
                    resultsDiv.innerHTML = `
                        <div class="card">
                            <h4>${queryName}</h4>
                            <p style="color: #94a3b8;">Nenhum resultado encontrado.</p>
                            <p style="color: #64748b; font-size: 12px; margin-top: 8px;">
                                ${noteMessage}
                            </p>
                        </div>
                    `;
                    return;
                }
                
                // Ordenar resultados por execution_duration_minutes (mais longos primeiro) se disponível
                if (queryId === 'blocking' && results[0].execution_duration_minutes !== undefined) {
                    results.sort((a, b) => {
                        const aTime = a.execution_duration_minutes !== null ? Number(a.execution_duration_minutes) : -1;
                        const bTime = b.execution_duration_minutes !== null ? Number(b.execution_duration_minutes) : -1;
                        return bTime - aTime; // Ordenar descendente (mais longos primeiro)
                    });
                }
                
                // Criar tabela com resultados
                // Usar colunas do response para queries customizadas, senão usar keys do primeiro resultado
                const tableColumns = columns.length > 0 ? columns : (results.length > 0 ? Object.keys(results[0]) : []);
                
                let html = `
                    <div class="card">
                        <h4>${queryName} (${results.length} resultados)</h4>
                        <div class="table-container" style="margin-top: 16px;">
                            <table>
                                <thead>
                                    <tr>
                `;
                
                // Mapeamento de nomes de colunas para português
                const columnNames = {
                    'session_id': 'SPID',
                    'blocking_session_id': 'Bloqueado Por',
                    'wait_type': 'Tipo de Espera',
                    'wait_time': 'Tempo de Espera (ms)',
                    'wait_resource': 'Recurso Esperado',
                    'login_name': 'Usuário',
                    'program_name': 'Programa',
                    'host_name': 'Host',
                    'session_status': 'Status',
                    'database_name': 'Base de Dados',
                    'DatabaseName': 'Base de Dados',
                    'NumberOfConnections': 'Número de Conexões',
                    'current_statement': 'Comando SQL',
                    'block_type': 'Tipo de Bloqueio',
                    'blocker_login_name': 'Bloqueador - Usuário',
                    'blocker_program_name': 'Bloqueador - Programa',
                    'blocker_host_name': 'Bloqueador - Host',
                    'execution_duration_minutes': 'Duração (min)',
                    'start_time': 'Início',
                    'last_execution_time': 'Última Execução',
                    'creation_time': 'Criação',
                    'execution_count': 'Execuções',
                    'total_elapsed_seconds': 'Tempo Total (s)',
                    'avg_elapsed_seconds': 'Tempo Médio (s)',
                    'total_cpu_seconds': 'CPU Total (s)',
                    'avg_cpu_seconds': 'CPU Médio (s)',
                    'total_logical_reads': 'Leituras Lógicas',
                    'avg_logical_reads': 'Leituras Lógicas Média',
                    'total_physical_reads': 'Leituras Físicas',
                    'statement_text': 'Query SQL'
                };
                
                // Função auxiliar para formatar tempo em segundos
                const formatSeconds = (seconds) => {
                    if (isNaN(seconds) || seconds === null || seconds === undefined) return 'N/A';
                    const numSeconds = Number(seconds);
                    const minutes = numSeconds / 60;
                    const hours = Math.floor(minutes / 60);
                    const mins = Math.floor(minutes % 60);
                    const secs = Math.floor(numSeconds % 60);
                    
                    if (hours > 0) {
                        return `${numSeconds.toFixed(2)}s<br><small style="color: #94a3b8;">(${hours}h ${mins}min ${secs}s)</small>`;
                    } else if (minutes >= 1) {
                        return `${numSeconds.toFixed(2)}s<br><small style="color: #94a3b8;">(${mins}min ${secs}s)</small>`;
                    } else {
                        return `${numSeconds.toFixed(2)}s`;
                    }
                };
                
                // Função auxiliar para formatar tempo em milissegundos
                const formatMilliseconds = (ms) => {
                    if (isNaN(ms) || ms === null || ms === undefined) return 'N/A';
                    const numMs = Number(ms);
                    if (numMs < 1000) {
                        return `${Math.round(numMs)} ms`;
                    } else if (numMs < 60000) {
                        const seconds = numMs / 1000;
                        return `${seconds.toFixed(2)}s<br><small style="color: #94a3b8;">(${Math.round(numMs)} ms)</small>`;
                    } else {
                        const minutes = numMs / 60000;
                        const hours = Math.floor(minutes / 60);
                        const mins = Math.floor(minutes % 60);
                        const secs = Math.floor((numMs % 60000) / 1000);
                        if (hours > 0) {
                            return `${(numMs / 1000).toFixed(2)}s<br><small style="color: #94a3b8;">(${hours}h ${mins}min ${secs}s)</small>`;
                        } else {
                            return `${(numMs / 1000).toFixed(2)}s<br><small style="color: #94a3b8;">(${mins}min ${secs}s)</small>`;
                        }
                    }
                };
                
                // Função para formatar valores
                const formatValue = (key, value) => {
                    if (value === null || value === undefined) return 'N/A';
                    
                    // Formatação especial para execution_duration_minutes
                    if (key === 'execution_duration_minutes') {
                        const minutes = Number(value);
                        if (isNaN(minutes)) return 'N/A';
                        if (minutes < 1) {
                            return '< 1 min';
                        } else if (minutes < 60) {
                            return `${Math.round(minutes)} min`;
                        } else {
                            const hours = Math.floor(minutes / 60);
                            const mins = Math.round(minutes % 60);
                            return `${hours}h ${mins}min`;
                        }
                    }
                    
                    // Detectar e formatar colunas em milissegundos
                    const keyLower = key.toLowerCase();
                    if (keyLower.includes('_ms') || 
                        keyLower.includes('milliseconds') || 
                        key === 'wait_time' ||
                        keyLower.includes('wait_duration') ||
                        (keyLower.includes('time') && keyLower.includes('wait')) ||
                        (keyLower.includes('duration') && keyLower.includes('ms'))) {
                        return formatMilliseconds(value);
                    }
                    
                    // Detectar e formatar colunas em segundos
                    // IMPORTANTE: Verificar datas primeiro para não formatar como tempo
                    const isDateTime = key === 'last_execution_time' || key === 'creation_time' || key === 'start_time' ||
                                      keyLower.includes('_date') || keyLower.includes('_time') && 
                                      (keyLower.includes('execution') || keyLower.includes('creation') || keyLower.includes('start'));
                    
                    if (!isDateTime) {
                        // Verificar se o valor é numérico e parece ser tempo
                        const numValue = Number(value);
                        if (!isNaN(numValue) && numValue > 0) {
                            // Se contém "_seconds" no nome, é segundos
                            if (keyLower.includes('_seconds') || 
                                (keyLower.includes('elapsed') && !keyLower.includes('_time')) ||
                                (keyLower.includes('cpu') && (keyLower.includes('total') || keyLower.includes('avg'))) ||
                                (keyLower.includes('duration') && keyLower.includes('second')) ||
                                (keyLower.includes('worker_time') && numValue < 1000000)) {
                                return formatSeconds(value);
                            }
                            
                            // Se o valor for muito grande (provavelmente microsegundos), converter para segundos primeiro
                            // SQL Server retorna tempos em microsegundos (1000000 = 1 segundo)
                            if (numValue > 100000 && (keyLower.includes('elapsed') || keyLower.includes('worker') || keyLower.includes('cpu')) && 
                                !keyLower.includes('_time')) {
                                // Converter de microsegundos para segundos
                                const seconds = numValue / 1000000.0;
                                return formatSeconds(seconds);
                            }
                        }
                    }
                    
                    // Formatação para datas/horas
                    if (isDateTime) {
                        try {
                            const date = new Date(value);
                            if (isNaN(date.getTime())) return 'N/A';
                            return date.toLocaleString('pt-BR', {
                                day: '2-digit',
                                month: '2-digit',
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            });
                        } catch (e) {
                            return String(value);
                        }
                    }
                    
                    return String(value);
                };
                
                // Cabeçalhos da tabela (usar tableColumns para queries customizadas)
                tableColumns.forEach(key => {
                    const headerName = columnNames[key] || key;
                    html += `<th>${headerName}</th>`;
                });
                
                html += `
                                    </tr>
                                </thead>
                                <tbody>
                `;
                
                // Linhas da tabela
                results.forEach(row => {
                    html += `<tr>`;
                    tableColumns.forEach(key => {
                        const value = row[key];
                        const displayValue = formatValue(key, value);
                        // Destacar colunas importantes
                        let cellClass = '';
                        if (key === 'execution_duration_minutes') {
                            const minutes = Number(value);
                            if (!isNaN(minutes) && minutes > 30) {
                                cellClass = 'style="color: #ef4444; font-weight: 600;"';
                            } else if (!isNaN(minutes) && minutes > 10) {
                                cellClass = 'style="color: #f59e0b; font-weight: 600;"';
                            }
                        }
                        html += `<td ${cellClass}>${displayValue}</td>`;
                    });
                    html += `</tr>`;
                });
                
                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="card" style="background: #7f1d1d; border-color: #991b1b;">
                        <h4 style="color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Erro</h4>
                        <p style="color: #fecaca;">${error.message}</p>
                    </div>
                `;
            }
        }

        // ========================================

        async function loadServices() {
            const content = activeTabId ? openTabs.get(activeTabId)?.contentElement : document.getElementById('contentArea');
            if (!content) return;
            const serverId = selectedServer.server_id;
            
            debugLog(`🔧 Carregando Services...`, 'info');

            content.innerHTML = `

                    <div class="spinner"></div>
                    <p style="margin-top: 16px; color: #94a3b8;">Carregando informações de serviços...</p>
                </div>
            `;
            
            try {
                // Buscar todos os serviços SQL relacionados
                const servicesRes = await createFetchWithAbort(`/api/monitoring/services/server/${serverId}?all_services=true`);
                if (!servicesRes.ok) {
                    throw new Error(`HTTP ${servicesRes.status}: ${await servicesRes.text()}`);
                }
                
                const servicesData = await servicesRes.json();
                const services = servicesData.services || [];
                const runningServices = services.filter(s => s.status === 'Running');
                const stoppedServices = services.filter(s => s.status !== 'Running');
                const criticalServices = services.filter(s => {

                    return name.includes('MSSQLSERVER') || name.includes('SQLSERVERAGENT');
                });
                
                let html = `
                    <div class="stats-grid">
                        <div class="stat-card ${servicesData.is_healthy ? 'green' : 'red'}">
                            <div class="label">Status Geral</div>
                            <div class="value">${servicesData.is_healthy ? 'OK' : 'CRÍTICO'}</div>
                        </div>
                        <div class="stat-card ${runningServices.length > 0 ? 'green' : 'yellow'}">
                            <div class="label">Serviços Rodando</div>
                            <div class="value">${runningServices.length}/${services.length}</div>
                        </div>
                        <div class="stat-card ${stoppedServices.length === 0 ? 'green' : 'red'}">
                            <div class="label">Serviços Parados</div>
                            <div class="value">${stoppedServices.length}</div>
                        </div>
                        <div class="stat-card ${servicesData.critical_down === 0 ? 'green' : 'red'}">

                    <div class="card">

                        <div style="overflow-x: auto; margin-top: 12px;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Serviço</th>
                                        <th>Nome de Exibição</th>
                                        <th>Status</th>
                                        <th>Tipo de Inicialização</th>
                                        <th>Crítico</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;
                
                services.forEach((service, index) => {
                    const isCritical = criticalServices.some(cs => cs.service_name === service.service_name);
                    const isRunning = service.status === 'Running';
                    const statusBadge = isRunning ? 'ok' : 'badge-warning';
                    
                    html += `
                        <tr style="${!isRunning ? 'background: rgba(127, 29, 29, 0.1);' : ''}">
                            <td><strong>${service.service_name}</strong></td>
                            <td>${service.display_name || 'N/A'}</td>
                            <td><span class="badge ${statusBadge}">${service.status}</span></td>
                            <td>${service.start_mode || 'N/A'}</td>
                            <td>${isCritical ? '<span style="color: #fca5a5;">⚠️ Sim</span>' : 'Não'}</td>
                            <td>
                                <button class="btn view-logs-btn" style="padding: 4px 8px; font-size: 12px;" data-service-index="${index}">
                                    Ver Logs
                                </button>
                            </td>
                        </tr>
                    `;
                });
                
                // Armazenar dados dos serviços no contexto para acesso seguro
                window.currentServicesData = {
                    serverId: serverId,
                    services: services
                };
                
                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div id="serviceLogsContainer" style="margin-top: 24px;"></div>
                `;
                
                content.innerHTML = html;
                
                // Adicionar event listeners para os botões de logs (após innerHTML)
                setTimeout(() => {
                    document.querySelectorAll('.view-logs-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const index = parseInt(this.getAttribute('data-service-index'));
                            const serviceData = window.currentServicesData;
                            if (serviceData && serviceData.services && serviceData.services[index]) {

                                loadServiceLogs(serviceData.serverId, service.service_name, service.display_name || service.service_name);

                if (error?.isAbort || error?.name === 'AbortError') {
                    debugLog(`ℹ️ Services cancelado (aba fechada)`, 'info');
                    return;
                }
                debugLog(`❌ Erro: ${error.message}`, 'error');
                if (content) {
                content.innerHTML = `
                    <div class="card" style="background: #7f1d1d; border-color: #991b1b;">
                        <h4 style="color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Erro</h4>
                        <p style="color: #fecaca;">${error.message}</p>
                    </div>

        async function loadServiceLogs(serverId, serviceName, displayName) {
            const container = document.getElementById('serviceLogsContainer');
            if (!container) return;
            
            container.innerHTML = `
                <div class="card">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p style="margin-top: 16px; color: #94a3b8;">
                            <i class="fas fa-search"></i> Verificando o log do serviço <strong>${displayName}</strong>...
                        </p>
                        <p style="margin-top: 8px; color: #64748b; font-size: 12px;">
                            Analisando eventos do Windows Event Viewer (Service Control Manager)
                        </p>
                    </div>
                </div>
            `;
            
            try {
                const encodedServiceName = encodeURIComponent(serviceName);
                const logsRes = await createFetchWithAbort(`/api/monitoring/services/server/${serverId}/logs/${encodedServiceName}?hours=24`);
                if (!logsRes.ok) {
                    throw new Error(`HTTP ${logsRes.status}: ${await logsRes.text()}`);
                }
                
                const logsData = await logsRes.json();
                const logs = logsData.logs || [];
                
                if (logs.length === 0) {
                    container.innerHTML = `
                        <div class="card">
                            <h4>Logs de ${displayName}</h4>
                            <p style="color: #94a3b8;">Nenhum log encontrado nas últimas 24 horas.</p>
                        </div>
                    `;
                    return;
                }
                
                // Separar eventos críticos do Service Control Manager
                // Event IDs importantes: 7031 (stopped unexpectedly), 7034 (terminated unexpectedly), 7035, 7036, 7037, 7038, 7040
                const criticalKeywords = ['stopped', 'failed', 'parou', 'falhou', 'error', 'critical', 'shutdown', 'terminating', 'unexpectedly'];
                const criticalEventIds = [7031, 7034, 7035, 7036, 7037, 7038, 7040]; // Service Control Manager Event IDs
                const criticalLogs = logs.filter(log => {
                    const msg = (log.Message || '').toLowerCase();
                    // Eventos críticos: falhas, paradas inesperadas, erros
                    return criticalKeywords.some(kw => msg.includes(kw)) || 
                           log.Level === 'Error' || log.Level === 'Critical' ||
                           criticalEventIds.includes(log.EventId);
                });
                
                // Agrupar por fonte (apenas Event Viewer para serviços)
                const eventViewerLogs = logs.filter(l => l.SourceType === 'EventLog' || l.SourceType === 'WinEvent' || !l.SourceType);
                const sqlErrorLogs = logs.filter(l => l.SourceType === 'SQLErrorLog');
                const defaultTraceLogs = logs.filter(l => l.SourceType === 'DefaultTrace');
                
                let html = `
                    <div class="card">
                        <h4>Logs de ${displayName} (últimas 24h - ${logs.length} eventos)</h4>
                        <div style="display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;">
                            <span class="badge" style="background: #1e40af;">Event Viewer (Service Control Manager): ${eventViewerLogs.length}</span>
                        </div>
                        <div style="background: rgba(59, 130, 246, 0.1); border-left: 4px solid #3b82f6; padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 12px; color: #cbd5e1;">
                            <strong>ℹ️ Sobre os Logs de Serviço:</strong> Mostra eventos do Windows Event Viewer relacionados ao serviço, incluindo:
                            <ul style="margin: 8px 0 0 20px; padding: 0;">
                                <li>Event IDs 7031, 7034, 7035, 7036, 7037, 7038, 7040 (Service Control Manager)</li>
                                <li>Eventos de início, parada, falhas e mudanças de configuração do serviço</li>
                                <li>Erros e avisos do sistema relacionados ao serviço</li>
                            </ul>
                        </div>
                        ${criticalLogs.length > 0 ? `
                            <div style="background: rgba(220, 38, 38, 0.1); border-left: 4px solid #dc2626; padding: 12px; margin-bottom: 16px; border-radius: 4px;">
                                <strong style="color: #fca5a5;">⚠️ ${criticalLogs.length} eventos críticos encontrados (início/parada/falhas)</strong>
                            </div>
                        ` : ''}
                        <div style="overflow-x: auto; margin-top: 12px; max-height: 600px; overflow-y: auto;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Data/Hora</th>
                                        <th>Event ID</th>
                                        <th>Nível</th>
                                        <th>Origem</th>
                                        <th>Mensagem</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;
                
                logs.forEach(log => {
                    const levelColor = log.Level === 'Error' || log.Level === 'Critical' ? '#dc2626' : 
                                     log.Level === 'Warning' ? '#f59e0b' : '#10b981';
                    const isCritical = criticalLogs.includes(log);
                    const rowBg = isCritical ? 'background: rgba(220, 38, 38, 0.05);' : '';
                    html += `
                        <tr style="${rowBg}">
                            <td><strong>${log.TimeCreated || 'N/A'}</strong></td>
                            <td>${log.EventId || 'N/A'}</td>
                            <td><span style="color: ${levelColor}; font-weight: bold;">${log.Level || 'Information'}</span></td>
                            <td style="font-size: 11px; color: #94a3b8;">${log.Source || log.LogName || 'N/A'}</td>
                            <td style="max-width: 500px; word-wrap: break-word; font-size: 12px;">${(log.Message || 'N/A').substring(0, 400)}${(log.Message || '').length > 400 ? '...' : ''}</td>
                        </tr>
                    `;
                });
                
                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
                
            } catch (error) {
                // Ignorar erros de abort
                if (error?.isAbort || error?.name === 'AbortError') {
                    debugLog(`ℹ️ Service Logs cancelado (aba fechada)`, 'info');
                    return;
                }
                if (container) {
                container.innerHTML = `
                    <div class="card" style="background: #7f1d1d; border-color: #991b1b;">
                        <h4 style="color: #fca5a5;"><i class="fas fa-exclamation-triangle"></i> Erro</h4>
                        <p style="color: #fecaca;">Erro ao carregar logs: ${error.message}</p>
                    </div>
                `;
                }
            }
        }

        let dashboardRefreshInterval = null;
        
        // Estrutura de metadados dos KPIs
        const KPI_METADATA = {
