<!-- @dsCard group="Severity" viewport="700x220" name="Redundant encoding (in use)" subtitle="Severity = left rail + icon + label + badge — never hue alone" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; background: var(--surface-app); display: flex; flex-direction: column; gap: 8px; }
  .alert { display: grid; grid-template-columns: 4px 22px 1fr auto; align-items: center; gap: 12px;
           background: var(--surface-raised); border: 1px solid var(--color-border);
           border-radius: var(--radius-md); padding: 10px 14px 10px 0; }
  .rail { width: 4px; height: 100%; border-radius: var(--radius-md) 0 0 var(--radius-md); align-self: stretch; }
  .ico { width: 22px; text-align: center; font-size: 14px; }
  .body .t { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .body .m { font-size: 12px; color: var(--text-tertiary); font-family: var(--font-mono); margin-top: 2px; }
  .badge { padding: 3px 10px; border-radius: var(--radius-full); font-size: 10px; font-weight: 700;
           text-transform: uppercase; letter-spacing: .04em; margin-right: 14px; }
</style>
</head>
<body>
  <div class="alert">
    <div class="rail" style="background:var(--sev-overflow-border)"></div>
    <div class="ico" style="color:var(--sev-overflow-text)">&#9760;</div>
    <div class="body"><div class="t">PRIMARY filegroup over capacity</div><div class="m">SRV-PRD-01 · FIN_LEDGER · 0% free</div></div>
    <div class="badge" style="background:var(--sev-overflow-solid);color:var(--sev-overflow-on);border:1px solid var(--sev-overflow-border)">Overflow</div>
  </div>
  <div class="alert">
    <div class="rail" style="background:var(--sev-critical-border)"></div>
    <div class="ico" style="color:var(--sev-critical-text)">&#9888;</div>
    <div class="body"><div class="t">Log backup chain broken</div><div class="m">SRV-PRD-04 · 3 days to full</div></div>
    <div class="badge" style="background:var(--sev-critical-solid);color:var(--sev-critical-on)">Critical</div>
  </div>
  <div class="alert">
    <div class="rail" style="background:var(--sev-ok-border)"></div>
    <div class="ico" style="color:var(--sev-ok-text)">&#10003;</div>
    <div class="body"><div class="t">Always On synchronized</div><div class="m">SRV-PRD-02 &rarr; SRV-DR-02 · 0 ms lag</div></div>
    <div class="badge" style="background:var(--sev-ok-solid);color:var(--sev-ok-on)">Healthy</div>
  </div>
</body>
</html>
